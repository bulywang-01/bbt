  function loadHeader() {
    fetch('header.html')
      .then(r => r.text())
      .then(html => {
        const hc = document.getElementById('header-container');
        if (!hc) return;
  
        hc.innerHTML = html;
  
        // ✅ 一律從 session 重新設定 role（唯一正解）
        const session = (typeof getSession === 'function')
          ? getSession()
          : JSON.parse(localStorage.getItem('session_user') || '{}');
  
        document.body.classList.remove(
          'role-admin',
          'role-judge',
          'role-record'
        );
  
        if (session && session.role) {
          const roles = session.role.split(',').map(r => r.trim());
  
          if (roles.includes('admin')) {
            document.body.classList.add('role-admin');
          }
          if (roles.includes('judge') || roles.includes('chief_judge')) {
            document.body.classList.add('role-judge');
          }
          if (roles.includes('record') || roles.includes('record_chief')) {
            document.body.classList.add('role-record');
          }
        }
  
        // ✅ 顯示登入者姓名
        if (session && session.name) {
          const nameEl = document.getElementById('header-username');
          if (nameEl) nameEl.textContent = session.name;
        }
      })
      .catch(err => console.error('Header 載入失敗', err));
  }

/* ✅ JSONP */
function callApi(params, callback){

  const cbName = 'cb_' + Date.now();
  const script = document.createElement('script');

  window[cbName] = function(res){
    console.log('✅ API回來:', res);
    callback(res);

    delete window[cbName];
    script.remove();
  };

  const url = API_BASE + '?' +
    Object.keys(params)
      .map(k => `${k}=${encodeURIComponent(params[k])}`)
      .join('&')
    + '&callback=' + cbName;

  script.src = url;
  document.body.appendChild(script);
}

function selectMonth(m){

function loadReport(){

  const m = currentMonth;

  console.log('month=', m);

  callApi({
    action:'getAttendanceReportV2',
    month:m
  }, res => {

    console.log('✅ API res:', res);

    if(!res || res.result !== 'ok'){
      alert('讀取失敗');
      return;
    }

    // ✅ render 按鈕（第一次）
    renderMonthButtons(res.gameDays);
    
    lastData = res.data;
    lastGameDays = res.gameDays;
    
    updateRoleTabCount(res.data);
    
    render(res.data, res.gameDays);
  });
}

// 排序功能
let currentSort = 'score';

function sortUsers(list){

  const arr = [...list];

if(currentSort === 'score'){

  return arr.sort((a,b)=>
    (b.summary?.yearAttendance || 0)
    -
    (a.summary?.yearAttendance || 0)
  );

}

  if(currentSort === 'quality'){
    return arr.sort((a,b)=>
      (a.summary.no_show || 0) - (b.summary.no_show || 0)
    );
  }

  return arr.sort((a,b)=>
    (a.name || '').localeCompare(b.name || '', 'zh-Hant')
  );
}

function setSort(mode){
  currentSort = mode;
  loadReport();
}


/* ✅ render（用真實日期） */
function render(data, gameDays){

  if(currentView === 'summary'){
    renderSummary(data);
    return;
  }

  if(!gameDays || gameDays.length === 0){

    document.getElementById('reportArea').innerHTML =
      '⚠️ 沒有比賽資料';

    return;
  }

  const today = new Date();
  today.setHours(0,0,0,0);

  const monthMap = {};

  gameDays.forEach(fullDate=>{

    const [y,m,d] = fullDate.split('-');

    if(!monthMap[m]){
      monthMap[m] = [];
    }

    monthMap[m].push(fullDate);

  });

  let html = '';

  let users = Object.values(data);
  
  if(currentRoleTab === 'judge'){
  
    users = users.filter(u => {
  
      const roles = String(u.roles || '');
  
      return (
        roles.includes('judge') ||
        roles.includes('chief_judge')
      );
  
    });
  
  }
  
  if(currentRoleTab === 'record'){
  
    users = users.filter(u => {
  
      const roles = String(u.roles || '');
  
      return (
        roles.includes('record') ||
        roles.includes('record_chief')
      );
  
    });
  
  }
  
  users = sortUsers(users);

  users.forEach(u=>{

    const roleStats = u.roleStats || {};
    const summary = u.summary || {};

    const roleText = Object.keys(roleStats)
      .sort()
      .map(r=>
        `${mapRole(r)}(${roleStats[r]})`
      )
      .join('、');

    html += `
      <div class="user-row">

        <div class="user-header">

          <div class="user-name">
            ${u.name}
            <span class="user-role">
              ${formatRole(u.roles)}
            </span>
          </div>

        </div>

        <div class="user-kpi-text">
        
          <span class="year">
            生涯：${summary.careerAttendance || 0}
          </span>
        
          ｜
        
          <span class="career">
            年度：${summary.yearAttendance || 0}
          </span>
        
          ｜
        
          <span class="late">
            遲到：${summary.late || 0}
          </span>
        
          ｜
        
          <span class="no-show">
            缺席：${summary.no_show || 0}
          </span>
        
          ｜
        
          <span class="support">
            支援：${summary.support || 0}
          </span>
        
        </div>

        <div style="
          font-size:12px;
          color:#666;
          margin-bottom:6px;
        ">
          ${roleText}
        </div>

        <div class="right-panel">
    `;

    Object.keys(monthMap)
      .sort()
      .forEach(m=>{

        html += `
          <div class="month-row">

            <div class="month-label">
              ${Number(m)}月
            </div>

            <div class="days">
        `;

        monthMap[m]
          .sort()
          .forEach(fullDate=>{

            const d = fullDate.split('-')[2];

            const rec =
              (u.days || {})[fullDate] || [];

            let cls='empty';

            if(rec.length){

              const hasSupport =
                rec.some(x=>x.is_replacement);

              const hasNoShow =
                rec.some(x=>x.status==='no_show');

              const hasLate =
                rec.some(x=>x.status==='late');

              const hasCompleted =
                rec.some(x=>x.status==='completed');

              const hasFuture =
                rec.some(x=>
                  x.status==='future_assign' ||
                  x.status==='future_signup'
                );

              if(hasSupport){
                cls='sub';
              }
              else if(hasNoShow){
                cls='no';
              }
              else if(hasLate){
                cls='late';
              }
              else if(hasCompleted){
                cls='ok';
              }
              else if(hasFuture){
                cls='future';
              }

            }

            html += `
              <span
                class="day ${cls}"
                onclick='showDayDetail(
                  ${JSON.stringify(rec)},
                  "${fullDate}"
                )'
              >
                ${Number(d)}
              </span>
            `;

          });

        html += `
            </div>
          </div>
        `;

      });

    html += `
        </div>
      </div>
    `;

  });

  document.getElementById('reportArea').innerHTML =
    html;

}


/*
✅ 手機點 → 展開
✅ 可看當天細節
✅ 不影響桌機
✅ 不改資料結構
*/
function showDayDetail(list, fullDate){

  const modal =
    document.getElementById(
      'dayDetailModal'
    );

  const content =
    document.getElementById(
      'dayDetailContent'
    );

  if(!list || !list.length){

    content.innerHTML =
      `<div>${fullDate}<br>無資料</div>`;

    modal.style.display='flex';

    return;
  }

  let html =
    `<h3>${fullDate}</h3>`;

  list.forEach(x=>{

    let statusText='';

    if(x.is_replacement){

      statusText='🔵 支援';

    }
    else if(x.status==='completed'){

      statusText='✅ 完成';

    }
    else if(x.status==='late'){

      statusText='🟡 遲到';

    }
    else if(x.status==='no_show'){

      statusText='🔴 缺席';

    }
    else if(x.status==='future_assign'){

      statusText='🟢 已指派';

    }
    else if(x.status==='future_signup'){

      statusText='🟢 已報名';

    }

    html += `
      <div style="
        margin-bottom:8px;
        padding:8px;
        border:1px solid #eee;
        border-radius:6px;
      ">

        <div>
          ⚾ ${x.game_code || x.game_id}
        </div>

        <div>
          ${mapRole(x.role)}
        </div>

        <div>
          ${statusText}
        </div>

      </div>
    `;

  });

  content.innerHTML = html;

  modal.style.display='flex';

}

// 角色中文化
function mapRole(role){

  const map = {
    PU:'主審',
    U1:'一壘審',
    U2:'二壘審',
    U3:'三壘審',
    REC_MAIN:'紀錄員',
    REC_VIDEO:'影像紀錄員',
    REC_TRAINEE:'見習紀錄員'
  };

  return map[role] || role;

}

// 身份(role)中文化
function formatRole(roleStr){

  if(!roleStr) return '';

  const map = {
    admin:'系統管理員',
    chief_judge:'裁判長',
    judge:'裁判員',
    record_chief:'紀錄長',
    record:'紀錄員'
  };

  return String(roleStr)
    .split(',')
    .map(r => map[r.trim()] || r)
    .join(' / ');
}

// 新增總表格式程式
  let currentView = 'summary';
  let lastData = null;
  let lastGameDays = null;
  let currentRoleTab = 'all';
  
  // 切換tab
  function switchView(view){
  
    currentView = view;
  
    document
      .getElementById('btnSummary')
      .classList.remove('active');
  
    document
      .getElementById('btnCalendar')
      .classList.remove('active');
  
    if(view === 'summary'){
      document
        .getElementById('btnSummary')
        .classList.add('active');
    }else{
      document
        .getElementById('btnCalendar')
        .classList.add('active');
    }
  
    render(lastData, lastGameDays);
  
  }

  // 切換子tab
  function switchRoleTab(tab){
  
    currentRoleTab = tab;
  
    document
      .querySelectorAll('.role-tab')
      .forEach(btn=>{
        btn.classList.remove('active');
      });
  
    if(tab === 'all'){
      document
        .getElementById('roleAll')
        .classList.add('active');
    }
  
    if(tab === 'judge'){
      document
        .getElementById('roleJudge')
        .classList.add('active');
    }
  
    if(tab === 'record'){
      document
        .getElementById('roleRecord')
        .classList.add('active');
    }
  
    render(
      lastData,
      lastGameDays
    );
  
  }
    
  // 年度總表表格
  function renderSummary(data){
  
    let users =
      Object.values(data)
        .filter(u =>
          (u.summary?.careerAttendance || 0) > 0
        );
    
    if(currentRoleTab === 'judge'){
    
      users = users.filter(u => {
    
        const roles =
          String(u.roles || '');
    
        return (
          roles.includes('judge') ||
          roles.includes('chief_judge')
        );
    
      });
    
    }
    
    if(currentRoleTab === 'record'){
    
      users = users.filter(u => {
    
        const roles =
          String(u.roles || '');
    
        return (
          roles.includes('record') ||
          roles.includes('record_chief')
        );
    
      });
    
    }
    
    users = sortUsers(users);

  
    let html = `
    
      <div class="report-note">
        📌 僅顯示有出勤紀錄之裁判員(長)和紀錄員(長)共 ${users.length} 人
      </div>
    
      <table class="summary-table">
    
        <thead>
          <tr>
            <th>姓名</th>
            <th>年度</th>
            <th>生涯</th>
            <th>遲到</th>
            <th>缺席</th>
            <th>支援</th>
            <th>出席率</th>
            <th>主要位置</th>
          </tr>
        </thead>
    
        <tbody>
    `;
  
    users.forEach(u=>{
  
      const s = u.summary || {};
  
      const total =
        (s.yearAttendance || 0);
  
      const quality =
        total
        ? Math.round(
            (
              (total - (s.no_show || 0))
              / total
            ) * 100
          )
        : 0;
  
      const judgeRoles =
        Object.keys(u.roleStats || {})
          .filter(r =>
            ['PU','U1','U2','U3'].includes(r) &&
            Number(u.roleStats[r] || 0) > 0
          )
          .sort((a,b)=>
            (u.roleStats[b] || 0)
            -
            (u.roleStats[a] || 0)
          );
      
      const recordRoles =
        Object.keys(u.roleStats || {})
          .filter(r =>
            ['REC_MAIN','REC_VIDEO','REC_TRAINEE'].includes(r) &&
            Number(u.roleStats[r] || 0) > 0
          )
          .sort((a,b)=>
            (u.roleStats[b] || 0)
            -
            (u.roleStats[a] || 0)
          );
      
      let roleHtml = '';
      
      if(judgeRoles.length){
      
        roleHtml += `
          <div style="margin-bottom:4px;">
            ${
              judgeRoles.map(r=>
                `<span class="role-badge">
                   ${mapRole(r)}
                   (${u.roleStats[r]})
                 </span>`
              ).join('')
            }
          </div>
        `;
      }
      
      if(recordRoles.length){
      
        roleHtml += `
          <div>
            ${
              recordRoles.map(r=>
                `<span class="role-badge">
                   ${mapRole(r)}
                   (${u.roleStats[r]})
                 </span>`
              ).join('')
            }
          </div>
        `;
      }
  
      html += `
        <tr>
  
          <td class="summary-name">
            ${u.name}
          </td>
  
          <td>${s.yearAttendance || 0}</td>
  
          <td>${s.careerAttendance || 0}</td>
  
          <td style="color:#f57c00;">
            ${s.late || 0}
          </td>
  
          <td style="color:#d32f2f;">
            ${s.no_show || 0}
          </td>
  
          <td style="color:#1976d2;">
            ${s.support || 0}
          </td>
  
          <td>
            ${quality}%
          </td>
  
          <td style="text-align:left">
            ${roleHtml || '—'}
          </td>
  
        </tr>
      `;
    });
  
    html += `
        </tbody>
      </table>
    `;
  
    document.getElementById('reportArea')
      .innerHTML = html;
  }

  // 計算人數用
  function updateRoleTabCount(data){

  const allUsers =
    Object.values(data)
      .filter(u =>
        (u.summary?.careerAttendance || 0) > 0
      );

  const judgeUsers =
    allUsers.filter(u => {

      const roles =
        String(u.roles || '');

      return (
        roles.includes('judge') ||
        roles.includes('chief_judge')
      );

    });

  const recordUsers =
    allUsers.filter(u => {

      const roles =
        String(u.roles || '');

      return (
        roles.includes('record') ||
        roles.includes('record_chief')
      );

    });

  document.getElementById('roleAll').innerHTML =
    `全部 (${allUsers.length})`;

  document.getElementById('roleJudge').innerHTML =
    `裁判 (${judgeUsers.length})`;

  document.getElementById('roleRecord').innerHTML =
    `紀錄 (${recordUsers.length})`;

}
  </script>
