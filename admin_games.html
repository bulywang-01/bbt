<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>賽事管理</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  
  <!-- 共用 CSS（一定要是單獨一行，必須有關閉 >） -->
  <link rel="stylesheet" href="common.css">

  <!-- 頁面內 CSS（一定只能在 <style> 裡） -->
  <style>
    
  /* =====================================================
     基礎版面
  ===================================================== */
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap');
    
  .main{
    padding:20px;
  }

  body{
    background:#eef2f7;
  }

  .panel{
    background:#fff;
    padding:18px;
    border-radius:16px;
    box-shadow:
      0 4px 12px rgba(15,23,42,.08);
    margin-bottom:18px;
    border:1px solid #e2e8f0;
  }
  
  .month-title{
    font-size:16px;
    font-weight:700;
    margin-bottom:8px;
  }
  
  
  /* =====================================================
     Filter
  ===================================================== */
  
  .filter-bar{
    display:flex;
    flex-wrap:wrap;
    gap:16px;
    align-items:center;
  }
  
  /* =====================================================
     Table
  ===================================================== */
  
  table{
    width:100%;
    border-collapse:collapse;
    font-size:14px;
  }
  
  th,
  td{
    border:1px solid #e0e0e0;
    padding:6px 8px;
    text-align:center;
  }
  
  th{
    background:#eef2f6;
    font-weight:600;
  }
  
  tbody tr:nth-child(even){
    background:#fafafa;
  }
  
  tbody tr:hover{
    background:#f0f6ff;
  }
  
  
  /* =====================================================
     Form
  ===================================================== */
  
  input,
  select{
    width:100%;
    padding:4px;
    box-sizing:border-box;
  }
  
  button{
    padding:4px 10px;
    cursor:pointer;
  }
  
  .delete-btn{
    color:#c00;
  }
  
  
  /* =====================================================
     狀態
  ===================================================== */
  
  .expired{
    background:#f3f3f3;
    color:#888;
  }
  
  .finished{
    font-weight:600;
    color:#999;
  }
  
  
  /* =====================================================
     Loading
  ===================================================== */
  
  #loadingOverlay{
    position:fixed;
    top:0;
    left:0;
    width:100vw;
    height:100vh;
    background:rgba(255,255,255,.65);
    display:flex;
    justify-content:center;
    align-items:center;
    z-index:9999;
  }
  
  .loading-box{
    background:#fff;
    padding:24px 32px;
    border-radius:8px;
    text-align:center;
    box-shadow:0 4px 12px rgba(0,0,0,.15);
    font-size:16px;
    color:#333;
  }
  
  .spinner{
    width:36px;
    height:36px;
    border:4px solid #ddd;
    border-top:4px solid #2c7be5;
    border-radius:50%;
    margin:0 auto 12px;
    animation:spin 1s linear infinite;
  }
  
  @keyframes spin{
    to{
      transform:rotate(360deg);
    }
  }
  
  
  /* =====================================================
     說明表格
  ===================================================== */
  
  .table-auto{
    width:auto;
    display:inline-table;
    table-layout:auto;
  }
  
  .table-auto th,
  .table-auto td{
    white-space:nowrap;
  }
  
  
  /* =====================================================
     Styled Table
  ===================================================== */
  
  .styled-table th{
    background:#f8fafc;
    color:#334155;
    border-bottom:2px solid #e2e8f0;
  }
  
  .styled-table th,
  .styled-table td{
    padding:4px 6px;
    line-height:1.4;
    border-color:#f1f5f9;
  }
  
  .styled-table th{
    background:#eef2f6;
    font-weight:600;
  }
  
  .styled-table input,
  .styled-table select{
    height:28px;
    padding:2px 4px;
    font-size:13px;
    box-sizing:border-box;
  }
  
  .styled-table input[type="checkbox"],
  .styled-table input[type="radio"]{
    height:auto;
  }
  
  
  /* =====================================================
     New Game
  ===================================================== */
  
  .new-game-row{
    background:#fff7d6;
    border-radius:6px;
    padding:8px;
    margin-bottom:8px;
    transition:.2s;
  }
  
  .new-game-row:hover{
    background:#ffefb0;
  }
  
  .new-game-row input,
  .new-game-row select{
    border:1px solid #d6a300;
    height:30px;
    font-size:13px;
  }
  
  
  /* =====================================================
     Status Badge
  ===================================================== */
  
  .status-badge{
    display:inline-block;
    padding:4px 10px;
    border-radius:999px;
    font-size:12px;
    font-weight:700;
  }
  
  .status-0{
    background:#dcfce7;
    color:#166534;
  }
  
  .status-1{
    background:#fef9c3;
    color:#854d0e;
  }
  
  .status-2{
    background:#e5e7eb;
    color:#374151;
  }

  .status-4{
    background:#e2e8f0;
    color:#475569;
  }
  
  /* =====================================================
     KPI Cards
  ===================================================== */
  
  .game-kpi-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:12px;
    margin-bottom:16px;
  }
  
  .game-kpi-card{
    background:#fff;
    border-radius:16px;
    padding:20px;
    border:1px solid #e2e8f0;
    box-shadow:
      0 4px 10px rgba(15,23,42,.05);
  }
  
  .game-kpi-label{
    color:#64748b;
    font-size:13px;
  }
  
  .game-kpi-value{
    margin-top:6px;
    font-size:42px;
    font-weight:900;
  }
  
  .game-blue{
    color:#2563eb;
  }
  
  .game-green{
    color:#16a34a;
  }
  
  .game-orange{
    color:#ea580c;
  }
  
  .game-purple{
    color:#7c3aed;
  }
  
  
  /* =====================================================
     Tournament Block
  ===================================================== */
  
  .tournament-block{
    margin-bottom:20px;
  }
  
  .tournament-title{
    background:
      linear-gradient(
        90deg,
        #07142d,
        #1e3a8a
      );
    color:white;
    padding:14px 18px;
    border-radius:16px;
    font-size:18px;
    font-weight:900;
    box-shadow:
      0 4px 12px rgba(15,23,42,.25);
  }
  
  
  /* =====================================================
     Page Header V2
  ===================================================== */
  
  .page-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:24px;
  }
  
  .page-title{
    font-size:24px;
    font-weight:800;
    color:#0f172a;
  }
  
  .page-subtitle{
    font-size:14px;
    margin-top:6px;
    color:#64748b;
  }

  /* =====================================================
     Mobile Support
  ===================================================== */
  
  .desktop-table{
    display:block;
  }
  
  .mobile-game-list{
    display:none;
  }
  
  .mobile-game-card{
    background:#fff;
    border-radius:14px;
    padding:12px;
    margin-bottom:10px;
    border:1px solid #e2e8f0;
    box-shadow:0 2px 8px rgba(0,0,0,.05);
  }
  
  .mobile-game-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:6px;
  }
  
  .game-code{
    color:#2563eb;
    font-size:18px;
    font-weight:900;
  }
  
  .mobile-game-time{
    font-size:14px;
    font-weight:700;
    margin-bottom:4px;
  }
  
  .mobile-game-field{
    font-size:14px;
    color:#64748b;
    margin-bottom:8px;
  } 
    
  .mobile-game-category{
    margin-top:4px;
    color:#64748b;
    font-size:13px;
  }
  
  .mobile-game-teams{
    margin-top:8px;
    font-size:16px;
    font-weight:800;
    line-height:1.6;
  }

  .mobile-game-league{
    font-size:13px;
    color:#475569;
    font-weight:700;
    margin-bottom:6px;
  }
    
  .mobile-game-meta{
    display:flex;
    gap:12px;
    margin-top:10px;
    color:#475569;
    font-size:14px;
    font-weight:700;
  }

  .mobile-game-match{
    font-size:18px;
    font-weight:900;
    margin-top:6px;
    margin-bottom:8px;
  }
    
  .mobile-game-actions{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:6px;
  }
  
  .mobile-game-actions button{
    height:34px;
    border:none;
    border-radius:10px;
    background:#f1f5f9;
  }
  
  .mobile-game-close{
    margin-top:12px;
    color:#94a3b8;
    font-weight:700;
  }

  .mobile-kpi-bar{
    display:flex;
    justify-content:space-around;
    align-items:center;
  
    padding:12px;
    margin-bottom:12px;
  
    background:#fff;
    border-radius:14px;
    border:1px solid #e2e8f0;
  }
  
  .mobile-kpi-bar div{
    text-align:center;
  }
  
  .mobile-kpi-bar span{
    display:block;
    font-size:12px;
    color:#64748b;
  }
  
  .mobile-kpi-bar b{
    font-size:24px;
    font-weight:900;
  }

  #importPreview{
    max-height:300px;
    overflow:auto;
    border-radius:12px;
  }

  /* =====================================================
     Responsive
  ===================================================== */
  
  @media(max-width:768px){
  
    /* KPI 4欄改 2欄 */
  
    .game-kpi-grid{
      grid-template-columns:repeat(2,1fr);
    }

      .game-kpi-value{
        font-size:28px;
      }
  
    .main{
      padding:12px;
    }
  
    .page-title{
      font-size:24px;
    }
  
    .page-subtitle{
      font-size:14px;
    }
  
    .filter-bar{
      display:flex;
      flex-direction:row;
      flex-wrap:wrap;
      align-items:center;
      gap:12px;
    }
  
    .desktop-table{
      display:none;
    }
  
    .mobile-game-list{
      display:block;
    }
  
    .panel{
      padding:12px;
    }
  
    .tournament-title{
      font-size:16px;
    }
  
  }
  </style>
  
</head>

  const cbname = 'cb_admin_' + Date.now() + '_' + Math.random().toString(36).slice(2);

  qs.set('callback', cbname);

  const script = document.createElement('script');

  window[cbname] = function (res) {

// 將各種 Date 字串轉成 yyyy-mm-dd
// ✅ 純日期專用（不碰時區）
function normalizeDate(d) {
  if (!d) return '';
  const s = String(d);

  // 已經是 yyyy-MM-dd
  if (/^\d{4}-\d{2}-\d{2}$/.test(s)) {
    return s;
  }

  // ISO 格式：2026-05-01T16:00:00.000Z
  if (s.includes('T')) {
    return s.split('T')[0];
  }

  // yyyy/MM/dd
  if (s.includes('/')) {
    return s.replace(/\//g, '-');
  }

  return '';
}

// 將各種 Date / Time 字串轉成 HH:mm
function normalizeTime(t) {
  if (!t) return '';

  // 已經是 HH:mm（例如 8:30 / 13:50）
  if (/^\d{1,2}:\d{2}$/.test(t)) {
    const [h, m] = t.split(':');
    return h.padStart(2, '0') + ':' + m;
  }

  // 來自 Excel（1899-12-30 的那種）
  const d = new Date(t);
  if (isNaN(d)) return '';

  const hh = String(d.getHours()).padStart(2, '0');
  const mm = String(d.getMinutes()).padStart(2, '0');
  return `${hh}:${mm}`;
}

// 判斷是否屬於本月（只看日期）
function isInThisMonthByDateStr(dateStr) {
  if (!dateStr) return false;
  const now = new Date();
  const [y, m] = dateStr.split('-');
  return Number(y) === now.getFullYear()
      && Number(m) === (now.getMonth() + 1);
}

// 判斷是否屬於本週（週一～週日，只看日期）
function isInThisWeekByDateStr(dateStr) {
  if (!dateStr) return false;

  const d = new Date(dateStr + 'T00:00:00');
  const now = new Date();

  // 週一為一週開始
  const start = new Date(now);
  start.setDate(now.getDate() - ((now.getDay() + 6) % 7));
  start.setHours(0,0,0,0);

  const end = new Date(start);
  end.setDate(start.getDate() + 7);

  return d >= start && d < end;
}

// KPI Function
function renderGameKPI(games){

  const total = games.length;

  let week = 0;
  let pending = 0;
  let finished = 0;

  const now = new Date();

  games.forEach(g => {

    const dt = new Date(
      `${g.date}T${g.time}`
    );

    if (
      isInThisWeekByDateStr(g.date)
    ) {
      week++;
    }

    if (dt < now) {
      finished++;
    } else {
      pending++;
    }

  });

  // 桌機 KPI
  const k1 = document.getElementById('kpiTotalGames');
  const k2 = document.getElementById('kpiWeekGames');
  const k3 = document.getElementById('kpiPendingGames');
  const k4 = document.getElementById('kpiFinishedGames');

  if (k1) k1.textContent = total;
  if (k2) k2.textContent = week;
  if (k3) k3.textContent = pending;
  if (k4) k4.textContent = finished;

  // 手機 KPI
  const m1 = document.getElementById('mKpiTotalGames');
  const m2 = document.getElementById('mKpiWeekGames');
  const m3 = document.getElementById('mKpiPendingGames');
  const m4 = document.getElementById('mKpiFinishedGames');

  if (m1) m1.textContent = total;
  if (m2) m2.textContent = week;
  if (m3) m3.textContent = pending;
  if (m4) m4.textContent = finished;
}

// 匯入自建賽事資料
function previewImport(){
  
  showLoading('解析 Excel 中…');
  
  const file = document.getElementById('importFile').files[0];
  if (!file) {
    alert('請先選擇 Excel 檔案');
    return;
  }

  const reader = new FileReader();

  reader.onload = function(e){

    const data = new Uint8Array(e.target.result);
    const workbook = XLSX.read(data, { type: 'array' });
    const sheet = workbook.Sheets[workbook.SheetNames[0]];
    const rows = XLSX.utils.sheet_to_json(sheet, { defval:'' });

    // ======================
    // 先檢查 Excel 欄位格式
    // ======================
    const headers =
      XLSX.utils.sheet_to_json(
        sheet,
        {
          header:1
        }
      )[0] || [];
    
    const requiredColumns = [
      'date',
      'time',
      'duration',
      'tournament',
      'category',
      'field',
      'away_team',
      'home_team',
      'umpire_count',
      'position_mode'
    ];
    
    const missingColumns =
      requiredColumns.filter(
        col => !headers.includes(col)
      );
    
    if(missingColumns.length){
    
      document.getElementById(
        'importPreview'
      ).innerHTML = `
    
        <div style="
          background:#fef2f2;
          border:1px solid #fecaca;
          border-radius:12px;
          padding:16px;
          color:#b91c1c;
        ">
    
          <b>
            ❌ Excel格式錯誤
          </b>
    
          <br><br>
    
          缺少欄位：
    
          <ul>
            ${
              missingColumns
                .map(x=>`<li>${x}</li>`)
                .join('')
            }
          </ul>
    
        </div>
    
      `;
    
      hideLoading();
      return;
    }

    if (!rows.length) {
      document.getElementById('importPreview').innerHTML =
        '<div class="panel">⚠️ Excel 沒有資料</div>';
      return;
    }

    // 驗證 & 正規化
    let errors = [];
    importRows = [];

    rows.forEach((row, idx) => {

      let rowErrors = [];

      IMPORT_FIELDS.forEach(f => {
        if (row[f.key] === '' || row[f.key] === undefined) {
          rowErrors.push(`${f.label}空白`);
        }
      });

      if (row.position_mode &&
          !['allow_select','auto_only'].includes(row.position_mode)) {
        rowErrors.push('站位方式錯誤');
      }

      if (rowErrors.length) {
        errors.push(`第 ${idx+2} 列：${rowErrors.join('、')}`);
      }

      importRows.push(row);
    });

    // 有錯誤就直接顯示錯誤
    if (errors.length) {
      document.getElementById('importPreview').innerHTML =
        '<div class="panel" style="color:#c00;">❌ 匯入錯誤：<br>' +
        errors.join('<br>') + '</div>';
      document.getElementById('confirmImportBtn').style.display = 'none';
      return;
    }

    //日期轉換
    // ✅ Excel 日期序號 → yyyy-MM-dd（不碰 UTC）
    function excelDateToISO(value) {
      if (typeof value !== 'number') return value || '';
    
      // Excel 的 1 = 1899-12-31
      const base = new Date(1899, 11, 30);
      base.setDate(base.getDate() + value);
    
      const y = base.getFullYear();
      const m = String(base.getMonth() + 1).padStart(2, '0');
      const d = String(base.getDate()).padStart(2, '0');
    
      return `${y}-${m}-${d}`;
    }

    //時間轉換
    function excelTimeToHHmm(value) {
    if (typeof value !== 'number') return value || '';
  
    const totalMinutes = Math.round(value * 24 * 60);
    const hh = String(Math.floor(totalMinutes / 60)).padStart(2, '0');
    const mm = String(totalMinutes % 60).padStart(2, '0');
  
    return `${hh}:${mm}`;
  }

    // ✅ 正常：顯示完整預覽表格
    let html = '';
    html += '<div class="panel">';
    html += `<div style="margin-bottom:8px;">✅ 共 ${importRows.length} 筆</div>`;
    html += '<table class="styled-table">';
    html += '<thead><tr>';

    IMPORT_FIELDS.forEach(f => {
      html += `<th>${f.label}</th>`;
    });

    html += '</tr></thead><tbody>';

    importRows.forEach(r => {
      html += '<tr>';
      IMPORT_FIELDS.forEach(f => {

    let v = r[f.key];
    
    // ✅ Excel 序列轉換
    if (f.key === 'date') {
      v = excelDateToISO(v);
    }
    if (f.key === 'time') {
      v = excelTimeToHHmm(v);
    }
    if (f.key === 'position_mode') {
      v = positionModeText(v);
    }

        html += `<td>${v}</td>`;
      });
      html += '</tr>';
    });

    html += '</tbody></table></div>';

    document.getElementById('importPreview').innerHTML = html;
    document.getElementById('confirmImportBtn').style.display = 'inline-block';
  };

  reader.readAsArrayBuffer(file);
  hideLoading();
}

// ✅ <input type="date"> 專用：純字串，不碰時區
// ✅ 統一處理：Sheet Date / ISO Z / yyyy-MM-dd / yyyy/MM/dd
function normalizeDateValue(d) {
  if (!d) return '';

  const s = String(d);

  // ✅ 已經是純日期（最安全）
  if (/^\d{4}-\d{2}-\d{2}$/.test(s)) {
    return s;
  }

  // ✅ Apps Script 常見：2026-05-30T16:00:00.000Z
  if (s.endsWith('Z')) {
    const date = new Date(s);

    // ✅ 補回本地時區（台灣 +8）
    date.setMinutes(date.getMinutes() - date.getTimezoneOffset());

    const y = date.getFullYear();
    const m = String(date.getMonth() + 1).padStart(2, '0');
    const d2 = String(date.getDate()).padStart(2, '0');

    return `${y}-${m}-${d2}`;
  }

  // ✅ yyyy/MM/dd
  if (s.includes('/')) {
    return s.replace(/\//g, '-');
  }

  return '';
}

// 賽事狀態
function statusText(s, g){

  s = Number(s);

  // ✅ 1~4 直接判斷
  if (s === 1) return '延賽';
  if (s === 2) return '停賽';
  if (s === 3) return '暫存';   // ✅ 改這裡
  if (s === 4) return '已完賽';

  // ✅ ✅ ✅ status=0 才判斷是否過期
  if (s === 0 && g){
    const partsD = (g.date || '').split('-');
    const partsT = (g.time || '').split(':');

    if (partsD.length === 3 && partsT.length >= 2){
      const dt = new Date(
        Number(partsD[0]),
        Number(partsD[1]) - 1,
        Number(partsD[2]),
        Number(partsT[0]),
        Number(partsT[1])
      );

      if (dt < new Date()){
        return '已結束';   // ✅ ✅ ✅ 用時間判斷
      }
    }
  }

  return '正常';
}

    const partsD = (g.date || '').split('-');
    const partsT = (g.time || '').split(':');
    
    let dt = null;
    
    if (partsD.length === 3 && partsT.length >= 2){
      dt = new Date(
        Number(partsD[0]),
        Number(partsD[1]) - 1,
        Number(partsD[2]),
        Number(partsT[0]),
        Number(partsT[1])
      );
    }
    
    if (!dt || isNaN(dt)) return false;


    // ✅ 已完成
    if (!showFinished && dt < now){
      return false;
    }

    if (mode === 'week'){
      const start = new Date();
      start.setDate(now.getDate() - now.getDay());
      start.setHours(0,0,0,0);

      const end = new Date(start);
      end.setDate(start.getDate() + 7);

      return dt >= start && dt < end;
    }

    if (mode === 'month'){
      return dt.getMonth() === now.getMonth()
          && dt.getFullYear() === now.getFullYear();
    }

    return true;
  });
}

// 批次送出
function saveAll(){

  const rows = document.querySelectorAll('#newList .new-game-row');

  if (!rows.length){
    showToast('沒有資料');
    return;
  }

  let i = 0;
  let success = 0;
  let fail = 0;

  showSaving(`儲存中 (0 / ${rows.length})`);

  function next(){

    if (i >= rows.length){

      hideSaving();
      showToast(`✅ ${success} 成功 / ❌ ${fail} 失敗`,3000);
      loadGames();
      return;
    }

    const r = rows[i];
    const get = k => r.querySelector(`[data="${k}"]`)?.value || '';

    const data = {
      action:'createGame',
      game_code:get('code'),
      date:get('date'),
      time:get('time'),
      field:get('field'),
      away_team:get('away'),
      home_team:get('home'),
      category:get('category')
    };

    showSaving(`儲存中 (${i+1} / ${rows.length})`);

    // ✅ 驗證
    const err = validateGame(data);

    if (err){
      fail++;
      markRow(r,'error',err);

      i++;
      setTimeout(next, 0);   // ✅ 防卡死
      return;
    }

    let finished = false;   // ✅ ✅ ✅ 防 callback 不回來

    callApi(data,function(res){

      if (finished) return;
      finished = true;

      if (res && res.result === 'ok'){
        success++;
        markRow(r,'success');
      }else{
        fail++;
        markRow(r,'error',res?.message || 'API錯誤');
      }

      i++;
      next();
    });

    // ✅ ✅ ✅ 超時保護（超重要🔥）
    setTimeout(()=>{
      if (!finished){
        finished = true;
        fail++;
        markRow(r,'error','Timeout');

        i++;
        next();
      }
    }, 5000); // 5秒沒回當失敗

  }

  next();
}

// 標記（成功 / 失敗）
function markRow(row,type,msg=''){

  if (type==='success'){
    row.style.background='#dcfce7';

    // ✅ 1秒後自動消失
    setTimeout(()=>{
      row.remove();
    },1000);
  }

  if (type==='error'){
    row.style.background='#fee2e2';

    let el=row.querySelector('.err');
    if(!el){
      el=document.createElement('div');
      el.className='err';
      el.style.fontSize='12px';
      el.style.color='#b91c1c';
      row.appendChild(el);
    }
    el.textContent=msg;

    // ✅ 加重送按鈕（重要）
    if (!row.querySelector('.retry-btn')){
      const btn = document.createElement('button');
      btn.textContent = '重送';
      btn.className = 'retry-btn';
      btn.style.marginTop = '6px';

      btn.onclick = ()=>retryRow(row);

      row.appendChild(btn);
    }
  }
}

// 驗證function
function validateGame(data){

  // ✅ 場次
  if (!data.game_code){
    return '請填寫場次';
  }

  // ✅ 日期
  if (!data.date){
    return '日期不可空白';
  }

  // ✅ 時間
  if (!data.time){
    return '時間不可空白';
  }

  // ✅ 時間格式檢查
  if (!/^\d{2}:\d{2}$/.test(data.time)){
    return '時間格式錯誤（HH:mm）';
  }

  const [hh, mm] = data.time.split(':').map(Number);

  if (hh < 0 || hh > 23 || mm < 0 || mm > 59){
    return '時間不合理';
  }

  // ✅ 場地
  if (!data.field){
    return '場地不可空白';
  }

  return '';
}

      ">

        <label style="
          font-size:11px;
          color:#64748b;
          font-weight:700;
        ">
          客隊
        </label>

        <input
          id="e_away_${id}"
          value="${game.away_team || ''}">

        <label style="
          font-size:11px;
          color:#64748b;
          font-weight:700;
          margin-top:4px;
        ">
          主隊
        </label>

        <input
          id="e_home_${id}"
          value="${game.home_team || ''}">

      </div>

    </td>

    <!-- 裁判數 -->

    <td>

      <div style="
        display:flex;
        flex-direction:column;
        gap:4px;
      ">

        <label style="
          font-size:11px;
          color:#64748b;
          font-weight:700;
        ">
          裁判數
        </label>

        <input
          type="number"
          min="0"
          max="4"
          id="e_umpire_${id}"
          value="${game.umpire_count || 0}">

      </div>

    </td>

    <!-- 時長 -->

    <td>

      <div style="
        display:flex;
        flex-direction:column;
        gap:4px;
      ">

        <label style="
          font-size:11px;
          color:#64748b;
          font-weight:700;
        ">
          時長(分鐘)
        </label>

        <input
          type="number"
          min="0"
          max="300"
          id="e_duration_${id}"
          value="${game.duration || 0}">

      </div>

    </td>

    <!-- 狀態 -->

    <td>

      <div style="
        display:flex;
        flex-direction:column;
        gap:4px;
      ">

        <label style="
          font-size:11px;
          color:#64748b;
          font-weight:700;
        ">
          狀態
        </label>

        <select id="e_status_${id}">

          <option
            value="0"
            ${parseStatus===0?'selected':''}>
            正常
          </option>

          <option
            value="1"
            ${parseStatus===1?'selected':''}>
            延賽
          </option>

          <option
            value="2"
            ${parseStatus===2?'selected':''}>
            停賽
          </option>

          <option
            value="3"
            ${parseStatus===3?'selected':''}>
            暫存
          </option>

        </select>

      </div>

    </td>

    <!-- 操作 -->

    <td>

      <div style="
        display:flex;
        gap:4px;
        justify-content:center;
        flex-wrap:wrap;
      ">

        <button
          onclick="saveRow(${id})">
          ✅
        </button>

        <button
          onclick="loadGames()">
          ❌
        </button>

      </div>

    </td>

  `;

}

function saveRow(id){

  const data = {
    action: 'updateGameFull',
    game_id: id,

    game_code:
      document.getElementById(`e_code_${id}`)?.value || '',

    date:
      document.getElementById(`e_date_${id}`)?.value || '',

    time:
      document.getElementById(`e_time_${id}`)?.value || '',

    duration:
      Number(
        document.getElementById(`e_duration_${id}`)?.value || 0
      ),

    tournament:
      document.getElementById(`e_tournament_${id}`)?.value || '',

    field:
      document.getElementById(`e_field_${id}`)?.value || '',

    category:
      document.getElementById(`e_category_${id}`)?.value || '',

    away_team:
      document.getElementById(`e_away_${id}`)?.value || '',

    home_team:
      document.getElementById(`e_home_${id}`)?.value || '',

    umpire_count:
      Number(
        document.getElementById(`e_umpire_${id}`)?.value || 0
      ),

    status:
      Number(
        document.getElementById(`e_status_${id}`)?.value || 0
      )
  };

  console.log('SAVE DATA=', data);

  showSaving('儲存中...');

  callApi(data, function(res){

    hideSaving();

    const ok =
      res === 'ok' ||
      res?.result === 'ok';

    if(ok){

      showToast('✅ 已儲存');

      setTimeout(()=>{
        loadGames();
      },300);

    }else{

      showToast('❌ 儲存失敗');

      console.warn(
        'API回傳錯誤',
        res
      );

    }

  });

}

// 手機版 - 賽事編輯

// 手機版賽事編輯
// ============================
function editMobileGame(id){

  const game = window._games.find(
    g => Number(g.game_id) === Number(id)
  );

  if(!game){
    alert('找不到賽事');
    return;
  }

  const game_code =
    prompt('場次', game.game_code || '');

  if(game_code === null) return;

  const tournament =
    prompt('賽事名稱', game.tournament || '');

  if(tournament === null) return;

  const category =
    prompt('組別', game.category || '');

  if(category === null) return;

  const field =
    prompt('場地', game.field || '');

  if(field === null) return;

  const away_team =
    prompt('客隊', game.away_team || '');

  if(away_team === null) return;

  const home_team =
    prompt('主隊', game.home_team || '');

  if(home_team === null) return;

  const date =
    prompt('日期(YYYY-MM-DD)', game.date || '');

  if(date === null) return;

  const time =
    prompt('時間(HH:mm)', game.time || '');

  if(time === null) return;

  const duration =
    prompt(
      '比賽時間(分鐘)',
      game.duration || 90
    );

  if(duration === null) return;

  const umpire_count =
    prompt(
      '裁判數',
      game.umpire_count || 0
    );

  if(umpire_count === null) return;

  const status =
    prompt(
`狀態：
0=正常
1=延賽
2=停賽
3=暫存
4=已完賽`,
      game.status || 0
    );

  if(status === null) return;

  showSaving('儲存中...');

  callApi({

    action:'updateGameFull',

    game_id:id,

    game_code,

    tournament,

    category,

    field,

    away_team,

    home_team,

    date,

    time,

    duration:Number(duration),

    umpire_count:Number(umpire_count),

    status:Number(status)

  },function(res){

    hideSaving();

    const ok =
      res === 'ok' ||
      res?.result === 'ok';

    if(ok){

      showToast('✅ 已儲存');

      setTimeout(()=>{
        loadGames();
      },300);

    }else{

      showToast('❌ 儲存失敗');

      console.error(res);

    }

  });

}
