<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BBT 聯盟 - 賽事管理中心</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Chart.js & html2canvas -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <!-- SheetJS for Excel Import -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  
  <!-- 共用 CSS -->
  <link rel="stylesheet" href="common.css">

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap');
    
    .main{ padding:20px; }
    body{ background:#eef2f7; font-family: 'Noto Sans TC', sans-serif; }

    .panel{
      background:#fff;
      padding:18px;
      border-radius:16px;
      box-shadow: 0 4px 12px rgba(15,23,42,.08);
      margin-bottom:18px;
      border:1px solid #e2e8f0;
    }
    
    .filter-bar{ display:flex; flex-wrap:wrap; gap:16px; align-items:center; }
    
    table{ width:100%; border-collapse:collapse; font-size:14px; }
    th, td{ border:1px solid #e0e0e0; padding:6px 8px; text-align:center; }
    th{ background:#eef2f6; font-weight:600; }
    tbody tr:nth-child(even){ background:#fafafa; }
    tbody tr:hover{ background:#f0f6ff; }
    
    input, select{ width:100%; padding:4px; box-sizing:border-box; }
    button{ padding:4px 10px; cursor:pointer; }
    
    /* Loading */
    #loadingOverlay{
      position:fixed; top:0; left:0; width:100vw; height:100vh;
      background:rgba(255,255,255,.65); display:flex; justify-content:center; align-items:center; z-index:9999;
    }
    .loading-box{
      background:#fff; padding:24px 32px; border-radius:12px; text-align:center;
      box-shadow:0 4px 12px rgba(0,0,0,.15); font-size:16px; color:#333; font-weight:700;
    }
    .spinner{
      width:36px; height:36px; border:4px solid #ddd; border-top:4px solid #2563eb;
      border-radius:50%; margin:0 auto 12px; animation:spin 1s linear infinite;
    }
    @keyframes spin{ to{ transform:rotate(360deg); } }
    
    /* Styled Table */
    .styled-table th{ background:#f8fafc; color:#334155; border-bottom:2px solid #e2e8f0; }
    .styled-table th, .styled-table td{ padding:6px 8px; line-height:1.4; border-color:#f1f5f9; }
    .styled-table input, .styled-table select{ height:32px; padding:2px 6px; font-size:13px; box-sizing:border-box; border-radius:6px; border:1px solid #cbd5e1; }
    
    /* New Game */
    .new-game-row{ background:#fff7d6; border-radius:10px; padding:10px; margin-bottom:8px; border:1px solid #fde047; }
    .new-game-row input, .new-game-row select{ border:1px solid #d6a300; height:32px; font-size:13px; border-radius:6px; }
    
    /* Status Badge */
    .status-badge{ display:inline-block; padding:4px 10px; border-radius:999px; font-size:12px; font-weight:700; }
    .status-0{ background:#dcfce7; color:#166534; }
    .status-1{ background:#fef9c3; color:#854d0e; }
    .status-2{ background:#e5e7eb; color:#374151; }
    .status-4{ background:#e2e8f0; color:#475569; }
    
    /* KPI Cards */
    .game-kpi-grid{ display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom:16px; }
    .game-kpi-card{ background:#fff; border-radius:16px; padding:18px; border:1px solid #e2e8f0; box-shadow: 0 4px 10px rgba(15,23,42,.05); }
    .game-kpi-label{ color:#64748b; font-size:13px; font-weight:700; }
    .game-kpi-value{ margin-top:6px; font-size:36px; font-weight:900; color:#0f172a; }
    
    /* Tournament Block */
    .tournament-block{ margin-bottom:20px; }
    .tournament-title{
      background: linear-gradient(90deg, #0f172a, #1e3a8a);
      color:white; padding:14px 18px; border-radius:14px; font-size:17px; font-weight:900;
      box-shadow: 0 4px 12px rgba(15,23,42,.2); margin-bottom:10px;
    }
    
    .page-header{ display:flex; justify-content:space-between; align-items:center; margin-bottom:18px; }
    .page-title{ font-size:24px; font-weight:900; color:#0f172a; }
    .page-subtitle{ font-size:13px; margin-top:4px; color:#64748b; }

    /* Mobile Support */
    .desktop-table{ display:block; }
    .mobile-game-list{ display:none; }
    .mobile-game-card{ background:#fff; border-radius:14px; padding:14px; margin-bottom:10px; border:1px solid #e2e8f0; box-shadow:0 2px 8px rgba(0,0,0,.04); }
    .mobile-game-header{ display:flex; justify-content:space-between; align-items:center; margin-bottom:6px; }
    .game-code{ color:#2563eb; font-size:16px; font-weight:900; }
    .mobile-game-time{ font-size:14px; font-weight:700; margin-bottom:4px; color:#1e293b; }
    .mobile-game-league{ font-size:13px; color:#475569; font-weight:700; margin-bottom:6px; }
    .mobile-game-match{ font-size:16px; font-weight:900; margin-top:6px; margin-bottom:10px; color:#0f172a; }
    .mobile-game-actions{ display:grid; grid-template-columns:repeat(4,1fr); gap:6px; }
    .mobile-game-actions button{ height:36px; border:none; border-radius:8px; background:#f1f5f9; font-weight:700; }
    .mobile-game-close{ margin-top:10px; color:#94a3b8; font-weight:700; font-size:13px; text-align:center; }

    .mobile-kpi-bar{ display:flex; justify-content:space-around; align-items:center; padding:12px; margin-bottom:16px; background:#fff; border-radius:14px; border:1px solid #e2e8f0; }
    .mobile-kpi-bar div{ text-align:center; }
    .mobile-kpi-bar span{ display:block; font-size:12px; color:#64748b; font-weight:700; }
    .mobile-kpi-bar b{ font-size:20px; font-weight:900; color:#0f172a; }

    #importPreview{ max-height:300px; overflow:auto; border-radius:10px; }

    @media(max-width:768px){
      .game-kpi-grid{ grid-template-columns:repeat(2,1fr); }
      .game-kpi-value{ font-size:26px; }
      .main{ padding:12px; }
      .desktop-table{ display:none; }
      .mobile-game-list{ display:block; }
    }
  </style>
</head>

<script>
  let importRows = [];
  let loadingTimer = null;

  document.addEventListener('DOMContentLoaded', function () {
    if (typeof lucide !== 'undefined') lucide.createIcons();
    loadUserInfo();
    loadGames();

    document.querySelectorAll('input[name="range"]').forEach(radio => {
      radio.addEventListener('change', loadGames);
    });

    const showExpired = document.getElementById('showExpired');
    if (showExpired) {
      showExpired.addEventListener('change', loadGames);
    }
  });

  function loadUserInfo() {
    const session = (typeof getSession === 'function') ? getSession() : JSON.parse(localStorage.getItem('session_user') || '{}');
    if (session && session.name) {
      document.getElementById('sidebarUserName').textContent = session.name;
      document.getElementById('sidebarUserRole').textContent = session.role || '管理員';
      document.getElementById('sidebarAvatar').textContent = session.name.charAt(0);
    }
  }

  function toggleSidebar() {
    const sidebar = document.getElementById('sidebar');
    const overlay = document.getElementById('sidebar-overlay');
    sidebar.classList.toggle('-translate-x-full');
    overlay.classList.toggle('hidden');
  }

  function logout() {
    localStorage.removeItem('session_user');
    window.location.href = 'login.html';
  }

  function showLoading(text) {
    document.getElementById('loadingText').textContent = text || '處理中...';
    loadingTimer = setTimeout(() => {
      document.getElementById('loadingOverlay').style.display = 'flex';
    }, 300);
  }

  function hideLoading() {
    clearTimeout(loadingTimer);
    loadingTimer = null;
    document.getElementById('loadingOverlay').style.display = 'none';
  }

  function showToast(msg, duration = 2000) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.style.display = 'block';
    setTimeout(() => { t.style.display = 'none'; }, duration);
  }

  function showSaving(text) {
    document.getElementById('savingText').textContent = text || '儲存中…';
    document.getElementById('savingOverlay').style.display = 'flex';
  }

  function hideSaving() {
    document.getElementById('savingOverlay').style.display = 'none';
  }

  function callApiAdminBatch(params, callback) {
    const cbname = 'cb_admin_' + Date.now() + '_' + Math.random().toString(36).slice(2);
    const qs = new URLSearchParams(params);
    qs.set('callback', cbname);

    const script = document.createElement('script');
    script.src = API_BASE + '?' + qs.toString();

    window[cbname] = function (res) {
      try { callback(res); }
      finally { delete window[cbname]; script.remove(); }
    };

    script.onerror = function () {
      delete window[cbname];
      script.remove();
      callback({ result: 'error', message: 'jsonpload_failed_admin' });
    };

    document.head.appendChild(script);
  }

  function isInThisWeekByDateStr(dateStr) {
    if (!dateStr) return false;
    const d = new Date(dateStr + 'T00:00:00');
    const now = new Date();
    const start = new Date(now);
    start.setDate(now.getDate() - ((now.getDay() + 6) % 7));
    start.setHours(0,0,0,0);
    const end = new Date(start);
    end.setDate(start.getDate() + 7);
    return d >= start && d < end;
  }

  function renderGameKPI(games){
    const total = games.length;
    let week = 0, pending = 0, finished = 0;
    const now = new Date();

    games.forEach(g => {
      const dt = new Date(`${g.date}T${g.time}`);
      if (isInThisWeekByDateStr(g.date)) week++;
      if (dt < now) finished++;
      else pending++;
    });

    const m1 = document.getElementById('mKpiTotalGames');
    const m2 = document.getElementById('mKpiWeekGames');
    const m3 = document.getElementById('mKpiPendingGames');
    const m4 = document.getElementById('mKpiFinishedGames');

    if (m1) m1.textContent = total;
    if (m2) m2.textContent = week;
    if (m3) m3.textContent = pending;
    if (m4) m4.textContent = finished;
  }

  function loadGames(){
    showLoading('載入賽事中...');
    callApi({ action:'getGames' }, function(res){
      const container = document.getElementById('gamesContainer');
      container.innerHTML = `<div id="createArea"></div><div id="tableArea"></div>`;
      renderCreateArea();

      const games = (res.games || []).map(g => ({
        ...g,
        game_id: Number(g.game_id),
        status: Number(g.status || 0)
      }));

      window._games = games;
      renderGameKPI(games);
      renderGames(games);
      hideLoading();
    });
  }

  const IMPORT_FIELDS = [
    { key:'game_code', label:'場次' },
    { key:'date', label:'日期' },
    { key:'time', label:'時間' },
    { key:'duration', label:'分鐘' },
    { key:'tournament', label:'賽事名稱' },
    { key:'category', label:'組別' },
    { key:'field', label:'場地' },
    { key:'away_team', label:'客隊' },
    { key:'home_team', label:'主隊' },
    { key:'umpire_count', label:'裁判數' },
    { key:'position_mode', label:'站位方式' },
    { key:'league_type', label:'聯盟類型' },
    { key:'tournament_type', label:'賽事類型' },
    { key:'game_level', label:'層級' }
  ];

  function previewImport(){
    showLoading('解析 Excel 中…');
    const file = document.getElementById('importFile').files[0];
    if (!file) { alert('請先選擇 Excel 檔案'); hideLoading(); return; }

    const reader = new FileReader();
    reader.onload = function(e){
      const data = new Uint8Array(e.target.result);
      const workbook = XLSX.read(data, { type: 'array' });
      const sheet = workbook.Sheets[workbook.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(sheet, { defval:'' });

      const headers = XLSX.utils.sheet_to_json(sheet, { header:1 })[0] || [];
      const requiredColumns = ['date', 'time', 'duration', 'tournament', 'category', 'field', 'away_team', 'home_team', 'umpire_count', 'position_mode'];
      const missingColumns = requiredColumns.filter(col => !headers.includes(col));
      
      if(missingColumns.length){
        document.getElementById('importPreview').innerHTML = `<div style="background:#fef2f2; border:1px solid #fecaca; border-radius:10px; padding:14px; color:#b91c1c;"><b>❌ Excel格式錯誤</b><br><br>缺少欄位：<ul>${missingColumns.map(x=>`<li>${x}</li>`).join('')}</ul></div>`;
        hideLoading();
        return;
      }

      if (!rows.length) {
        document.getElementById('importPreview').innerHTML = '<div class="panel">⚠️ Excel 沒有資料</div>';
        hideLoading();
        return;
      }

      let errors = [];
      importRows = [];

      rows.forEach((row, idx) => {
        let rowErrors = [];
        IMPORT_FIELDS.forEach(f => {
          if (row[f.key] === '' || row[f.key] === undefined) rowErrors.push(`${f.label}空白`);
        });
        if (row.position_mode && !['allow_select','auto_only'].includes(row.position_mode)) rowErrors.push('站位方式錯誤');
        if (rowErrors.length) errors.push(`第 ${idx+2} 列：${rowErrors.join('、')}`);
        importRows.push(row);
      });

      if (errors.length) {
        document.getElementById('importPreview').innerHTML = '<div class="panel" style="color:#c00;">❌ 匯入錯誤：<br>' + errors.join('<br>') + '</div>';
        document.getElementById('confirmImportBtn').style.display = 'none';
        hideLoading();
        return;
      }

      function excelDateToISO(value) {
        if (typeof value !== 'number') return value || '';
        const base = new Date(1899, 11, 30);
        base.setDate(base.getDate() + value);
        const y = base.getFullYear();
        const m = String(base.getMonth() + 1).padStart(2, '0');
        const d = String(base.getDate()).padStart(2, '0');
        return `${y}-${m}-${d}`;
      }

      function excelTimeToHHmm(value) {
        if (typeof value !== 'number') return value || '';
        const totalMinutes = Math.round(value * 24 * 60);
        const hh = String(Math.floor(totalMinutes / 60)).padStart(2, '0');
        const mm = String(totalMinutes % 60).padStart(2, '0');
        return `${hh}:${mm}`;
      }

      let html = `<div class="panel"><div style="margin-bottom:8px; font-weight:700;">✅ 共 ${importRows.length} 筆資料可匯入</div><table class="styled-table"><thead><tr>`;
      IMPORT_FIELDS.forEach(f => { html += `<th>${f.label}</th>`; });
      html += `</tr></thead><tbody>`;

      importRows.forEach(r => {
        html += `<tr>`;
        IMPORT_FIELDS.forEach(f => {
          let v = r[f.key];
          if (f.key === 'date') v = excelDateToISO(v);
          if (f.key === 'time') v = excelTimeToHHmm(v);
          if (f.key === 'position_mode') v = v === 'allow_select' ? '自行選' : '系統排';
          html += `<td>${v}</td>`;
        });
        html += `</tr>`;
      });
      html += `</tbody></table></div>`;

      document.getElementById('importPreview').innerHTML = html;
      document.getElementById('confirmImportBtn').style.display = 'inline-block';
      hideLoading();
    };
    reader.readAsArrayBuffer(file);
  }

  function confirmImport(){
    if (!importRows || !importRows.length){ alert('沒有可匯入資料'); return; }
    showSaving('匯入中...');
    callApiAdminBatch({ action:'importGames', rows: JSON.stringify(importRows) }, function(res){
      hideSaving();
      if(res && res.result === 'ok'){
        showToast(`✅ 已匯入 ${res.count} 筆賽事`);
        loadGames();
      }else{
        alert('❌ 匯入失敗\n' + (res?.message || 'unknown error'));
      }
    });
  }

  function deleteGame(id){
    if (!confirm(`⚠️ 確定刪除此場次？\n將同步刪除關聯的裁判/紀錄報名與指派資料。`)) return;
    const session = JSON.parse(localStorage.getItem('session_user') || '{}');
    callApi({ action: 'deleteGame', game_id: id, user_id: session.user_id }, function(res){
      showToast(res.message || '✅ 已刪除');
      loadGames();
    });
  }

  function statusText(s, g){
    s = Number(s);
    if (s === 1) return '延賽';
    if (s === 2) return '停賽';
    if (s === 3) return '暫存';
    if (s === 4) return '已完賽';

    if (s === 0 && g){
      const partsD = (g.date || '').split('-');
      const partsT = (g.time || '').split(':');
      if (partsD.length === 3 && partsT.length >= 2){
        const dt = new Date(Number(partsD[0]), Number(partsD[1]) - 1, Number(partsD[2]), Number(partsT[0]), Number(partsT[1]));
        if (dt < new Date()) return '已結束';
      }
    }
    return '正常';
  }

  function filterGames(list){
    const mode = document.querySelector('input[name="range"]:checked')?.value || 'all';
    const showFinished = document.getElementById('showExpired')?.checked;
    const now = new Date();

    return list.filter(g => {
      const partsD = (g.date || '').split('-');
      const partsT = (g.time || '').split(':');
      let dt = null;
      if (partsD.length === 3 && partsT.length >= 2){
        dt = new Date(Number(partsD[0]), Number(partsD[1]) - 1, Number(partsD[2]), Number(partsT[0]), Number(partsT[1]));
      }
      if (!dt || isNaN(dt)) return false;

      if (!showFinished && dt < now) return false;

      if (mode === 'week'){
        const start = new Date();
        start.setDate(now.getDate() - now.getDay());
        start.setHours(0,0,0,0);
        const end = new Date(start);
        end.setDate(start.getDate() + 7);
        return dt >= start && dt < end;
      }
      if (mode === 'month'){
        return dt.getMonth() === now.getMonth() && dt.getFullYear() === now.getFullYear();
      }
      return true;
    });
  }

  function renderGames(list){
    const rawList = list.map(g => ({ ...g, _date : g.date || '', _time : g.time || '' }));
    rawList.sort((a,b)=>{
      if((a.tournament || '') !== (b.tournament || '')) return (a.tournament || '').localeCompare(b.tournament || '');
      if(a._date !== b._date) return a._date.localeCompare(b._date);
      return (a._time || '').localeCompare(b._time || '');
    });

    const filtered = filterGames(rawList);
    const container = document.getElementById('tableArea');
    container.innerHTML = '';

    if(!filtered.length){
      container.innerHTML = `<div class="panel" style="text-align:center; color:#94a3b8; font-weight:700; padding:30px;">目前沒有符合條件的賽事資料</div>`;
      return;
    }

    const groups = {};
    filtered.forEach(g => {
      const tournament = g.tournament || '未分類賽事';
      if(!groups[tournament]) groups[tournament] = [];
      groups[tournament].push(g);
    });

    let html = '';
    Object.keys(groups).sort().forEach(tournament => {
      html += `
        <div class="tournament-block">
          <div class="tournament-title">
            <span>📁 ${tournament}</span>
            <span style="float:right; font-size:14px; font-weight:700; opacity:.85;">${groups[tournament].length} 場</span>
          </div>
          <div class="panel">
            <div class="desktop-table">
              <table class="styled-table">
                <thead>
                  <tr>
                    <th>場次</th>
                    <th>日期</th>
                    <th>時間</th>
                    <th>賽事資訊</th>
                    <th>對戰</th>
                    <th>裁判數</th>
                    <th>時長</th>
                    <th>狀態</th>
                    <th>操作</th>
                  </tr>
                </thead>
                <tbody>
      `;

      groups[tournament].forEach(g => {
        const isDone = Number(g.status) === 4 || statusText(g.status, g) === '已結束';
        html += `
          <tr id="row_${g.game_id}" style="${isDone ? 'opacity:.55;' : ''}">
            <td><span style="font-weight:900; color:#2563eb;">${g.game_code || ''}</span></td>
            <td>${g._date || '-'}</td>
            <td>${g._time || '-'}</td>
            <td>
              <div style="text-align:left; line-height:1.6;">
                <div><b>賽事：</b>${g.tournament || '-'}</div>
                <div><b>組別：</b>${g.category || '-'}</div>
                <div><b>場地：</b>${g.field || '-'}</div>
              </div>
            </td>
            <td>
              <div style="text-align:left; line-height:1.6; font-weight:600;">
                <div>客：${g.away_team || '-'}</div>
                <div>主：${g.home_team || '-'}</div>
              </div>
            </td>
            <td><span style="font-weight:700;">${g.umpire_count || 0}</span> 席</td>
            <td><span style="color:#ea580c; font-weight:700;">${g.duration || 0}</span> 分</td>
            <td><span class="status-badge status-${g.status || 0}">${statusText(g.status, g)}</span></td>
            <td>
              ${isDone ? `<span style="color:#94a3b8; font-size:12px; font-weight:600;">已結案</span>` : `
                <div style="display:flex; gap:4px; justify-content:center; flex-wrap:wrap;">
                  <button onclick="editRow(${g.game_id})" title="修改" style="padding:4px 8px; border-radius:6px; border:1px solid #cbd5e1; background:#fff;">✏️</button>
                  <button onclick="location.href='judge_dashboard_admin.html?gameId=${g.game_id}'" title="裁判派遣" style="padding:4px 8px; border-radius:6px; border:1px solid #cbd5e1; background:#fff;">⚖️</button>
                  <button onclick="location.href='record_dashboard_admin.html?gameId=${g.game_id}'" title="紀錄派遣" style="padding:4px 8px; border-radius:6px; border:1px solid #cbd5e1; background:#fff;">📝</button>
                  <button onclick="deleteGame(${g.game_id})" title="刪除" style="padding:4px 8px; border-radius:6px; border:1px solid #fecaca; background:#fef2f2; color:#dc2626;">🗑️</button>
                </div>
              `}
            </td>
          </tr>
        `;
      });

      html += `
                </tbody>
              </table>
            </div>
            
            <div class="mobile-game-list">
              ${groups[tournament].map(g => {
                const isDone = Number(g.status) === 4 || statusText(g.status, g) === '已結束';
                return `
                  <div class="mobile-game-card">
                    <div class="mobile-game-header">
                      <span class="game-code">${g.game_code || '-'}</span>
                      <span class="status-badge status-${g.status || 0}">${statusText(g.status, g)}</span>
                    </div>
                    <div class="mobile-game-league">${g.tournament || '-'}${g.category ? `｜${g.category}` : ''}｜${g.umpire_count || 0}人制</div>
                    <div class="mobile-game-time">🕒 ${g._date || '-'} ${g._time || '-'}（${g.duration || 0}分）｜ 📍 ${g.field || '-'}</div>
                    <div class="mobile-game-match">${g.away_team || '-'} <span style="color:#94a3b8; margin:0 4px; font-weight:400;">vs</span> ${g.home_team || '-'}</div>
                    ${isDone ? `<div class="mobile-game-close">已結案</div>` : `
                      <div class="mobile-game-actions">
                        <button onclick="editMobileGame(${g.game_id})">✏️ 編輯</button>
                        <button onclick="location.href='judge_dashboard_admin.html?gameId=${g.game_id}'">⚖️ 裁判</button>
                        <button onclick="location.href='record_dashboard_admin.html?gameId=${g.game_id}'">📝 紀錄</button>
                        <button onclick="deleteGame(${g.game_id})" style="color:#dc2626;">🗑️ 刪除</button>
                      </div>
                    `}
                  </div>
                `;
              }).join('')}
            </div>
          </div>
        </div>
      `;
    });
    container.innerHTML = html;
  }

  function renderCreateArea(){
    const isMobile = window.innerWidth <= 768;
    const box = document.getElementById('createArea') || document.createElement('div');
    box.id = 'createArea';
    box.className = 'panel';

    box.innerHTML = `
      <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px; margin-bottom:12px;">
        <b style="font-size:16px; color:#0f172a;">➕ 新增賽事場次</b>
        <div style="display:flex; gap:6px; flex-wrap:wrap;">
          <button onclick="addRow()" style="background:#2563eb; color:#fff; border:none; border-radius:8px; font-weight:700; padding:6px 12px;">＋新增列</button>
          <button onclick="saveAll()" style="background:#16a34a; color:#fff; border:none; border-radius:8px; font-weight:700; padding:6px 12px;">✅ 批次送出</button>
          ${!isMobile ? `<button onclick="toggleImportPanel()" style="background:#475569; color:#fff; border:none; border-radius:8px; font-weight:700; padding:6px 12px;">📥 批次匯入</button>` : ''}
        </div>
      </div>
      ${!isMobile ? `
        <div id="importPanel" style="display:none; margin-bottom:12px; padding:16px; background:#f8fafc; border:1px solid #e2e8f0; border-radius:12px;">
          <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px; margin-bottom:12px;">
            <div style="font-size:16px; font-weight:800; color:#0f172a;">📥 Excel 批次匯入賽事</div>
            <a href="TestExportData.xlsx" download style="color:#2563eb; font-weight:700; text-decoration:none;">📄 下載匯入範本</a>
          </div>
          <div style="display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:12px;">
            <input type="file" id="importFile" accept=".xlsx" style="width:auto; border:1px solid #cbd5e1; padding:6px; border-radius:8px; background:#fff;">
            <button onclick="previewImport()" style="background:#2563eb; color:#fff; border:none; border-radius:8px; font-weight:700; padding:6px 12px;">📄 預覽資料</button>
            <button id="confirmImportBtn" style="display:none; background:#16a34a; color:#fff; border:none; border-radius:8px; font-weight:700; padding:6px 12px;" onclick="confirmImport()">✅ 確認匯入</button>
          </div>
          <div id="importPreview"></div>
        </div>
      ` : ''}
      <div id="newList"></div>
    `;
    document.getElementById('gamesContainer').prepend(box);
  }

  function toggleImportPanel(){
    const panel = document.getElementById('importPanel');
    if(!panel) return;
    panel.style.display = panel.style.display === 'block' ? 'none' : 'block';
  }
  
  function addRow(){
    const wrap = document.getElementById('newList');
    const div = document.createElement('div');
    div.className = 'new-game-row';
    div.innerHTML = `
      <div style="display:grid; grid-template-columns:80px 120px 90px 110px 110px 110px 100px; gap:6px; align-items:center;">
        <input placeholder="場次" data="code">
        <input type="date" data="date">
        <input type="time" data="time">
        <input placeholder="場地" data="field">
        <input placeholder="客隊" data="away">
        <input placeholder="主隊" data="home">
        <input placeholder="組別" data="category">
      </div>
      <div style="margin-top:8px; display:flex; gap:6px;">
        <button onclick="saveSingleRow(this)" style="background:#16a34a; color:#fff; border:none; border-radius:6px; font-weight:700; padding:4px 10px;">✅ 儲存</button>
        <button onclick="this.closest('.new-game-row').remove()" style="background:#e2e8f0; color:#334155; border:none; border-radius:6px; font-weight:700; padding:4px 10px;">❌ 取消</button>
      </div>
    `;
    wrap.appendChild(div);
  }

  function validateGame(data){
    if (!data.game_code) return '請填寫場次';
    if (!data.date) return '日期不可空白';
    if (!data.time) return '時間不可空白';
    if (!/^\d{2}:\d{2}$/.test(data.time)) return '時間格式錯誤（HH:mm）';
    if (!data.field) return '場地不可空白';
    return '';
  }

  function saveSingleRow(btn){
    const row = btn.closest('.new-game-row');
    const get = k => row.querySelector(`[data="${k}"]`)?.value || '';
    const data = {
      action:'createGame',
      game_code:get('code'),
      date:get('date'),
      time:get('time'),
      field:get('field'),
      away_team:get('away'),
      home_team:get('home'),
      category:get('category')
    };

    const err = validateGame(data);
    if (err){ showToast(err); return; }

    showSaving('新增中...');
    callApi(data, function(res){
      hideSaving();
      if (res && res.result === 'ok'){
        showToast('✅ 已新增賽事');
        row.style.background = '#dcfce7';
        setTimeout(() => row.remove(), 800);
        loadGames();
      }else{
        showToast('❌ 新增失敗');
      }
    });
  }
  
  function saveAll(){
    const rows = document.querySelectorAll('#newList .new-game-row');
    if (!rows.length){ showToast('沒有可送出的新增列'); return; }

    let i = 0, success = 0, fail = 0;
    showSaving(`儲存中 (0 / ${rows.length})`);

    function next(){
      if (i >= rows.length){
        hideSaving();
        showToast(`✅ 成功 ${success} 筆 / ❌ 失敗 ${fail} 筆`, 3000);
        loadGames();
        return;
      }

      const r = rows[i];
      const get = k => r.querySelector(`[data="${k}"]`)?.value || '';
      const data = {
        action:'createGame',
        game_code:get('code'),
        date:get('date'),
        time:get('time'),
        field:get('field'),
        away_team:get('away'),
        home_team:get('home'),
        category:get('category')
      };

      showSaving(`儲存中 (${i+1} / ${rows.length})`);
      const err = validateGame(data);
      if (err){
        fail++;
        markRow(r, 'error', err);
        i++;
        setTimeout(next, 0);
        return;
      }

      let finished = false;
      callApi(data, function(res){
        if (finished) return;
        finished = true;
        if (res && res.result === 'ok'){
          success++;
          markRow(r, 'success');
        }else{
          fail++;
          markRow(r, 'error', res?.message || 'API錯誤');
        }
        i++;
        next();
      });

      setTimeout(()=>{
        if (!finished){
          finished = true;
          fail++;
          markRow(r, 'error', 'Timeout');
          i++;
          next();
        }
      }, 5000);
    }
    next();
  }

  function markRow(row, type, msg=''){
    if (type === 'success'){
      row.style.background = '#dcfce7';
      setTimeout(()=> row.remove(), 1000);
    }
    if (type === 'error'){
      row.style.background = '#fee2e2';
      let el = row.querySelector('.err');
      if(!el){
        el = document.createElement('div');
        el.className = 'err';
        el.style.fontSize = '12px';
        el.style.color = '#b91c1c';
        el.style.marginTop = '4px';
        row.appendChild(el);
      }
      el.textContent = msg;
    }
  }

  function editRow(id){
    const tr = document.getElementById('row_' + id);
    if(!tr){ showToast('找不到該列'); return; }
    const game = window._games.find(g => Number(g.game_id) === Number(id));
    if(!game){ showToast('找不到賽事'); return; }
    const parseStatus = Number(game.status || 0);

    tr.innerHTML = `
      <td><input id="e_code_${id}" value="${game.game_code || ''}"></td>
      <td><input type="date" id="e_date_${id}" value="${game.date || ''}"></td>
      <td><input type="time" id="e_time_${id}" value="${game.time || ''}"></td>
      <td>
        <div style="text-align:left; display:flex; flex-direction:column; gap:4px;">
          <input id="e_tournament_${id}" value="${game.tournament || ''}" placeholder="賽事名稱">
          <input id="e_category_${id}" value="${game.category || ''}" placeholder="組別">
          <input id="e_field_${id}" value="${game.field || ''}" placeholder="場地">
        </div>
      </td>
      <td>
        <div style="text-align:left; display:flex; flex-direction:column; gap:4px;">
          <input id="e_away_${id}" value="${game.away_team || ''}" placeholder="客隊">
          <input id="e_home_${id}" value="${game.home_team || ''}" placeholder="主隊">
        </div>
      </td>
      <td><input type="number" min="0" max="4" id="e_umpire_${id}" value="${game.umpire_count || 0}"></td>
      <td><input type="number" min="0" max="300" id="e_duration_${id}" value="${game.duration || 0}"></td>
      <td>
        <select id="e_status_${id}">
          <option value="0" ${parseStatus===0?'selected':''}>正常</option>
          <option value="1" ${parseStatus===1?'selected':''}>延賽</option>
          <option value="2" ${parseStatus===2?'selected':''}>停賽</option>
          <option value="3" ${parseStatus===3?'selected':''}>暫存</option>
          <option value="4" ${parseStatus===4?'selected':''}>已完賽</option>
        </select>
      </td>
      <td>
        <div style="display:flex; gap:4px; justify-content:center;">
          <button onclick="saveRow(${id})" style="background:#16a34a; color:#fff; border:none; border-radius:6px; padding:4px 8px;">✅</button>
          <button onclick="loadGames()" style="background:#e2e8f0; color:#334155; border:none; border-radius:6px; padding:4px 8px;">❌</button>
        </div>
      </td>
    `;
  }

  function saveRow(id){
    const data = {
      action: 'updateGameFull',
      game_id: id,
      game_code: document.getElementById(`e_code_${id}`)?.value || '',
      date: document.getElementById(`e_date_${id}`)?.value || '',
      time: document.getElementById(`e_time_${id}`)?.value || '',
      duration: Number(document.getElementById(`e_duration_${id}`)?.value || 0),
      tournament: document.getElementById(`e_tournament_${id}`)?.value || '',
      field: document.getElementById(`e_field_${id}`)?.value || '',
      category: document.getElementById(`e_category_${id}`)?.value || '',
      away_team: document.getElementById(`e_away_${id}`)?.value || '',
      home_team: document.getElementById(`e_home_${id}`)?.value || '',
      umpire_count: Number(document.getElementById(`e_umpire_${id}`)?.value || 0),
      status: Number(document.getElementById(`e_status_${id}`)?.value || 0)
    };

    showSaving('儲存中...');
    callApi(data, function(res){
      hideSaving();
      const ok = res === 'ok' || res?.result === 'ok';
      if(ok){
        showToast('✅ 已成功儲存');
        setTimeout(loadGames, 300);
      }else{
        showToast('❌ 儲存失敗');
      }
    });
  }

  function editMobileGame(id){
    const game = window._games.find(g => Number(g.game_id) === Number(id));
    if(!game){ alert('找不到賽事'); return; }

    const game_code = prompt('場次', game.game_code || '');
    if(game_code === null) return;
    const tournament = prompt('賽事名稱', game.tournament || '');
    if(tournament === null) return;
    const category = prompt('組別', game.category || '');
    if(category === null) return;
    const field = prompt('場地', game.field || '');
    if(field === null) return;
    const away_team = prompt('客隊', game.away_team || '');
    if(away_team === null) return;
    const home_team = prompt('主隊', game.home_team || '');
    if(home_team === null) return;
    const date = prompt('日期(YYYY-MM-DD)', game.date || '');
    if(date === null) return;
    const time = prompt('時間(HH:mm)', game.time || '');
    if(time === null) return;
    const duration = prompt('比賽時間(分鐘)', game.duration || 90);
    if(duration === null) return;
    const umpire_count = prompt('裁判數', game.umpire_count || 0);
    if(umpire_count === null) return;
    const status = prompt('狀態：\n0=正常\n1=延賽\n2=停賽\n3=暫存\n4=已完賽', game.status || 0);
    if(status === null) return;

    showSaving('儲存中...');
    callApi({
      action:'updateGameFull',
      game_id:id,
      game_code, tournament, category, field, away_team, home_team, date, time,
      duration:Number(duration),
      umpire_count:Number(umpire_count),
      status:Number(status)
    }, function(res){
      hideSaving();
      const ok = res === 'ok' || res?.result === 'ok';
      if(ok){
        showToast('✅ 已儲存');
        setTimeout(loadGames, 300);
      }else{
        showToast('❌ 儲存失敗');
      }
    });
  }
</script>
