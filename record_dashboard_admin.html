<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BBT 出勤系統 - 紀錄班表管理與指派</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <!-- ✅ 你原本就有的 JS（一定要） -->
  <script src="js/auth.js"></script>
  <script src="js/config.js"></script>
  <script src="js/record_dashboard_admin.js"></script>
  
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#f0f7ff',
              100: '#e0effe',
              500: '#2563eb',
              600: '#1d4ed8',
              700: '#1e40af',
              900: '#1e3a8a',
            }
          }
        }
      }
    }
  </script>
  
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap');
    body { font-family: 'Noto Sans TC', sans-serif; }
    .custom-scrollbar::-webkit-scrollbar { width: 6px; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }

    /* =========================
     * Mobile Layout
     * ========================= */
    @media (max-width:767px){
    
      #sidebar{
        position: fixed;
        top: 0;
        left: -260px;
        width: 256px;
        height: 100vh;
        z-index: 9999;
        display: flex !important;
        transition: left .25s ease;
      }
    
      #sidebar.mobile-open{
        left: 0;
      }

      #mainContent{
        width:100%;
      } 
      
      /* 賽事標題 */
    
      .game-header{
        flex-direction:column;
        align-items:flex-start !important;
        gap:8px;
      }
    
      /* 站位列 */
    
      .position-row{
        flex-direction:column;
        align-items:flex-start !important;
      }
    
      .position-main{
        width:100%;
      }
    
      .position-actions{
        width:100%;
        margin-top:8px;
        display:flex;
        justify-content:flex-end;
        gap:6px;
      }
    
      .position-actions button{
        min-width:70px;
      }
    
    }
  </style>
  
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen flex">

  <!-- 1. 左側後端導航欄 (Sidebar) -->
  <aside id="sidebar" class="w-64 bg-slate-900 text-slate-300 hidden md:flex flex-col justify-between shrink-0 shadow-xl border-r border-slate-800">
    <div>
      <!-- 系統 Logo 區 -->
      <div class="h-16 flex items-center space-x-3 px-6 bg-slate-950 border-b border-slate-800">
        <div class="bg-brand-600 p-2 rounded-xl text-white shadow-md">
          <i data-lucide="shield-check" class="w-5 h-5"></i>
        </div>
        <div>
          <h1 class="font-black text-white text-base tracking-wide">BBT 管理控制台</h1>
          <p class="text-[10px] text-slate-400">出勤與排班後端管理系統</p>
        </div>
      </div>

      <!-- 導航選單 -->
      <nav class="p-3.5 space-y-1 text-xs font-semibold overflow-y-auto max-h-[calc(100vh-140px)]">
  
        <!-- Dashboard -->
        <div class="text-[10px] text-slate-500 font-bold px-3 pt-2 pb-1 uppercase tracking-wider">
          主控數據中心
        </div>
  
        <a href="admin_dashboard.html"
           class="flex items-center justify-between px-3 py-2.5 rounded-xl bg-brand-600 text-white font-bold shadow-lg shadow-brand-600/30">
  
          <div class="flex items-center space-x-3">
            <i data-lucide="layout-dashboard" class="w-4 h-4"></i>
            <span>管理總覽</span>
          </div>
  
          <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
  
        </a>
  
        <!-- 排班管理 -->
  
        <div class="text-[10px] text-slate-500 font-bold px-3 pt-4 pb-1 uppercase tracking-wider">
          排班管理
        </div>
  
        <a href="judge_dashboard_admin.html"
           class="flex items-center justify-between px-3 py-2.5 rounded-xl hover:bg-slate-800 hover:text-white transition">
  
          <div class="flex items-center space-x-3">
            <i data-lucide="flag" class="w-4 h-4"></i>
            <span>裁判排班</span>
          </div>
  
          <span id="sidebarJudgeShortage"
                class="text-[10px] text-rose-400">
          </span>
  
        </a>
  
        <a href="record_dashboard_admin.html"
           class="flex items-center justify-between px-3 py-2.5 rounded-xl hover:bg-slate-800 hover:text-white transition">
  
          <div class="flex items-center space-x-3">
            <i data-lucide="clipboard-list" class="w-4 h-4"></i>
            <span>紀錄排班</span>
          </div>
  
          <span id="recordVacancyBadge"
                class="text-[10px] text-emerald-400">
          </span>
  
        </a>
  
        <!-- 出勤管理 -->
  
        <div class="text-[10px] text-slate-500 font-bold px-3 pt-4 pb-1 uppercase tracking-wider">
          出勤管理
        </div>
  
        <a href="assignment_execution.html"
           class="flex items-center justify-between px-3 py-2.5 rounded-xl hover:bg-slate-800 hover:text-white transition">
  
          <div class="flex items-center space-x-3">
            <i data-lucide="clipboard-check" class="w-4 h-4"></i>
            <span>出勤確認</span>
          </div>
  
          <span id="sidebarPendingConfirm"
                class="text-[10px] text-amber-400">
          </span>
  
        </a>
  
        <!-- 系統管理 -->
  
        <div class="text-[10px] text-slate-500 font-bold px-3 pt-4 pb-1 uppercase tracking-wider">
          系統管理
        </div>
  
        <a href="admin_games.html"
           class="flex items-center space-x-3 px-3 py-2.5 rounded-xl hover:bg-slate-800 hover:text-white transition">
  
          <i data-lucide="calendar-range" class="w-4 h-4"></i>
          <span>賽事管理</span>
  
        </a>
  
        <a href="admin_users.html"
           class="flex items-center justify-between px-3 py-2.5 rounded-xl hover:bg-slate-800 hover:text-white transition">
  
          <div class="flex items-center space-x-3">
            <i data-lucide="users" class="w-4 h-4"></i>
            <span>帳號管理</span>
          </div>
  
          <span id="sidebarUserCount"
                class="text-[10px] text-slate-500">
          </span>
  
        </a>
  
        <!-- 報表 -->
  
        <div class="text-[10px] text-slate-500 font-bold px-3 pt-4 pb-1 uppercase tracking-wider">
          統計報表
        </div>
  
        <a href="#"
           onclick="openAnnualModal('judge')"
           class="flex items-center space-x-3 px-3 py-2.5 rounded-xl hover:bg-slate-800 hover:text-white transition">
  
          <i data-lucide="bar-chart-3" class="w-4 h-4"></i>
          <span>裁判年度總表</span>
  
        </a>
  
        <a href="#"
           onclick="openAnnualModal('record')"
           class="flex items-center space-x-3 px-3 py-2.5 rounded-xl hover:bg-slate-800 hover:text-white transition">
  
          <i data-lucide="pie-chart" class="w-4 h-4"></i>
          <span>紀錄年度總表</span>
  
        </a>
  
        <a href="report.html"
           class="flex items-center space-x-3 px-3 py-2.5 rounded-xl hover:bg-slate-800 hover:text-white transition">
  
          <i data-lucide="file-bar-chart" class="w-4 h-4"></i>
          <span>出勤報表</span>
  
        </a>
  
      </nav>
    </div>

    <!-- 底部管理員 Profile -->
    <div class="p-4 border-t border-slate-800 bg-slate-950 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <div id="sidebarAvatar" class="w-9 h-9 rounded-xl bg-amber-500 text-slate-900 font-black flex items-center justify-center text-sm">-</div>
        <div>
          <div id="sidebarUserName" class="text-xs font-bold text-white">-</div>
          <div id="sidebarUserRole" class="text-[10px] text-amber-400">-</div>
        </div>
      </div>
      <button title="登出系統" onclick="logout()" class="p-2 text-slate-400 hover:text-rose-400 hover:bg-slate-800 rounded-lg transition">
        <i data-lucide="log-out" class="w-4 h-4"></i>
      </button>
    </div>
  </aside>
  <div id="sidebarOverlay" class="hidden fixed inset-0 bg-black/40 z-[9998]"></div>

  <!-- 2. 右側主要操作區 (Main Content Area) -->
  <div id="mainContent" class="flex-1 flex flex-col min-w-0 overflow-y-auto">

    <!-- 頂部 Header -->
    <header class="bg-white border-b border-slate-200 h-16 flex items-center justify-between px-4 md:px-6 sticky top-0 z-20 shadow-sm">
    
      <div class="flex items-center gap-3">
    
        <!-- 手機版選單按鈕 -->
        <button
          id="mobileMenuBtn"
          class="md:hidden p-2 rounded-xl border border-slate-200 bg-white hover:bg-slate-50">
    
          <i data-lucide="menu" class="w-5 h-5"></i>
    
        </button>
    
        <div>
    
          <h2 class="font-black text-slate-900 text-3xl sm:text-4xl tracking-tight">
            紀錄班表與指派管理
          </h2>
    
        </div>
    
      </div>
    
      <div class="flex items-center space-x-3">
        <!-- 預留未來功能 -->
      </div>
    
    </header>

    <!-- 主內容面板 -->
    <main class="p-6 space-y-6 max-w-7xl w-full mx-auto">

      <!-- KPI -->
      <div id="record-kpi"
           class="grid grid-cols-2 lg:grid-cols-4 gap-4">
      
        <div
          id="kpiAllCard"
          onclick="setKpiFilter('ALL')"
          class="bg-white rounded-2xl border border-slate-200 p-4 cursor-pointer hover:shadow-md transition">
          
          <div class="text-xs text-slate-500">年度需求賽事</div>
          <div id="kpiWeekGames"  
               class="text-3xl font-black">
            -
          </div>
        </div>
      
        <div
          id="kpiVacancyCard"
          onclick="setKpiFilter('VACANCY')"
          class="bg-white rounded-2xl border border-slate-200 p-4 cursor-pointer hover:shadow-md transition">

          <div class="text-xs text-slate-500">缺額席位</div>
          <div id="kpiRecordVacancy"
               class="text-3xl font-black text-rose-600">
            -
          </div>
        </div>
      
        <div
          id="kpiAssignedCard"
          onclick="setKpiFilter('ASSIGNED')"
          class="bg-white rounded-2xl border border-slate-200 p-4 cursor-pointer hover:shadow-md transition">
          
          <div class="text-xs text-slate-500">完成報名或指派</div>
          <div id="kpiAssigned"
               class="text-3xl font-black text-emerald-600">
            -
          </div>
        </div>
      
        <div
          id="kpiPendingCard"
          onclick="setKpiFilter('PENDING')"
          class="bg-white rounded-2xl border border-slate-200 p-4 cursor-pointer hover:shadow-md transition">
          
          <div class="text-xs text-slate-500">有缺額賽事</div>
          <div id="kpiPending"
               class="text-3xl font-black text-amber-500">
            -
          </div>
        </div>
      
      </div>
      
      <!-- 快捷篩選與狀態列 -->
      <!-- 篩選日期，選擇當月賽事 -->
      <div id="monthTabs" class="flex gap-2 overflow-x-auto mb-3"></div>
      <!-- 各日期賽事裁判報名或指派狀態 -->
      <div class="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm flex flex-col sm:flex-row items-center justify-between gap-4">
        <div id="dateTabs" class="flex items-center space-x-2 overflow-x-auto w-full sm:w-auto"></div>

        <div class="flex items-center space-x-3 text-xs font-bold text-slate-500 shrink-0">
          <span class="flex items-center space-x-1"><span class="w-2.5 h-2.5 rounded-full bg-emerald-500 inline-block"></span><span>已滿編</span></span>
          <span class="flex items-center space-x-1"><span class="w-2.5 h-2.5 rounded-full bg-amber-500 inline-block"></span><span>尚有缺額</span></span>
          <span class="flex items-center space-x-1"><span class="w-2.5 h-2.5 rounded-full bg-rose-500 inline-block"></span><span>完全未指派</span></span>
        </div>
      </div>

      <!-- 賽事日列表區 -->

      <!-- 日期群組 1：2026/11/07 -->
      <!-- 裁判班表內容區 -->
      <div id="content">
      
        <div class="bg-white rounded-2xl border border-slate-200 p-8 text-center text-slate-400">
          載入中...
        </div>
      
      </div>

    </main>
  </div>

  <!-- 3. 全新互動式「指派裁判」彈出視窗 (Assignment Modal) -->
  <div id="assignModal" onclick="handleModalBackdrop(event)" class="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm hidden flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl shadow-2xl border border-slate-200 w-full max-w-lg overflow-hidden transform transition-all">
      
      <!-- Modal Header -->
      <div class="bg-slate-900 text-white p-5 flex items-center justify-between">
        <div>
          <h3 class="font-black text-base" id="modalTitle">指派紀錄人員</h3>
          <p class="text-xs text-slate-400 mt-0.5" id="modalMatchInfo">賽事資訊</p>
        </div>
        <button onclick="closeRecordModal()" class="text-slate-400 hover:text-white p-1 rounded-lg transition">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>

      <!-- 搜尋列 -->
      <div class="p-4 border-b border-slate-100 bg-slate-50">
        <div class="relative">
          <i data-lucide="search" class="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"></i>
          <input type="text" placeholder="搜尋紀錄姓名..." class="w-full bg-white border border-slate-200 rounded-xl pl-9 pr-4 py-2 text-xs font-bold text-slate-800 focus:outline-none focus:border-brand-500 shadow-inner">
        </div>
      </div>

      <!-- 紀錄清單 (卡片式高質感網格) -->
      <div id="recordList" class="p-4 max-h-80 overflow-y-auto custom-scrollbar space-y-2">
        <div class="text-center py-6 text-slate-400">
          載入中...
        </div>
      </div>

      <!-- Modal Footer -->
      <div class="p-4 border-t border-slate-100 bg-slate-50 flex items-center justify-end space-x-2">
        <button onclick="closeRecordModal()" class="px-4 py-2 rounded-xl text-xs font-bold text-slate-600 hover:bg-slate-200 transition">取消</button>
      </div>

    </div>
  </div>

</body>
</html>
