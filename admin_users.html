  <style>
/*************************************************
 * User Management V2 
 *************************************************/
*{ box-sizing:border-box; }
body{
  margin:0;
  padding:0;
  background:#f8fafc;
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  color:#0f172a;
}
.hidden{ display:none!important; }

/*************************************************
 * Container & Title
 *************************************************/
.main{ max-width:1400px; margin:auto; padding:20px; }
.page-header{ margin-bottom:20px; }
.page-title{ display:flex; align-items:center; gap:10px; font-size:28px; font-weight:800; margin:0; }
.page-subtitle{ margin-top:4px; color:#64748b; font-size:14px; }

/*************************************************
 * KPI Dashboard V3
 *************************************************/
.kpi-flex{ display:grid; grid-template-columns: 1fr 1fr; align-items:center; margin-top:10px; }
.kpi-main-value{ font-size:30px; font-weight:900; line-height:1; color:#0f172a; }
.kpi-side{ display:flex; flex-direction:column; gap:2px; align-items:flex-start; min-width:70px; }
.kpi-side div{ display:flex; align-items:center; gap:6px; font-size:13px; line-height:1.2; color:#64748b; }
.kpi-side span{ font-size:18px; min-width:18px; font-weight:900; }
.kpi-summary{ display:grid; grid-template-columns: repeat(4,1fr); gap:14px; margin-bottom:14px; }
.kpi-main-card{ background:#fff; border:1px solid #e2e8f0; border-radius:16px; padding:18px; box-shadow: 0 4px 10px rgba(15,23,42,.05); min-height:110px; }
.kpi-main-label{ font-size:13px; color:#64748b; font-weight:700; }

@media(max-width:768px){
  .kpi-summary{ grid-template-columns: repeat(2,1fr); }
}

#kpiJudgeA, #kpiJudgeB, #kpiJudgeC{ color:#2563eb; }
#kpiRecordA, #kpiRecordB, #kpiRecordC{ color:#7c3aed; }
#kpiDisabledUsers{ color:#dc2626; }

/*************************************************
 * Search & Filter
 *************************************************/
.search-input{ flex:1; height:44px; border:1px solid #cbd5e1; border-radius:12px; padding:0 14px; background:#fff; }
.search-input:focus{ outline:none; border-color:#2563eb; box-shadow: 0 0 0 3px rgba(37,99,235,.12); }
.filter-card{ background:#fff; border-radius:18px; padding:14px; margin-bottom:14px; box-shadow: 0 4px 12px rgba(15,23,42,.05); overflow-x:auto; white-space:nowrap; display:flex; flex-direction:column; gap:12px; }
.filter-card label{ display:inline-flex; align-items:center; margin-right:18px; cursor:pointer; font-size:14px; color:#334155; }
.role-filter-row{ display:flex; flex-wrap:wrap; gap:16px; }
.role-filter-row label{ margin:0; }
.filter-toolbar{ display:flex; justify-content:space-between; align-items:center; gap:20px; }
.filter-search-row{ width:420px; margin-top:0; }
.filter-search-row .search-input{ width:100%; }
@media(max-width:768px){
  .filter-toolbar{ flex-direction:column; align-items:stretch; }
  .filter-search-row{ width:100%; }
}

/*************************************************
 * Buttons & Table
 *************************************************/
.btn-primary{ border:none; padding:10px 18px; border-radius:12px; background:#2563eb; color:#fff; font-weight:700; cursor:pointer; box-shadow: 0 4px 12px rgba(37,99,235,.25); }
.btn-primary:hover{ background:#1d4ed8; }
.btn-outline{ border:none; background: rgba(255,255,255,.15); color:#fff; border-radius:10px; padding:8px 12px; cursor:pointer; transition:.2s; }
.btn-outline:hover{ background: rgba(255,255,255,.25); }

.table-panel{ background:#fff; border-radius:18px; overflow:hidden; box-shadow: 0 4px 14px rgba(15,23,42,.05); }
.table-header{ display:flex; justify-content:space-between; align-items:center; padding:14px 18px; background: linear-gradient(90deg, #0f172a, #1e3a8a); color:#fff; }
.table-title{ font-size:18px; font-weight:800; }
.table-wrapper{ overflow-x:auto; }
.user-table{ width:100%; border-collapse:collapse; }
.user-table th{ background:#f8fafc; padding:12px; text-align:left; font-size:13px; color:#475569; font-weight:700; border-bottom: 1px solid #e2e8f0; }
.user-table td{ padding:14px 12px; vertical-align:top; border-bottom: 1px solid #e2e8f0; }
.user-table tbody tr:hover{ background:#f8fafc; }

.tb-name{ font-size:20px; font-weight:800; color:#0f172a; }
.tb-account{ margin-top:4px; font-size:14px; color:#64748b; }
.table-badges{ display:flex; flex-wrap:wrap; gap:6px; }
.role-badge{ display:inline-flex; align-items:center; height:32px; padding:0 16px; border-radius:999px; font-size:13px; font-weight:700; }
.role-judge{ background:#dbeafe; color:#1d4ed8; }
.role-chief-judge{ background:#fef3c7; color:#92400e; }
.role-record{ background:#ede9fe; color:#6d28d9; }
.role-record-chief{ background:#ddd6fe; color:#5b21b6; }
.role-admin{ background:#fee2e2; color:#991b1b; }

.status-badge{ display:inline-flex; justify-content:center; align-items:center; min-width:60px; height:28px; border-radius:999px; font-size:12px; font-weight:700; }
.status-active{ background:#dcfce7; color:#166534; }
.status-active::before{ content:"●"; margin-right:4px; }
.status-disable{ background:#fee2e2; color:#991b1b; }
.attendance-rate{ font-size:12px; color:#16a34a; }

.action-col{ white-space:nowrap; }
.action-btn{ font-size:14px; width:32px; height:32px; border:none; border-radius:10px; cursor:pointer; transition:.2s; }
.action-btn:hover{ transform:translateY(-1px); }
.action-btn.stat{ background:#dbeafe; }
.action-btn.edit{ background:#ffedd5; }
.action-btn.password{ background:#fef9c3; }
.action-btn.delete{ background:#fee2e2; }
.action-btn.copy{ background:#dbeafe; color:#1d4ed8; }
.power-on{ background:#dcfce7; color:#166534; }
.power-off{ background:#fee2e2; color:#991b1b; }
.action-group{ display:flex; justify-content:flex-start; align-items:center; gap:6px; }

/*************************************************
 * Modals & Toast
 *************************************************/
.modal{ position:fixed; inset:0; background:rgba(15,23,42,.45); display:flex; justify-content:center; align-items:center; z-index:9999; }
.modal.hidden{ display:none; }
.modal-dialog{ width:90%; max-width:720px; background:#ffffff; border-radius:18px; overflow:hidden; box-shadow: 0 20px 50px rgba(0,0,0,.2); }
.modal-header{ display:flex; justify-content:space-between; align-items:center; padding:14px 18px; background: linear-gradient(90deg, #0f172a, #1e3a8a); color:#fff; }
.modal-body{ padding:20px; }
.modal-grid{ display:grid; grid-template-columns: repeat(2,1fr); gap:14px; align-items:start; }
.modal-grid input, .modal-grid select{ width:100%; height:42px; border:1px solid #cbd5e1; border-radius:10px; padding:0 12px; }
.modal-grid input:focus, .modal-grid select:focus{ outline:none; border-color:#2563eb; box-shadow: 0 0 0 3px rgba(37,99,235,.12); }
.modal-footer{ display:flex; justify-content:flex-end; gap:10px; padding:16px 20px; border-top:1px solid #e5e7eb; }
.modal-close{ border:none; width:36px; height:36px; border-radius:10px; background:rgba(255,255,255,.15); color:#fff; cursor:pointer; }
.full-row{ grid-column:1 / span 2; }
.modal-role-section{ grid-column:1 / span 2; padding:16px; border:1px solid #e5e7eb; border-radius:12px; background:#f8fafc; }
.section-title{ font-size:14px; font-weight:700; margin-bottom:10px; }
.role-checkbox-grid{ display:flex; flex-wrap:wrap; gap:12px 24px; }
.role-checkbox-grid label{ display:flex; align-items:center; gap:6px; white-space:nowrap; margin:0; color:#334155; }
.level-card{ display:flex; flex-direction:column; gap:6px; }
.level-card label{ font-size:13px; font-weight:700; color:#475569; }
@media(max-width:768px){
  .modal-grid{ grid-template-columns:1fr; }
  .full-row, .modal-role-section{ grid-column:auto; }
}

.toast{ position:fixed; top:20px; left:50%; transform: translateX(-50%) translateY(-10px); min-width:280px; max-width:500px; padding:12px 18px; border-radius:12px; text-align:center; color:#fff; font-size:14px; font-weight:700; box-shadow: 0 10px 25px rgba(0,0,0,.15); opacity:0; transition:.25s; z-index:10000; }
.toast.show{ opacity:1; transform: translateX(-50%) translateY(0); }
.toast.success{ background:#16a34a; }
.toast.error{ background:#dc2626; }
.toast.warn{ background:#f59e0b; }

.stats-grid{ display:grid; grid-template-columns: repeat(3,1fr); gap:14px; }
.stat-card{ background:#f8fafc; border:1px solid #e2e8f0; border-radius:12px; padding:14px; }
.stat-card strong{ color:#64748b; }
.stat-card div{ margin-top:8px; font-size:22px; font-weight:700; }
.system-info-grid{ display:grid; grid-template-columns: repeat(2,1fr); gap:12px; }
.system-info-item{ padding:12px; background:#fff; border-radius:10px; border:1px solid #e5e7eb; }
.system-info-label{ font-size:12px; color:#64748b; }
.system-info-value{ margin-top:6px; font-size:18px; font-weight:700; }

#loadingMask{ position:fixed; inset:0; background: rgba(15,23,42,.25); display:flex; justify-content:center; align-items:center; z-index:20000; }
#loadingMask.hidden{ display:none; }
.loading-box{ background:#fff; padding:20px 28px; border-radius:16px; font-weight:700; box-shadow: 0 8px 24px rgba(0,0,0,.15); }
  </style>
</head>

                <input id="modalUsername" type="text" placeholder="帳號">
                <input id="modalName" type="text" placeholder="姓名">
                <input id="modalNote" type="text" placeholder="背號">
                <input id="modalEmail" type="text" placeholder="Email">
                <div class="full-row">
                  <input id="modalPhone" type="text" placeholder="電話">
                </div>
                <div class="modal-role-section">
                  <div class="section-title">身份</div>
                  <div class="role-checkbox-grid">
                    <label><input type="checkbox" id="roleJudge"> 裁判</label>
                    <label><input type="checkbox" id="roleChiefJudge"> 裁判長</label>
                    <label><input type="checkbox" id="roleRecord"> 紀錄</label>
                    <label><input type="checkbox" id="roleRecordChief"> 紀錄長</label>
                    <label><input type="checkbox" id="roleAdmin"> 管理員</label>
                  </div>
                </div>
                <div class="level-card">
                  <label>裁判等級</label>
                  <select id="judgeLevel">
                    <option value="N">無</option>
                    <option value="C">C級</option>
                    <option value="B">B級</option>
                    <option value="A">A級</option>
                  </select>
                </div>
                <div class="level-card">
                  <label>紀錄等級</label>
                  <select id="recordLevel">
                    <option value="N">無</option>
                    <option value="C">C級</option>
                    <option value="B">B級</option>
                    <option value="A">A級</option>
                  </select>
                </div>
                <div class="modal-role-section">
                  <div class="section-title">系統資訊</div>
                  <div id="userSystemInfo">-</div>
                </div>
              </div>
            </div>
            <div class="modal-footer">
              <button class="px-4 py-2 rounded-xl bg-slate-200 text-slate-700 font-bold" onclick="closeUserModal()">取消</button>
              <button class="btn-primary" onclick="saveUserModal()">儲存</button>
            </div>
          </div>
        </div>

        <!-- 個人統計 Modal -->
        <div id="statisticsModal" class="modal hidden">
          <div class="modal-dialog" style="max-width:800px;">
            <div class="modal-header">
              <div class="table-title">📊 個人統計</div>
              <button class="modal-close" onclick="closeStatisticsModal()">✕</button>
            </div>
            <div id="statisticsContent" class="modal-body"></div>
          </div>
        </div>

        <div id="loadingMask" class="hidden">
          <div class="loading-box">處理中...</div>
        </div>

      </div>
    </div>
  </div>
</div>

<script src="js/auth.js"></script>
<script src="js/config.js"></script>

<script>
// 初始化 Lucide 圖示與側邊欄登入者資訊
document.addEventListener('DOMContentLoaded', () => {
  if (typeof lucide !== 'undefined') lucide.createIcons();
  initSidebarUser();
  loadUsers();

  const txtSearch = document.getElementById('txtSearch');
  if (txtSearch) txtSearch.addEventListener('input', applyFilter);

  document.querySelectorAll('input[name="roleFilter"]').forEach(r => {
    r.addEventListener('change', applyFilter);
  });
});

// 手機版側邊欄開關
function toggleSidebar() {
  const sidebar = document.getElementById('sidebar');
  const overlay = document.getElementById('sidebar-overlay');
  if (sidebar) sidebar.classList.toggle('-translate-x-full');
  if (overlay) overlay.classList.toggle('hidden');
}

// 填入側邊欄登入者資訊
function initSidebarUser() {
  const session = (typeof getSession === 'function')
    ? getSession()
    : JSON.parse(localStorage.getItem('session_user') || '{}');
  if (session && session.name) {
    const nameEl = document.getElementById('sidebarUserName');
    const avatarEl = document.getElementById('sidebarAvatar');
    const roleEl = document.getElementById('sidebarUserRole');
    if (nameEl) nameEl.textContent = session.name;
    if (avatarEl) avatarEl.textContent = session.name.charAt(0);
    if (roleEl) roleEl.textContent = displayRole(session.role);
  }
}

let currentKeyword = '';
let currentRoleFilter = 'all';
let allUsers = [];
let currentModalMode = '';
let currentModalUserId = '';
let sortField = '';
let sortAsc = false;

function sortUsers(field){
  if(sortField === field){ sortAsc = !sortAsc; }
  else{ sortField = field; sortAsc = false; }
  renderUserTable();
}

function displayRole(role){
  if(!role) return '管理員';
  const roles = String(role).split(',');
  const result = [];
  roles.forEach(r=>{
    switch(r.trim()){
      case 'judge': result.push('裁判'); break;
      case 'chief_judge': result.push('裁判長'); break;
      case 'record': result.push('紀錄'); break;
      case 'record_chief': result.push('紀錄長'); break;
      case 'admin': result.push('管理員'); break;
    }
  });
  return result.join(' / ');
}

function splitLevel(level){
  if(!level || level === 'NONE') return ['N','N'];
  if(!String(level).includes(',')) return [String(level), 'N'];
  return String(level).split(',');
}

function renderAll(){
  updateKpi();
  renderUserTable();
}

function formatDateTime(v){
  if(!v) return '-';
  const d = new Date(v);
  if(isNaN(d)) return '-';
  return d.toLocaleString('zh-TW');
}

function showLoading(msg='處理中...'){
  const m = document.getElementById('loadingMask');
  if(!m) return;
  m.querySelector('.loading-box').textContent = msg;
  m.classList.remove('hidden');
}

function hideLoading(){
  const m = document.getElementById('loadingMask');
  if(!m) return;
  m.classList.add('hidden');
}

function loadUsers(){
  callApi({ action:'getUsers' }, res => {
    if (!res || res.result === 'error') {
      showToast(res?.message || '載入使用者失敗', 'error');
      return;
    }
    allUsers = res.users || [];
    renderAll();
  });
}

function isUserActive(v){
  return (v === 1 || v === '1' || v === 'Y' || v === 'y' || v === true);
}

function toggleActive(userId, checked) {
  showLoading('更新帳號狀態中...');
  callApi({ action:'toggleUserActive', user_id:userId, active:checked ? 1 : 0 }, function(res){
    hideLoading();
    if(res && res.result === 'error'){
      showToast(res.message || '狀態更新失敗', 'error');
      return;
    }
    showToast('狀態已更新', 'success');
    loadUsers();
  });
}

function deleteUser(uid, username) {
  if (!confirm(`確定要刪除使用者「${username}」？`)) return;
  showLoading('刪除帳號中...');
  const currentUserId = localStorage.getItem('user_id') || '';
  callApi({ action:'deleteUsers', user_ids:uid, current_user_id:currentUserId }, function(res){
    hideLoading();
    if(res && res.result === 'error'){
      showToast(res.message || '刪除失敗', 'error');
      return;
    }
    showToast(res.message || '刪除成功', 'success');
    loadUsers();
  });
}

function showToast(msg, type='success') {
  const t = document.createElement('div');
  t.className = `toast ${type}`;
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(()=>t.classList.add('show'),10);
  setTimeout(()=>{ t.classList.remove('show'); setTimeout(()=>t.remove(),300); },2000);
}

function updateKpi(){
  let judgeA = 0, judgeB = 0, judgeC = 0;
  let recordA = 0, recordB = 0, recordC = 0;
  let totalScore = 0;

  allUsers.forEach(u=>{
    const [judgeLv, recordLv] = splitLevel(u.level || 'N,N');
    if(judgeLv === 'A') judgeA++;
    else if(judgeLv === 'B') judgeB++;
    else if(judgeLv === 'C') judgeC++;

    if(recordLv === 'A') recordA++;
    else if(recordLv === 'B') recordB++;
    else if(recordLv === 'C') recordC++;

    totalScore += Number(u.final_score || 0);
  });

  const totalUsers = allUsers.length;
  const judges = allUsers.filter(u => String(u.role||'').includes('judge') || String(u.role||'').includes('chief_judge')).length;
  const records = allUsers.filter(u => String(u.role||'').includes('record') || String(u.role||'').includes('record_chief')).length;
  const disabled = allUsers.filter(u => !isUserActive(u.active)).length;
  const avgScore = totalUsers ? (totalScore / totalUsers).toFixed(1) : 0;

  const setText = (id, val) => { const el = document.getElementById(id); if(el) el.textContent = val; };
  setText('kpiTotalUsers', totalUsers);
  setText('kpiJudgeUsers', judges);
  setText('kpiRecordUsers', records);
  setText('kpiDisabledUsers', disabled);
  setText('kpiAverageScore', avgScore);
  setText('kpiJudgeA', judgeA); setText('kpiJudgeB', judgeB); setText('kpiJudgeC', judgeC);
  setText('kpiRecordA', recordA); setText('kpiRecordB', recordB); setText('kpiRecordC', recordC);
}

function getFilteredUsers(){
  const result = allUsers.filter(u => {
    const keyword = currentKeyword.trim().toLowerCase();
    const searchArea = [u.username, u.name, u.note, u.email, u.phone].join(' ').toLowerCase();
    const hitKeyword = !keyword || searchArea.includes(keyword);
    const role = String(u.role || '');
    const hitRole = currentRoleFilter === 'all' || role.includes(currentRoleFilter);
    return hitKeyword && hitRole;
  });

  if(sortField){
    result.sort((a,b)=>{
      let av = a[sortField], bv = b[sortField];
      if(sortField === 'name'){
        av = String(av || ''); bv = String(bv || '');
        return sortAsc ? av.localeCompare(bv,'zh-TW') : bv.localeCompare(av,'zh-TW');
      }
      av = Number(av || 0); bv = Number(bv || 0);
      return sortAsc ? av - bv : bv - av;
    });
  }
  return result;
}

function renderUserTable(){
  const tbody = document.getElementById('userTableBody');
  if(!tbody) return;
  const users = getFilteredUsers();
  tbody.innerHTML = '';

  users.forEach(u=>{
    const tr = document.createElement('tr');
    const qualificationBadges = buildQualificationBadges(u);
    const activeClass = isUserActive(u.active) ? 'status-active' : 'status-disable';
    const activeText = isUserActive(u.active) ? '啟用' : '停用';
    const powerClass = isUserActive(u.active) ? 'power-on' : 'power-off';
    const quality = Number(u.quality_score || 0);
    let qualityColor = quality >= 80 ? '#16a34a' : quality >= 60 ? '#2563eb' : quality >= 40 ? '#f59e0b' : '#dc2626';

    tr.innerHTML = `
      <td>
        <div style="font-weight:700; margin-bottom:6px;">#${u.note || '-'}</div>
        <span class="status-badge ${activeClass}">${activeText}</span>
      </td>
      <td>
        <div class="tb-name">${u.name || '-'}</div>
        <div class="tb-account">${u.username || ''}</div>
      </td>
      <td><div class="table-badges">${qualificationBadges}</div></td>
      <td>
        <div style="font-size:18px; font-weight:700;">${u.exp_total || 0}</div>
        <div class="attendance-rate">${u.completed_rate || 0}%</div>
      </td>
      <td>
        <div style="color:${qualityColor}; font-size:18px; font-weight:800;">${u.quality_score || 0}</div>
        <div style="font-size:12px; color:#64748b;">評分 ${u.final_score || 0}</div>
      </td>
      <td>
        <div style="font-size:12px; color:#dc2626;">${u.email || '-'}</div>
        <div style="font-size:12px; color:#64748b; margin-top:2px;">${u.phone || '-'}</div>
      </td>
      <td class="action-col">
        <div class="action-group">
          <button class="action-btn copy" onclick="copyUserInfo('${u.username || ''}','${u.email || ''}','${u.name || ''}')">📋</button>
          <button class="action-btn stat" onclick="showUserStatistics('${u.user_id}')">📊</button>
          <button class="action-btn edit" onclick="openEditUserModal('${u.user_id}')">✏️</button>
          <button class="action-btn password" onclick="resetPassword('${u.user_id}')">🔑</button>
          <button class="action-btn delete" onclick="deleteUser('${u.user_id}','${u.username}')">🗑</button>
          <button class="action-btn ${powerClass}" onclick="toggleActive('${u.user_id}',${!isUserActive(u.active)})">⏻</button>
        </div>
      </td>
    `;
    tbody.appendChild(tr);
  });
}

function applyFilter(){
  const keywordBox = document.getElementById('txtSearch');
  if(keywordBox) currentKeyword = keywordBox.value || '';
  const checkedRole = document.querySelector('input[name="roleFilter"]:checked');
  if(checkedRole) currentRoleFilter = checkedRole.value;
  renderUserTable();
}

function showUserStatistics(userId){
  const user = allUsers.find(u => String(u.user_id) === String(userId));
  if(!user){ showToast('找不到使用者', 'error'); return; }
  const qualificationBadges = buildQualificationBadges(user);
  const quality = Number(user.quality_score || 0);
  let qualityColor = quality >= 80 ? '#16a34a' : quality >= 60 ? '#2563eb' : quality >= 40 ? '#f59e0b' : '#dc2626';

  document.getElementById('statisticsModal').classList.remove('hidden');
  document.getElementById('statisticsContent').innerHTML = `
    <div class="stats-grid">
      <div class="stat-card"><strong>姓名</strong><div style="font-size:18px;">${user.name || '-'}</div></div>
      <div class="stat-card"><strong>帳號</strong><div style="font-size:18px;">${user.username || '-'}</div></div>
      <div class="stat-card"><strong>資格</strong><div class="table-badges" style="margin-top:8px;">${qualificationBadges}</div></div>
      <div class="stat-card"><strong>帳號狀態</strong><div style="font-size:18px; color:${isUserActive(user.active)?'#16a34a':'#dc2626'};">${isUserActive(user.active)?'啟用':'停用'}</div></div>
      <div class="stat-card"><strong>總經驗</strong><div>${user.exp_total || 0}</div></div>
      <div class="stat-card"><strong>裁判經驗</strong><div>${user.exp_judge || 0}</div></div>
      <div class="stat-card"><strong>紀錄經驗</strong><div>${user.exp_record || 0}</div></div>
      <div class="stat-card"><strong>完成率</strong><div>${user.completed_rate || 0}%</div></div>
      <div class="stat-card"><strong>遲到率</strong><div>${user.late_rate || 0}%</div></div>
      <div class="stat-card"><strong>缺席率</strong><div>${user.no_show_rate || 0}%</div></div>
      <div class="stat-card"><strong>品質分數</strong><div style="color:${qualityColor};">${user.quality_score || 0}</div></div>
      <div class="stat-card"><strong>總評分</strong><div>${user.final_score || 0}</div></div>
      <div class="stat-card"><strong>最後登入</strong><div style="font-size:14px; line-height:1.4;">${formatDateTime(user.last_login)}</div></div>
    </div>
  `;
}

function resetPassword(userId){
  if(!confirm('確定重設此帳號密碼？')) return;
  showLoading('重設密碼中...');
  callApi({ action:'changePassword', user_id:userId, new_password:'pppppppp' }, res => {
    hideLoading();
    if(!res || res.result === 'error'){ showToast(res?.message || '重設失敗', 'error'); return; }
    showToast('密碼已重設為 pppppppp', 'success');
  });
}

function openEditUserModal(userId){ openUserModal('edit', userId); }

function openUserModal(mode, userId = ''){
  currentModalMode = mode;
  currentModalUserId = userId;
  document.getElementById('userModal').classList.remove('hidden');
  const title = document.getElementById('userModalTitle');

  if(mode === 'create'){
    title.textContent = '新增使用者';
    ['modalUsername','modalName','modalNote','modalEmail','modalPhone'].forEach(id => document.getElementById(id).value = '');
    document.getElementById('judgeLevel').value = 'N';
    document.getElementById('recordLevel').value = 'N';
    ['roleJudge','roleChiefJudge','roleRecord','roleRecordChief','roleAdmin'].forEach(id => document.getElementById(id).checked = false);
    document.getElementById('modalUsername').readOnly = false;
    document.getElementById('userSystemInfo').innerHTML = '尚未建立帳號';
    return;
  }

  if(mode === 'edit'){
    const user = allUsers.find(u => String(u.user_id) === String(userId));
    if(!user){ showToast('找不到使用者', 'error'); return; }
    title.textContent = '編輯使用者';
    document.getElementById('modalUsername').value = user.username || '';
    document.getElementById('modalName').value = user.name || '';
    document.getElementById('modalNote').value = user.note || '';
    document.getElementById('modalEmail').value = user.email || '';
    document.getElementById('modalPhone').value = user.phone || '';

    const roles = String(user.role || '').split(',');
    document.getElementById('roleJudge').checked = roles.includes('judge');
    document.getElementById('roleChiefJudge').checked = roles.includes('chief_judge');
    document.getElementById('roleRecord').checked = roles.includes('record');
    document.getElementById('roleRecordChief').checked = roles.includes('record_chief');
    document.getElementById('roleAdmin').checked = roles.includes('admin');

    const [judgeLv, recordLv] = splitLevel(user.level);
    document.getElementById('judgeLevel').value = judgeLv;
    document.getElementById('recordLevel').value = recordLv;
    document.getElementById('modalUsername').readOnly = true;

    document.getElementById('userSystemInfo').innerHTML = `
      <div class="system-info-grid">
        <div class="system-info-item"><div class="system-info-label">帳號狀態</div><div class="system-info-value">${isUserActive(user.active)?'啟用':'停用'}</div></div>
        <div class="system-info-item"><div class="system-info-label">最後登入</div><div class="system-info-value">${formatDateTime(user.last_login)}</div></div>
        <div class="system-info-item"><div class="system-info-label">總經驗</div><div class="system-info-value">${user.exp_total || 0}</div></div>
        <div class="system-info-item"><div class="system-info-label">品質分數</div><div class="system-info-value">${user.quality_score || 0}</div></div>
      </div>
    `;
  }
}

function closeUserModal(){ document.getElementById('userModal').classList.add('hidden'); }

function buildRoleString(){
  const roles = [];
  if(document.getElementById('roleJudge')?.checked) roles.push('judge');
  if(document.getElementById('roleChiefJudge')?.checked) roles.push('chief_judge');
  if(document.getElementById('roleRecord')?.checked) roles.push('record');
  if(document.getElementById('roleRecordChief')?.checked) roles.push('record_chief');
  if(document.getElementById('roleAdmin')?.checked) roles.push('admin');
  return roles.join(',');
}

function saveUserModal(){
  showLoading('資料儲存中...');
  const username = document.getElementById('modalUsername').value.trim();
  const name = document.getElementById('modalName').value.trim();
  const note = document.getElementById('modalNote').value.trim();
  const email = document.getElementById('modalEmail').value.trim();
  const phone = document.getElementById('modalPhone').value.trim();
  const role = buildRoleString();
  const judgeLevel = document.getElementById('judgeLevel').value;
  const recordLevel = document.getElementById('recordLevel').value;
  const level = `${judgeLevel},${recordLevel}`;

  if(!username){ hideLoading(); showToast('請輸入帳號', 'warn'); return; }
  if(!name){ hideLoading(); showToast('請輸入姓名', 'warn'); return; }

  if(currentModalMode === 'create'){
    showLoading('建立帳號中...');
    callApi({ action:'createUser', username, name, email }, res => {
      hideLoading();
      if(!res || res.result === 'error'){ showToast(res?.message || '新增失敗', 'error'); return; }
      showToast('新增成功', 'success');
      closeUserModal();
      loadUsers();
    });
    return;
  }

  if(currentModalMode === 'edit'){
    showLoading('更新資料中...');
    const updates = { note, name, email, phone, role, level };
    const fields = Object.entries(updates);
    let finished = 0, hasError = false;

    fields.forEach(([field,value])=>{
      callApi({ action:'updateUserField', user_id:currentModalUserId, field, value }, res => {
        if(!res || res.result === 'error'){ hasError = true; showToast(res?.message || `更新 ${field} 失敗`, 'error'); }
        finished++;
        if(finished === fields.length){
          hideLoading();
          if(!hasError){ showToast('更新成功', 'success'); closeUserModal(); loadUsers(); }
        }
      });
    });
  }
}

function closeStatisticsModal(){ document.getElementById('statisticsModal').classList.add('hidden'); }

function exportUsers(){
  if(!allUsers || allUsers.length === 0){ showToast('沒有可匯出的資料', 'warn'); return; }
  const headers = ['背號','帳號','姓名','Email','電話','身份','證照等級','帳號狀態','最後登入','總經驗','裁判經驗','紀錄經驗','完成率','遲到率','缺席率','品質分數','總評分'];
  const rows = allUsers.map(u => [
    u.note || '', u.username || '', u.name || '', u.email || '', u.phone || '', u.role || '', u.level || '',
    isUserActive(u.active) ? '啟用' : '停用', formatDateTime(u.last_login),
    u.exp_total || 0, u.exp_judge || 0, u.exp_record || 0,
    `${u.completed_rate || 0}%`, `${u.late_rate || 0}%`, `${u.no_show_rate || 0}%`,
    u.quality_score || 0, u.final_score || 0
  ]);
  const csvContent = '\uFEFF' + [headers.join(','), ...rows.map(row => row.map(v => `"${String(v||'').replace(/"/g,'""')}"`).join(','))].join('\n');
  const blob = new Blob([csvContent], { type:'text/csv;charset=utf-8;' });
  const link = document.createElement('a');
  const url = URL.createObjectURL(blob);
  const today = new Date();
  link.href = url;
  link.download = `Users_${today.getFullYear()}${String(today.getMonth()+1).padStart(2,'0')}${String(today.getDate()).padStart(2,'0')}.csv`;
  document.body.appendChild(link); link.click(); document.body.removeChild(link);
  URL.revokeObjectURL(url);
  showToast('使用者資料匯出完成', 'success');
}

function copyUserInfo(username, email='', name=''){
  const text = `姓名：${name}
帳號：${username}
Email：${email || '-'}`;
  navigator.clipboard.writeText(text)
    .then(()=>showToast('帳號資訊已複製', 'success'))
    .catch(()=>showToast('複製失敗', 'error'));
}

function buildQualificationBadges(user){
  const badges = [];
  const roles = String(user.role || '').split(',');
  const [judgeLv, recordLv] = splitLevel(user.level || 'N,N');
  if(roles.includes('judge')) badges.push(`<span class="role-badge role-judge">${judgeLv !== 'N' ? `${judgeLv}級裁判` : '裁判'}</span>`);
  if(roles.includes('record')) badges.push(`<span class="role-badge role-record">${recordLv !== 'N' ? `${recordLv}級紀錄` : '紀錄'}</span>`);
  if(roles.includes('chief_judge')) badges.push(`<span class="role-badge role-chief-judge">裁判長</span>`);
  if(roles.includes('record_chief')) badges.push(`<span class="role-badge role-record-chief">紀錄長</span>`);
  if(roles.includes('admin')) badges.push(`<span class="role-badge role-admin">管理員</span>`);
  return badges.join('');
}
</script>
