<!-- ================= Executive Navy Two-Tier Header ================= -->
<style>
#app-header {
  background: #0f172a; /* 深海商務藍 */
  color: #ffffff;
  border-bottom: 2px solid #1e3a8a;
  position: sticky;
  top: 0;
  z-index: 50;
  box-shadow: 0 4px 12px rgba(15, 23, 42, 0.15);
}

.header-tier-1 {
  max-width: 1200px;
  margin: 0 auto;
  padding: 10px 20px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 1px solid rgba(255, 255, 255, 0.1);
}

.header-brand {
  font-size: 15px;
  font-weight: 900;
  letter-spacing: 0.5px;
  display: flex;
  align-items: center;
  gap: 8px;
  color: #f8fafc;
  text-decoration: none;
}

.header-user-info {
  display: flex;
  align-items: center;
  gap: 14px;
  font-size: 12px;
  color: #94a3b8;
}

.header-user-info span {
  color: #f1f5f9;
  font-weight: 700;
}

.header-user-info a {
  color: #93c5fd;
  text-decoration: none;
  transition: color 0.2s;
}
.header-user-info a:hover {
  color: #ffffff;
}

.header-tier-2 {
  max-width: 1200px;
  margin: 0 auto;
  padding: 8px 20px;
  display: flex;
  gap: 8px;
  overflow-x: auto;
}

#app-header .item {
  display: none;
  align-items: center;
  gap: 6px;
  padding: 8px 14px;
  font-size: 13px;
  font-weight: 700;
  border-radius: 8px;
  text-decoration: none;
  transition: all 0.2s ease;
  color: #cbd5e1;
  background: rgba(255, 255, 255, 0.04);
  white-space: nowrap;
}

#app-header .item:hover {
  background: rgba(255, 255, 255, 0.1);
  color: #ffffff;
}

/* 角色權限顯示控制：預設隱藏特定身分按鈕，透過 body 類別展開 */
#app-header .home   { display: flex !important; background: rgba(37, 99, 235, 0.2); color: #93c5fd; border: 1px solid rgba(59, 130, 246, 0.3); }
#app-header .course { display: flex !important; }
#app-header .judge  { display: none; }
#app-header .record { display: none; }
#app-header .admin  { display: none; }

body.role-judge  #app-header .judge  { display: flex !important; }
body.role-record #app-header .record { display: flex !important; }
body.role-admin  #app-header .admin  { display: flex !important; }
body.role-admin  #app-header .judge  { display: flex !important; }
body.role-admin  #app-header .record { display: flex !important; }

@media (max-width: 768px) {
  .header-tier-1 { padding: 8px 14px; }
  .header-tier-2 { padding: 6px 14px; gap: 6px; }
  #app-header .item { padding: 6px 10px; font-size: 12px; }
}
</style>

<header id="app-header">
  <!-- 第一層：品牌與使用者管理 -->
  <div class="header-tier-1">
    <a href="index.html" class="header-brand">
      <span>BBT軟式棒球聯盟出勤系統</span>
    </a>
    <div class="header-user-info">
      <div>歡迎，<span id="header-username">使用者</span></div>
      <a href="#" onclick="logout()" style="color: #f87171;">登出</a>
    </div>
  </div>

  <!-- 第二層：主要功能導覽列 -->
  <div class="header-tier-2">
    <a href="index.html" class="item home">
      <span>🏠</span> 首頁
    </a>
    <a href="course.html" class="item course">
      <span>📚</span> 課程專區
    </a>
    <a href="judge_dashboard.html" class="item judge">
      <span>🧑‍⚖️</span> 裁判班表
    </a>
    <a href="record_dashboard.html" class="item record">
      <span>📝</span> 紀錄班表
    </a>
    <a href="admin_dashboard.html" class="item admin">
      <span>⚙️</span> 系統管理
    </a>
  </div>
</header>
