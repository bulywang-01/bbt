<!-- ================= App Header ================= -->
<style>
#app-header {
  background: #fff;
  border-bottom: 1px solid #ddd;
  padding: 10px 16px;
}

/* ✅ 所有 header 樣式都關在這裡 */
#app-header .nav {
  display: flex;
  align-items: center;
  gap: 14px;
}

/* 預設：卡片式（裁判 / 紀錄） */
#app-header .item {
  width: 72px;
  height: 72px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  gap: 6px;
  text-decoration: none;
  font-size: 13px;
  font-weight: 700;
  border-radius: 14px;
  background: #f5f8ff;
  color: #1a237e;
}

#app-header .icon {
  font-size: 22px;
}

#app-header .text {
  text-align: center;
}

/* ✅ 管理員：改橫向工具列 */
body.is-admin #app-header .item {
  width: auto;
  height: 40px;
  flex-direction: row;
  padding: 6px 14px;
  border-radius: 8px;
  background: transparent;
}

/* ✅ 預設隱藏（JS 打開） */
#app-header .judge,
#app-header .record,
#app-header .admin {
  display: none;
}
</style>

<div id="app-header">
  <nav class="nav">
    <a href="index.html" class="item home">
      <span class="icon">🏠</span>
      <span class="text">首頁</span>
    </a>

    <a href="judge_dashboard.html" class="item judge">
      <span class="icon">🧑‍⚖️</span>
      <span class="text">裁判<br>班表</span>
    </a>

    <a href="record_dashboard.html" class="item record">
      <span class="icon">📝</span>
      <span class="text">紀錄<br>班表</span>
    </a>

    <a href="admin_dashboard.html" class="item admin">
      <span class="icon">⚙️</span>
      <span class="text">管理<br>介面</span>
    </a>

    <a href="change_password.html" class="item">
      <span class="icon">🔐</span>
      <span class="text">改<br>密碼</span>
    </a>

    <a href="#" class="item" onclick="logout()">
      <span class="icon">🚪</span>
      <span class="text">登出</span>
    </a>
  </nav>
</div>

<script src="js/auth.js"></script>

<script>
(function () {
  if (typeof getSession !== 'function') return;

  const session = getSession();
  if (!session || !session.role) return;

  const roles = session.role.split(',').map(r => r.trim());
  const isAdmin = roles.includes('admin');

  // ✅ 用「.item.role」精準選取（這是關鍵）
  if (
    isAdmin ||
    roles.includes('judge') ||
    roles.includes('chief_judge')
  ) {
    document
      .querySelectorAll('#app-header .item.judge')
      .forEach(el => (el.style.display = 'flex'));
  }

  if (
    isAdmin ||
    roles.includes('record') ||
    roles.includes('record_chief')
  ) {
    document
      .querySelectorAll('#app-header .item.record')
      .forEach(el => (el.style.display = 'flex'));
  }

  if (isAdmin) {
    document.body.classList.add('is-admin');
    document
      .querySelectorAll('#app-header .item.admin')
      .forEach(el => (el.style.display = 'flex'));
  }
})();
</script>
