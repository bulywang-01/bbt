<script>
(function () {
  if (typeof getSession !== 'function') {
    console.error('getSession not found');
    return;
  }

  const session = getSession();
  if (!session || !session.role) return;

  const roles = session.role.split(',').map(r => r.trim());
  const isAdmin = roles.includes('admin');

  const allItems = document.querySelectorAll('#app-header .item');

  // ✅ 管理員：全部顯示（這是系統正確行為）
  if (isAdmin) {
    document.body.classList.add('is-admin');
    allItems.forEach(el => {
      el.style.display = 'flex';
    });
    return;
  }

  // 非 admin 才判斷角色
  if (roles.includes('judge') || roles.includes('chief_judge')) {
    document.querySelectorAll('#app-header .item.judge')
      .forEach(el => (el.style.display = 'flex'));
  }

  if (roles.includes('record') || roles.includes('record_chief')) {
    document.querySelectorAll('#app-header .item.record')
      .forEach(el => (el.style.display = 'flex'));
  }
})();
</script>
