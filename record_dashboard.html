<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>紀錄員報名</title>

<style>
body {
  margin: 0;
  font-family: system-ui, -apple-system;
  background: #f3f5f7;
}

/* ===== 標題 ===== */
.hint {
  font-size: 13px;
  color: #555;
  margin: 8px 12px;
}

/* ===== 日期 / 組別 ===== */
.date-title {
  margin: 20px 12px 8px;
  font-size: 20px;
  font-weight: 800;
}
.group-title {
  margin: 10px 12px 6px;
  font-weight: 700;
  border-left: 4px solid #1976d2;
  padding-left: 8px;
}

/* ===== 表格 ===== */
.record-table {
  width: calc(100% - 24px);
  margin: 0 12px 16px;
  border-collapse: collapse;
  background: #fff;
  margin-bottom: 12px;
  border-radius: 8px;
  overflow: hidden;

}
.record-table th,
.record-table td {
  border: 1px solid #ccc;
  padding: 6px 8px;
  text-align: center;
}
.record-table th {
  background: #0d4c63;
  color: #fff;
}

/* ===== select ===== */
select {
  width: 100%;
  padding: 4px 6px;
  border-radius: 12px;
  font-weight: 600;
}
select.me {
  background: #e8f5e9;
  border: 2px solid #2e7d32;
}
select.locked {
  background: #e0e0e0;
}

/* ✅ 四、搭配的 CSS（視覺就是裁判頁）*/
.signup-btn {
  color: #1976d2;
  cursor: pointer;
  font-weight: 700;
}
.signup-btn:hover {
  text-decoration: underline;
}

.signup-me {
  color: #2e7d32;
  font-weight: 700;
}
.cancel-btn {
  margin-left: 8px;
  color: #c62828;
  cursor: pointer;
  font-size: 12px;
}
.cancel-btn:hover {
  text-decoration: underline;
}

.signup-other {
  color: #555;
  font-weight: 700;
}

/* ===== 操作提示 toast ===== */
.toast {
  position: fixed;
  top: 20px;
  left: 50%;
  transform: translateX(-50%);
  min-width: 200px;
  background: #323232;
  color: #fff;
  padding: 10px 16px;
  border-radius: 6px;
  font-size: 14px;
  text-align: center;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.3s ease;
  z-index: 9999;
}

.toast.show {
  opacity: 1;
}

.toast.success {
  background: #2e7d32;
}

.toast.error {
  background: #c62828;
}

/* ===== 報名狀態 ===== */
.signup-btn {
  color: #1565c0;          /* 藍：可操作 */
  font-weight: 700;
  cursor: pointer;
}
.signup-btn:hover {
  text-decoration: underline;
}

.signup-me {
  color: #2e7d32;          /* 綠：自己 */
  font-weight: 700;
  white-space: nowrap;
}

.signup-other {
  color: #555;             /* 灰：他人 */
  font-weight: 700;
  white-space: nowrap;
}

/* 取消按鈕（小而明確） */
.cancel-btn {
  margin-left: 8px;
  font-size: 12px;
  color: #c62828;          /* 紅：危險操作 */
  cursor: pointer;
}
.cancel-btn:hover {
  text-decoration: underline;
}

/* ===============================
 RWD：桌機 / 手機切換（比照裁判頁）
================================ */
#desktopView { display: block; }
#mobileView { display: none; }

@media (max-width: 768px) {
  #desktopView { display: none; }
  #mobileView { display: block; padding: 12px; }
}

.section-title {
  margin: 16px 12px 8px;
  font-size: 18px;
  font-weight: 800;
  color: #1a237e;
}

/* ===============================
 手機卡片
================================ */
.record-card {
  border-radius: 14px;
  padding: 14px 16px;
  margin-bottom: 14px;
  box-shadow: 0 3px 10px rgba(0,0,0,0.12);
  
  background: #fafafa;
  border-radius: 10px;
  padding: 12px;
  margin-bottom: 10px;

}

.record-header {
  display: flex;
  justify-content: space-between;
  font-size: 18px;
  margin-bottom: 6px;
}

.record-main {
  display: flex;
  justify-content: space-between;
  font-size: 16px;
  font-weight: 600;
  margin-bottom: 6px;
}

.record-roles {
  margin-top: 8px;
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
  text-align: center;
}

/* ===== 手機版名單強化 ===== */

/* 基本名單 */
.record-role {
  font-size: 17px;              /* ✅ 字稍微變大 */
  font-weight: 800;
  line-height: 1.3;
  padding: 8px 6px;
  border-radius: 10px;
}

/* ✅ 自己（我報名的 / 被指派） */
.record-role.me {
  background: #e8f5e9;          /* 淡綠底 */
  border: 2px solid #2e7d32;    /* 明確邊框 */
  color: #1b5e20;
}

/* ✅ 他人 */
.record-role.other {
  background: #f1f1f1;
  border: 1px solid #cfcfcf;
  color: #424242;
}

/* ✅ 可操作（尚未報名） */
.record-role.action {
  background: #e3f2fd;
  border: 2px dashed #1976d2;
  color: #0d47a1;
}

/* 可選狀態 hover 回饋 */
.record-role.action:active {
  background: #bbdefb;
}

/* ===== 日期大框 ===== */
.m-date-box {
  background: #f5f8ff;
  border-radius: 14px;
  padding: 10px;
  margin-bottom: 16px;
}

.m-date-title {
  font-size: 18px;
  font-weight: 800;
  color: #1a237e;
  margin-bottom: 6px;
}

/* ===== 群組中框 ===== */
.m-group-box {
  background: #ffffff;
  border-radius: 12px;
  padding: 8px;
  margin-bottom: 12px;
}

.m-group-title {
  font-size: 15px;
  font-weight: 700;
  color: #0d47a1;
  border-left: 4px solid #0d47a1;
  padding-left: 8px;
  margin-bottom: 6px;
}

/* ===== 單場賽事卡片 ===== */
.m-game-card {
  background: #fafafa;
  border-radius: 10px;
  padding: 10px;
  margin-bottom: 8px;
  box-shadow: 0 2px 6px rgba(0,0,0,0.08);
}

.m-game-time {
  font-weight: 700;
  color: #d32f2f;
  margin-bottom: 4px;
}

.m-game-teams {
  font-size: 15px;
  font-weight: 700;
  margin-bottom: 2px;
}

.m-game-field {
  font-size: 13px;
  color: #555;
  margin-bottom: 6px;
}

.m-game-action {
  margin-top: 4px;
}

/* ===== 日期大格（桌機） ===== */
.panel {
  background: #ffffff;
  border-radius: 14px;
  padding: 18px 20px;
  margin-bottom: 24px;
  box-shadow: 0 4px 14px rgba(0,0,0,0.08);
}

.date-title {
  font-size: 20px;
  font-weight: 800;
  color: #1a237e;
  margin-bottom: 14px;
  display: flex;
  align-items: center;
  gap: 8px;
}

.date-title::before {
  content: "📅";
}

/* ===== 組別中格（桌機） ===== */
.group-title {
  margin-top: 18px;
  margin-bottom: 8px;
  font-weight: 700;
  font-size: 16px;
  color: #0d47a1;
  border-left: 4px solid #0d47a1;
  padding-left: 10px;
}

/* ===== 日期大格（手機） ===== */
.m-date-box {
  background: #f5f8ff;
  border-radius: 16px;
  padding: 14px;
  margin-bottom: 20px;
}

.m-date-title {
  font-size: 18px;
  font-weight: 800;
  color: #1a237e;
  margin-bottom: 10px;
}

/* ===== 組別中格（手機） ===== */
.m-group-box {
  background: #ffffff;
  border-radius: 12px;
  padding: 10px;
  margin-bottom: 14px;
  box-shadow: 0 2px 6px rgba(0,0,0,0.06);
}

.m-group-title {
  font-size: 15px;
  font-weight: 700;
  color: #0d47a1;
  border-left: 4px solid #0d47a1;
  padding-left: 8px;
  margin-bottom: 8px;
}


</style>
</head>

<body>
<div id="header-container"></div>

  
<script src="js/auth.js"></script>
<script src="js/config.js"></script>
  
<script>
function loadHeader() {
  fetch('header.html')
    .then(res => res.text())
    .then(html => {
      document.getElementById('header-container').innerHTML = html;

      // ✅ 只用 body class 控制身份
      const session = (typeof getSession === 'function') ? getSession() : null;
      document.body.classList.remove(
        'role-admin', 'role-judge', 'role-record'
      );

      if (session && session.role) {
        const roles = session.role.split(',').map(r => r.trim());

        if (roles.includes('admin')) {
          document.body.classList.add('role-admin');
        }
        if (roles.includes('judge') || roles.includes('chief_judge')) {
          document.body.classList.add('role-judge');
        }
        if (roles.includes('record') || roles.includes('record_chief')) {
          document.body.classList.add('role-record');
        }
      }
    })
    .catch(err => console.error('Header 載入失敗', err));
  }
  
  // 裁入報名頁面重要function
  document.addEventListener('DOMContentLoaded', () => {
    loadHeader();   // 只負責 header
    loadGames();    // 或該頁真正的資料初始化
  });
</script>
  
  <div id="toast" class="toast"></div>

<!--
<div class="page-title">BBT 軟式棒球聯盟｜紀錄員班表</div>
<div class="hint">※ 只能在「無」的欄位選擇自己</div>
-->
<!-- ✅ 唯一主容器 -->
<div id="desktopView">
  <h2 class="section-title">紀錄員班表</h2>
  <div id="recordContainer"></div>
</div>

<div id="mobileView"></div>
  
<script>
/* ===== 全域 ===== */
let session;
let games = [];

// 過期判斷工具
function isPastGame(gameDateStr) {
  const today = new Date();
  today.setHours(0, 0, 0, 0);

  const d = new Date(gameDateStr.replace(/\//g, '-'));
  d.setHours(0, 0, 0, 0);

  return d < today;
}

/* ===== Page / Data ===== */
function initPage() {
  const raw = localStorage.getItem('session_user');
  if (!raw) {
    location.replace('login.html');
    return;
  }

  session = JSON.parse(raw);          // ✅ 關鍵修正：指定給全域
  if (!session.user_id) {
    location.replace('login.html');
    return;
  }

  loadGames();
}

/* ===== Toast ===== */
function showToast(msg, type = 'success') {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = `toast show ${type}`;
  setTimeout(() => el.className = 'toast', 2000);
}

/* ===== 取資料 ===== */
function loadGames() {
  session = session || JSON.parse(localStorage.getItem('session_user') || '{}');
  callApi({
    action: 'getRecordSignableGames',
    user_id: session.user_id
  }, res => {
    if (!res || res.result !== 'ok') {
      showToast('載入賽事失敗', 'error');
      return;
    }

    games = Array.isArray(res.games) ? res.games : [];
    renderRecordDashboard(games);
    renderMobileRecord(games);   // ✅ 新增
  });
}

/* ===============================
 * 共用排序工具
 * =============================== */

// ✅ 日期排序（字串 yyyy/mm/dd ➜ Date）
function sortDatesAsc(dates) {
  return dates.sort((a, b) => new Date(a) - new Date(b));
}

// ✅ 組別排序（桌機用：大 ➜ 中 ➜ 小，其餘放後面）
const CATEGORY_ORDER = ['大聯盟組', '中聯盟組', '小聯盟組'];

function sortCategoriesForDesktop(categories) {
  return categories.sort((a, b) => {
    const ia = CATEGORY_ORDER.indexOf(a);
    const ib = CATEGORY_ORDER.indexOf(b);

    if (ia === -1 && ib === -1) return a.localeCompare(b);
    if (ia === -1) return 1;
    if (ib === -1) return -1;
    return ia - ib;
  });
}


/* ===== 分組 ===== */
function groupGames(list) {
  const map = {};
  list.forEach(g => {
    const date = formatDateTW(g.date);
    const cat  = g.category || '未分類';

    if (!map[date]) map[date] = {};
    if (!map[date][cat]) map[date][cat] = [];
    map[date][cat].push(g);
  });

  Object.values(map).forEach(catMap => {
    Object.values(catMap).forEach(arr => {
      arr.sort((a, b) => a.time.localeCompare(b.time)); // ✅ 正確排序
    });
  });

  return map;
}

/* ===== Render（桌機） ===== */
function renderRecordDashboard(list) {
  const root = document.getElementById('recordContainer');
  root.innerHTML = '';

  const grouped = groupGames(list);

  // ⭐ 日期排序（共用）
  const dates = sortDatesAsc(Object.keys(grouped));

  dates.forEach(date => {
    if (isPastGame(date)) return;
  
    // ✅ 日期大格
    const dateBox = document.createElement('div');
    dateBox.className = 'panel';   // 你本來就有 panel 樣式
  
    dateBox.insertAdjacentHTML(
      'beforeend',
      `<div class="date-title">${date}</div>`
    );
  
    const categories = sortCategoriesForDesktop(
      Object.keys(grouped[date])
    );
  
    categories.forEach(cat => {
      // ✅ 組別中格
      dateBox.insertAdjacentHTML(
        'beforeend',
        `<div class="group-title">│ ${cat}</div>`
      );
  
      dateBox.insertAdjacentHTML(
        'beforeend',
        buildGroupTable(grouped[date][cat])
      );
    });
  
    root.appendChild(dateBox);
  });
}

/* ===== Table ===== */
function buildGroupTable(list) {
  return `
  <table class="record-table">
    <thead>
      <tr>
        <th>時間</th>
        <th>客隊（三壘）</th>
        <th>主隊（一壘）</th>
        <th>地點</th>
        <th>記錄員</th>
        <th>見習記錄</th>
        <th>影像記錄</th>
      </tr>
    </thead>
    <tbody>
      ${list.map(buildRow).join('')}
    </tbody>
  </table>`;
}

function buildRow(g) {
  return `
  <tr>
    <td>${formatTimeTW(g.time)}</td>
    <td>${g.away_team}</td>
    <td>${g.home_team}</td>
    <td>${g.field}</td>
    <td>${renderSignupCell(g,'REC_MAIN')}</td>
    <td>${renderSignupCell(g,'REC_TRAINEE')}</td>
    <td>${renderSignupCell(g,'REC_VIDEO')}</td>
  </tr>`;
}

/* ===== 桌機版紀錄報名　Signup UI ===== */
function renderSignupCell(g, role) {
  const slot = g.record_slots?.[role];

  if (isPastGame(g.date)) {
    return `<span class="signup-other">—</span>`; // ✅ 過期鎖住
  }

  if (!slot) {
    return `<span class="signup-btn" onclick="signup('${g.game_id}','${role}')">＋報名</span>`;
  }

  // ✅ 型別統一後，比對才會成立
  if (String(slot.user_id) === String(session.user_id)) {
    return `
      <span class="signup-me">
        ${slot.name || '我'}
        <span class="cancel-btn"
          onclick="cancelSignup('${g.game_id}','${role}')">
          取消
        </span>
      </span>`;
  }

  return `<span class="signup-other">${slot.name}</span>`;
}

/* ===== Actions ===== */
function signup(gameId, role) {
  showToast('報名中...');
  callApi({
    action:'recordSignup',
    user_id: session.user_id,
    game_id: gameId,
    record_role: role
  }, res => {
    res?.result === 'ok' ? (showToast('報名成功'), loadGames())
                         : showToast(res?.message||'報名失敗','error');
  });
}

function cancelSignup(gameId, role) {
  if (!confirm('確定取消此場紀錄？')) return;
  showToast('取消中...');
  callApi({
    action:'cancelRecordSignup',
    user_id: session.user_id,
    game_id: gameId,
    record_role: role
  }, res => {
    res?.result === 'ok' ? (showToast('已取消'), loadGames())
                         : showToast(res?.message||'取消失敗','error');
  });
}

function recordSignup(gameId, role) {
  const session = getSession();
  if (!session) {
    alert('登入狀態失效，請重新登入');
    location.replace('../login.html');
    return;
  }

  callApi({
    action: 'recordSignup',
    user_id: session.user_id,   // ✅ 唯一正解
    game_id: gameId,
    record_role: role
  }, res => {
    if (res.result === 'ok') {
      location.reload();
    } else {
      alert(res.message || '報名失敗');
    }
  });
}

/* ===== 時間 ===== */
function formatDateTW(v) {
  return new Date(v).toLocaleDateString('zh-TW',{timeZone:'Asia/Taipei'});
}
function formatTimeTW(v) {
  return v; // 已是 HH:mm
}

/* ===== 手機版 render（完整）===== */
function renderMobileRecord(list) {
  const root = document.getElementById('mobileView');
  if (!root) return;
  root.innerHTML = '';

  const grouped = groupGames(list);
  Object.keys(grouped).sort().forEach(date => {
    if (isPastGame(date)) return;
  
    // ✅ 日期大格
    const dateBox = document.createElement('div');
    dateBox.className = 'm-date-box';
  
    dateBox.insertAdjacentHTML(
      'beforeend',
      `<div class="m-date-title">📅 ${date}</div>`
    );
  
    Object.keys(grouped[date]).forEach(cat => {
      // ✅ 組別中格
      const groupBox = document.createElement('div');
      groupBox.className = 'm-group-box';
  
      groupBox.insertAdjacentHTML(
        'beforeend',
        `<div class="m-group-title">${cat}</div>`
      );
  
      grouped[date][cat].forEach(g => {
        groupBox.insertAdjacentHTML('beforeend', `
          <div class="record-card">
            <div class="record-header">
              <div>⏰ ${formatTimeTW(g.time)}</div>
            </div>
            <div class="record-main">
              <div>${g.away_team} vs ${g.home_team}</div>
              <div>📍 ${g.field}</div>
            </div>
            <div class="record-roles">
              ${renderRecordMobileRole(g,'REC_MAIN','紀錄員')}
              ${renderRecordMobileRole(g,'REC_TRAINEE','見習紀錄')}
              ${renderRecordMobileRole(g,'REC_VIDEO','影像紀錄')}
            </div>
          </div>
        `);
      });
  
      dateBox.appendChild(groupBox);
    });
  
    root.appendChild(dateBox);
  });
}


function renderRecordMobileRole(g, role, label) {
  const slot = g.record_slots && g.record_slots[role];

  // 過期鎖定
  if (isPastGame(g.date)) {
  return `
    <div class="record-role other">
      ${label}<br>—
    </div>
  `;
  }

  // 尚未有人報名
  if (!slot) {
    return `
      <div class="record-role action"
        onclick="signup('${g.game_id}','${role}')">
        ＋${label}
      </div>
    `;
  }

  const isMe = String(slot.user_id) === String(session.user_id);

  // ✅ 我自己（加上取消）
  if (isMe) {
    return `
      <div class="record-role me">
        ${label}<br>我
        <div class="cancel-btn"
          onclick="cancelSignup('${g.game_id}','${role}')">
          取消
        </div>
      </div>
    `;
  }

  // 他人
  const name = slot.name || '';
  return `
    <div class="record-role other">
      ${label}<br>${name}
    </div>
  `;
}



// 先「日期 → 群組 → 賽事（排序）」
function groupGamesForMobile(games) {
  const map = {};

  games.forEach(g => {
    const date = g.date;                 // yyyy/mm/dd
    const category = g.category || '未分類';

    if (!map[date]) map[date] = {};
    if (!map[date][category]) map[date][category] = [];

    map[date][category].push(g);
  });

  // ✅ 每個組別內依時間排序
  Object.values(map).forEach(catMap => {
    Object.values(catMap).forEach(list => {
      list.sort((a, b) => a.time.localeCompare(b.time));
    });
  });

  return map;
}


// 手機版 render（一次跑完三層）
/* ===== Render（手機） ===== */
function renderMobileByDate(games) {
  const root = document.getElementById('mobileView');
  if (!root) return;

  root.innerHTML = '';

  const grouped = groupGamesForMobile(games);

  // ⭐ 只共用日期排序
  const dates = sortDatesAsc(Object.keys(grouped));

  dates.forEach(date => {
    const dateBox = document.createElement('div');
    dateBox.className = 'm-date-box';
    dateBox.innerHTML = `<div class="m-date-title">📅 ${date}</div>`;
    root.appendChild(dateBox);

    // ✅ 手機：保持你原本的 category 順序（不強制）
    Object.keys(grouped[date]).forEach(category => {
      const groupBox = document.createElement('div');
      groupBox.className = 'm-group-box';
      groupBox.innerHTML = `<div class="m-group-title">${category}</div>`;
      dateBox.appendChild(groupBox);

      grouped[date][category].forEach(g => {
        groupBox.insertAdjacentHTML('beforeend', `
          <div class="m-game-card">
            <div class="m-game-time">⏰ ${g.time}</div>
            <div class="m-game-teams">
              ${g.away_team} vs ${g.home_team}
            </div>
            <div class="m-game-field">📍 ${g.field}</div>
          </div>
        `);
      });
    });
  });
}


</script>

</body>
