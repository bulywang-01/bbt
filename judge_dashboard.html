<script>
const session = getSession
  ? getSession() 
  : JSON.parse(localStorage.getItem('session_user')||'{}');
 
function loadHeader() {
  fetch('header.html')
    .then(res => res.text())
    .then(html => {
      document.getElementById('header-container').innerHTML = html;

      // ✅ 只用 body class 控制身份
      const session = (typeof getSession === 'function') ? getSession() : null;
      document.body.classList.remove(
        'role-admin', 'role-judge', 'role-record'
      );

      if (session && session.role) {
        const roles = session.role.split(',').map(r => r.trim());

        if (roles.includes('admin')) {
          document.body.classList.add('role-admin');
        }
        if (roles.includes('judge') || roles.includes('chief_judge')) {
          document.body.classList.add('role-judge');
        }
        if (roles.includes('record') || roles.includes('record_chief')) {
          document.body.classList.add('role-record');
        }
      }
    })
    .catch(err => console.error('Header 載入失敗', err));
  }
  
  // 裁入報名頁面重要function
  document.addEventListener('DOMContentLoaded', () => {
    loadHeader();   // 只負責 header
    loadGames();    // 或該頁真正的資料初始化
    initMonthTabs();  // 初始化月班表選擇
  });
</script>

<script>

const s = JSON.parse(localStorage.getItem('session_user')||'{}');
  
function getName(v){
  if (!v) return '—';
  if (typeof v === 'object') return v.name || '—';
  return v;
}

// 組別對應顏色
function applyCategoryBadgeColor() {
  const colorMap = {
    '大聯盟': '#2563eb',   // 藍
    '小聯盟': '#16a34a',   // 綠
    '六年級': '#d97706',   // 黃
    '五年級': '#9333ea',   // 紫
    'U12': '#ef4444'       // 紅
  };

  document.querySelectorAll('.game-code.badge').forEach(el => {
    const cat = el.dataset.category;
    const color = colorMap[cat] || '#6b7280'; // 預設灰
    el.style.backgroundColor = color;
  });
}

function hideLoading() {
  const overlay = document.getElementById('loadingOverlay');
  if (overlay) overlay.remove();
}

/* ===== 狀態 ===== */
let allGames = [];
let selectedPositions = {}; // game_id -> role
let games = [];
let currentTournament = '';

/* ===== API ===== */
function loadGames() {
  const s = JSON.parse(localStorage.getItem('session_user')||'{}');
 showToast('載入賽事資料中...');

  callApi(
    { action:'getSignableGames', user_id: s.user_id || '' },
    res => {

      if (!res || res.result !== 'ok') {
        showToast(res?.message || '無法取得賽事資料');
        return;
      }

      allGames = (res.games || []).map(safeMerge);
      games = allGames;

      buildTournamentSelector();
      
      // ✅ ✅ ✅ 補 my_position（一定要）
      const s = session;
      
      allGames.forEach(g => {
      
        if (g.judges){
          for (let [role, val] of Object.entries(g.judges)){
            if (isMySlot(val, s)){
              g.my_position = role;
            }
          }
        }
      
        if (g.records){
          for (let [role, val] of Object.entries(g.records)){
            if (isMySlot(val, s)){
              g.my_position = role;
            }
          }
        }
      
      });
      
      if (typeof setGameCache === 'function'){
        setGameCache(allGames);
      }

      console.log(games.map(g => g.status));
      render();

      ;

    }
  );
}

function buildTournamentSelector(){

  const area =
    document.getElementById('tournamentFilterArea');

  if (!area) return;

  const tournaments = [
    ...new Set(
      allGames
        .map(g =>
          String(g.tournament || '').trim()
        )
        .filter(Boolean)
    )
  ].sort();

  // ✅ 只有一個賽事
  if (tournaments.length <= 1){

    currentTournament =
      tournaments[0] || '';

    localStorage.setItem(
      'currentTournament',
      currentTournament
    );

    area.innerHTML = `
      <div style="
        display:flex;
        align-items:center;
        gap:8px;
        margin:6px 0;
        flex-wrap:wrap;
      ">
        <span style="
          font-weight:700;
          color:#1e3a8a;
          font-size:16px;
        ">
          ⚾ 裁判班表
        </span>

        <span style="font-weight:700;">
          ／請選擇報名賽事：
        </span>

        <span style="
          background:#dbeafe;
          color:#1d4ed8;
          padding:4px 10px;
          border-radius:999px;
          font-size:13px;
          font-weight:700;
        ">
          ${currentTournament}
        </span>
      </div>
    `;

    return;
  }

  // ✅ 讀取上次選擇
  const savedTournament =
    localStorage.getItem('currentTournament') || '';

  // ✅ 如果上次有選而且還存在，就沿用
  if (
    savedTournament &&
    tournaments.includes(savedTournament)
  ){
    currentTournament = savedTournament;
  }else{
    currentTournament = '';
  }

  area.innerHTML = `
    <div style="
      display:flex;
      align-items:center;
      gap:8px;
      margin:6px 0;
      flex-wrap:wrap;
    ">

      <span style="
        font-weight:700;
        color:#1e3a8a;
        font-size:16px;
      ">
        ⚾ 裁判班表
      </span>

      <span style="font-weight:700;">
        ／請選擇報名賽事：
      </span>

      <select
        id="tournamentFilter"
        style="
          padding:6px 10px;
          border-radius:8px;
          border:1px solid #d1d5db;
          min-width:240px;
          font-size:14px;
        "
        onchange="
          currentTournament=this.value;
          localStorage.setItem(
            'currentTournament',
            currentTournament
          );
          render();
        "
      >

        <option value="">
          請選擇要報名的賽事
        </option>

        ${tournaments.map(t => `
          <option
            value="${t}"
            ${t === currentTournament ? 'selected' : ''}
          >
            ${t}
          </option>
        `).join('')}

      </select>

    </div>
  `;
}


/* ===== 工具 ===== */
function cancelSelected(gameId) {
  delete selectedPositions[gameId];
  render();
}
  
function cancelSelectedByDate() {
  if (!Object.keys(selectedPositions).length) {
    alert('目前沒有已選擇的站位');
    return;
  }

  const date = prompt('請輸入要取消的日期（yyyy/MM/dd）');
  if (!date) return;

  let removed = 0;

  allGames.forEach(g => {
    if (g.date === date && selectedPositions[g.game_id]) {
      delete selectedPositions[g.game_id];
      removed++;
    }
  });

  if (!removed) {
    alert('該日期沒有已選擇的站位');
  } else {
    alert(`已取消 ${date} 的 ${removed} 筆選擇`);
    render();
  }
}

function formatTime(t){
  const d = new Date(t);
  return d.getHours().toString().padStart(2,'0') + ':' +
         d.getMinutes().toString().padStart(2,'0');
}

function rememberSelection(gameId, role, btn) {
  // 清掉舊選擇
  // delete selectedPositions[gameId];
  selectedPositions[gameId] = role;

  // 清除同場所有已選外觀
  document
    .querySelectorAll(`.signup-btn[data-game="${gameId}"]`)
    .forEach(b => b.classList.remove('selected'));

  // 標記目前按下的按鈕
  if (btn) {
    btn.classList.add('selected');
  }

  // ✅ 一定要在 if 外
  render();
}

/* ✅ ✅ ✅ 核心：統一時間 */
function timeToMinutes(t){
  if (!t) return 0;
  const [h,m] = t.split(':').map(Number);
  return h*60+m;
}

function timeToMinutesSafe(t){
  return timeToMinutes(t);
}


/* ✅ ========= 主 render ========= */
function render(){

  const root = document.getElementById('content');
  if(
    document.getElementById('tournamentFilter') &&
    !currentTournament
  ){
  
    root.innerHTML = `
      <div class="row-warning">
        請先選擇要報名的賽事
      </div>
    `;
  
    return;
  }
  
  root.innerHTML = '';

  if (!games || !games.length){
    root.innerHTML = '<div>沒有資料</div>';
    return;
  }
  
  const dateMap = {};

  /* =========================
     日期篩選
  ========================= */
  games.forEach(g => {

    if(
      currentTournament &&
      String(g.tournament || '').trim()
        !== currentTournament
    ){
      return;
    }
    
    const s = Number(g.status || 0);

    // ✅ 暫存不顯示
    if (s === 3) return;

    const d = new Date(g.date.replace(/\//g,'-'));
    d.setHours(0,0,0,0);

    const today = new Date();
    today.setHours(0,0,0,0);

    /* 月份模式 */
    if (window.currentMonth !== null){

      const m = d.getMonth() + 1;

      if (m !== window.currentMonth){
        return;
      }

    }
    /* 全年模式 */
    else if (window.isFullYear){

      // 不過濾

    }
    /* 預設本週之後 */
    else{

      const day = today.getDay();

      const monday = new Date(today);

      monday.setDate(
        today.getDate() -
        (day === 0 ? 6 : day - 1)
      );

      monday.setHours(0,0,0,0);

      if (d < monday){
        return;
      }

    }

    if (!dateMap[g.date]){
      dateMap[g.date] = [];
    }

    dateMap[g.date].push(g);

  });

  /* =========================
     日期排序
  ========================= */

  Object.keys(dateMap)
    .sort((a,b)=>
      new Date(a) - new Date(b)
    )
    .forEach(date => {

      root.innerHTML += `
        <div class="date-header">
          📅 ${formatDateTW(date)}
        </div>
      `;

      const dayGames = dateMap[date];

      /* =====================================
         場地分組（恢復原本邏輯）
         同場地不同組別 → 混合組
         顯示：賽事名稱｜組別
      ===================================== */
      
      const fieldMap = {};
      
      dayGames.forEach(g => {
      
        const field = g.field || '未分類場地';
      
        if (!fieldMap[field]){
          fieldMap[field] = [];
        }
      
        fieldMap[field].push(g);
      
      });
      
      Object.keys(fieldMap).forEach(field => {
      
        const gamesInField = fieldMap[field];
      
        const tournament =
          String(
            gamesInField[0]?.tournament ||
            gamesInField[0]?.tournament_type ||
            '未分類賽事'
          ).trim();
      
        const hasMultiCategory =
          new Set(
            gamesInField.map(x => x.category)
          ).size > 1;
      
        if (hasMultiCategory){
      
          const sorted =
            gamesInField.sort((a,b)=>
              timeToMinutes(getTime(a))
              -
              timeToMinutes(getTime(b))
            );
      
          root.innerHTML += `
            <div class="category-title">
              ${tournament}｜混合組｜${field}
            </div>
      
            <div class="card-grid">
      
              ${
                sorted
                  .map(g =>
                    renderGameCard(
                      g,
                      {
                        session,
                        type:'judge'
                      }
                    )
                  )
                  .join('')
              }
      
            </div>
          `;
      
        }
        else{
      
          const categoryMap = {};
      
          gamesInField.forEach(g => {
      
            const cat =
              g.category || '未分類';
      
            if (!categoryMap[cat]){
              categoryMap[cat] = [];
            }
      
            categoryMap[cat].push(g);
      
          });
      
          Object.keys(categoryMap).forEach(cat => {
      
            const sorted =
              categoryMap[cat]
                .sort((a,b)=>
                  timeToMinutes(getTime(a))
                  -
                  timeToMinutes(getTime(b))
                );
      
            root.innerHTML += `
              <div class="category-title">
                ${tournament}｜${cat}
              </div>
      
              <div class="card-grid">
      
                ${
                  sorted
                    .map(g =>
                      renderGameCard(
                        g,
                        {
                          session,
                          type:'judge'
                        }
                      )
                    )
                    .join('')
                }
      
              </div>
            `;
      
          });
      
        }
      
      });

    });

}

function renderRow(g){

  const isPast = isPastGame(g.date);

  const occupied = g.judges || {};
  const assigned = Object.values(occupied).filter(x=>x).length;

  return `
    <tr class="${isPast?'expired':''}">
      <td>${g.game_code}</td>
      <td>${getTime(g)}</td>
      <td>${g.category}</td>
      <td>${g.away_team}</td>
      <td>${g.home_team}</td>
      <td>${g.field}</td>
      <td>${assigned}/${g.need_count}</td>

      ${['PU','U1','U2','U3'].map(role=>{
        return `<td>${renderPos(g,role,isPast)}</td>`;
      }).join('')}

    </tr>
  `;
}

// ✅ 裁判頁手機版：依 日期 → 組別 → 場次 分組
function groupGamesForMobile(games) {
  const map = {};

  games.forEach(g => {
    const date = g.date; // yyyy/MM/dd
    const category = g.category || '未分類';

    if (!map[date]) map[date] = {};
    if (!map[date][category]) map[date][category] = [];

    map[date][category].push(g);
  });

  // ✅ 每個組別內依「裁判頁時間欄位」排序
  Object.values(map).forEach(catMap => {
    Object.values(catMap).forEach(list => {
      list.sort((a, b) =>
        timeToMinutesSafe(a.time_range) -
        timeToMinutesSafe(b.time_range)
      );
    });
  });

  return map;
}

 
function renderTimeHHmm(t) {
  if (!t) return '';

  // ✅ 已經是字串（08:30）
  if (typeof t === 'string') {
    // 保險：如果已經是 HH:mm，直接回傳
    if (/^\d{1,2}:\d{2}$/.test(t)) {
      return t;
    }
    // 其他字串就原樣回
    return t;
  }

  // ✅ 是 Date 物件（1899-12-30）
  if (t instanceof Date) {
    return (
      t.getHours().toString().padStart(2, '0') +
      ':' +
      t.getMinutes().toString().padStart(2, '0')
    );
  }

  // 其他型別（保險）
  return String(t);
}
 
/* ===== 送出 ===== */

function submitSignup(){
  const entries = Object.keys(selectedPositions);
  if (!entries.length){
    showToast('尚未選擇站位');
    return;
  }

  const session = ensureLogin();
  if (!session) return;

  const payload = entries.map(
    id => `${id}:${selectedPositions[id]}`
  );

  // ✅ 顯示存入中
 showToast('報名資料存入中...');

  callApi(
    {
      action: 'judgeSignupByGames',
      user_id: s.user_id,
      games_with_position: payload.join(',')
    },
    res => {
      if (res && res.result === 'ok') {
        showToast('✅ 報名成功');
        setTimeout(() => location.reload(), 800);
      } else {
        showToast(res?.message || '❌ 報名失敗');
      }
    }
  );
}


// 訊息function


function logout(){
  localStorage.clear();
  location.replace('login.html');
}


// 初始化月份
window.currentMonth = null;
window.isFullYear = false;
  
function initMonthTabs() {

  const now = new Date();
  const year = now.getFullYear();

  const container = document.getElementById('month-tabs');
  container.innerHTML = '';

  // ✅ ✅ ✅ 全年按鈕
  const allBtn = document.createElement('div');
  allBtn.className = 'month-tab active';
  allBtn.textContent = '📊 全年班表';

  allBtn.onclick = () => {
    window.currentMonth = null;
    window.isFullYear = true;
    setActiveTab(allBtn);
    loadGames();
    showToast(`載入全年班表`, 'success');
  };


  container.appendChild(allBtn);


  // ✅ 月份
  for (let m = 1; m <= 12; m++) {

    const div = document.createElement('div');
    div.className = 'month-tab';
    div.textContent = `${m}月`;

    if (m === now.getMonth() + 1) {
      // 預設不要 active（讓全年是預設）
    }

    div.onclick = () => {
      window.currentMonth = m;
      window.isFullYear = false;
      setActiveTab(div);
      loadJudgeGamesByMonth(year, m);
      showToast(`載入 ${m}月 班表`, 'success');
    };


    container.appendChild(div);
  }
}

function setActiveTab(el) {
  document.querySelectorAll('.month-tab')
    .forEach(t => t.classList.remove('active'));
  el.classList.add('active');
}

// 呼叫API
function loadJudgeGamesByMonth(year, month) {

  const s = JSON.parse(localStorage.getItem('session_user')||'{}');

 showToast('載入月份班表中...');

  callApi({
    action: 'getJudgeGamesByMonth',
    year: year,
    month: month,
    user_id: s.user_id
  }, res => {

    if (!res || res.result !== 'ok') {
      showToast('載入失敗');
      return;
    }

    allGames = (res.games || []).map(safeMerge);
    
    // ✅ ✅ ✅ 同樣補
    const s = session;
    
    allGames.forEach(g => {
    
      if (g.judges){
        for (let [role, val] of Object.entries(g.judges)){
          if (isMySlot(val, s)){
            g.my_position = role;
          }
        }
      }
    
      if (g.records){
        for (let [role, val] of Object.entries(g.records)){
          if (isMySlot(val, s)){
            g.my_position = role;
          }
        }
      }
    
    });
    
    if (typeof setGameCache === 'function'){
      setGameCache(allGames);
    }


    // ✅ ✅ ✅ 關鍵（補空資料）
    if (!allGames.length) {
      showToast('當月無賽事');
      document.getElementById('content').innerHTML = '';
      document.getElementById('mobileView').innerHTML = '';
      return;
    }

    render();
  });
}

function safeMerge(g){

  // ✅ 如果後端已經整理好就直接用
  if (g.judges && Object.keys(g.judges).some(v => g.judges[v])){
    return g;
  }

  // ✅ 初始化
  g.judges = g.judges || {};
  g.records = g.records || {};

  // ✅ 裁判
  ['PU','U1','U2','U3'].forEach(r=>{
    g.judges[r] =
      g.assignment_judges?.[r] ||
      g.signup_judges?.[r] ||
      '';
  });

  // ✅ 紀錄
  ['REC_MAIN','REC_TRAINEE','REC_VIDEO'].forEach(r=>{
    g.records[r] =
      g.assignment_records?.[r] ||
      g.signup_records?.[r] ||
      '';
  });
 
  g.status = Number(g.status || 0);
  return g;
}
