<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>管理中心</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- ✅ 你原本就有、而且不能動的 JS -->
  <script src="js/auth.js"></script>
  <script src="js/config.js"></script>

  <style>
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f5f6f8;
    }

    .main {
      max-width: 1100px;
      margin: 0 auto;
      padding: 20px;
    }

    h2 {
      margin-top: 0;
      font-size: 24px;
    }

    .section-title {
      margin: 32px 0 12px;
      font-size: 20px;
      font-weight: 900;
    }

    /* ===== Grid：2～3 格一列 ===== */
    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 18px;
    }

    /* ===== 卡片（header 風格） ===== */
    .card {
      background: #ffffff;
      border-radius: 14px;
      min-height: 90px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      font-size: 18px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(0,0,0,.08);
      transition: transform .15s ease, box-shadow .15s ease;
    }

    .card:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 18px rgba(0,0,0,.14);
    }

    /* ✅ 權限顯示（你原本的） */
    .role-admin,
    .role-chief-judge,
    .role-record-chief {
      display: none;
    }

    /* ===== Modal（你原本就有） ===== */
    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.4);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 999;
    }

    .modal-content {
      background: #fff;
      width: 90%;
      max-width: 960px;
      max-height: 90vh;
      overflow-y: auto;
      border-radius: 10px;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 16px;
      border-bottom: 1px solid #eee;
      position: sticky;
      top: 0;
      background: #fff;
    }

    .modal-body {
      padding: 16px;
    }

    .hidden {
      display: none;
    }

    /* ===== 年度表格（你原 render 用） ===== */
    .admin-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
    }

    .admin-table th,
    .admin-table td {
      padding: 10px 12px;
      border-bottom: 1px solid #ddd;
    }

    .admin-table th {
      text-align: left;
      font-weight: 700;
    }

    .admin-table td.num {
      text-align: right;
      font-weight: 600;
    }
  </style>
</head>

<body>
  <!-- ✅ header 容器 -->
  <div id="header-container"></div>

  <div class="main">
    <h2>管理中心</h2>
    <p style="color:#666;margin-top:-6px">請依身份選擇可用的管理功能</p>

    <!-- ===== 班表與年度統計 ===== -->
    <div class="section-title">📊 班表與年度統計</div>
    <div class="cards">

      <div class="card role-admin role-chief-judge"
           onclick="openAnnualModal('judge')">
        📈 全員裁判年度總表
      </div>

      <div class="card role-admin role-record-chief"
           onclick="openAnnualModal('record')">
        📝 全員紀錄員年度總表
      </div>

      <div class="card role-admin role-chief-judge"
           onclick="location.href='judge_dashboard_admin.html'ecord_dashboard_admin.html'v class="section-title">⚙️ 系統管理</div>
    <div class="cards">

      <div class="card role-admin"
           onclick="location.href='admin_users.html'
           onclick="location.href='admin_games.html' 年度 Modal（你原本的） ===== -->
  <div id="annualModal" class="modal hidden">
    <div class="modal-content">
      <div class="modal-header">
        <h3 id="annualModalTitle"></h3>
        <div>
          <select id="annualYearSelect" onchange="reloadAnnualByYear()"></select>
          <button onclick="closeAnnualModal()">✕</button>
        </div>
      </div>
      <div class="modal-body" id="annualModalBody">載入中…</div>
    </div>
  </div>

  <!-- ===== ✅ 你原本完整的 JS（一行不刪，只修語法） ===== -->
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      guardAdminPage();

      const session = getSession();
      const roles = getRoles(session);

      fetch('header.html')
        .then(res => res.text())
        .then(html => {
          document.getElementById('header-container').innerHTML = html;
          initHeaderVisibility();
        });

      if (roles.includes('admin')) {
        document.querySelectorAll('.role-admin')
          .forEach(el => el.style.display = 'flex');
      }
      if (roles.includes('chief_judge')) {
        document.querySelectorAll('.role-chief-judge')
          .forEach(el => el.style.display = 'flex');
      }
      if (roles.includes('record_chief')) {
        document.querySelectorAll('.role-record-chief')
          .forEach(el => el.style.display = 'flex');
      }
    });

    /* =========================
     * 年度總表 Modal（你原本的）
     * ========================= */
    let currentAnnualType = null;

    function openAnnualModal(type) {
      currentAnnualType = type;

      document.getElementById('annualModalTitle').textContent =
        type === 'judge' ? '全員裁判年度總表' : '全員紀錄員年度總表';

      document.getElementById('annualModalBody').textContent = '載入中…';
      document.getElementById('annualModal').classList.remove('hidden');

      loadAvailableYears();
    }

    function closeAnnualModal() {
      document.getElementById('annualModal').classList.add('hidden');
    }

    function loadAvailableYears() {
      callApi({ action: 'getAvailableGameYears' }, res => {
        if (res.result !== 'ok') {
          document.getElementById('annualModalBody').textContent = res.message;
          return;
        }

        const sel = document.getElementById('annualYearSelect');
        sel.innerHTML = '';

        res.years.forEach((y, i) => {
          const opt = document.createElement('option');
          opt.value = y;
          opt.textContent = y + ' 年';
          if (i === 0) opt.selected = true;
          sel.appendChild(opt);
        });

        reloadAnnualByYear();
      });
    }

    function reloadAnnualByYear() {
      const year = document.getElementById('annualYearSelect').value;

      callApi({
        action: currentAnnualType === 'judge'
          ? 'getJudgeAnnualSummary_'
          : 'getRecordAnnualSummary_',
        year: year
      }, res => {
        if (res.result !== 'ok') {
          document.getElementById('annualModalBody').textContent = res.message;
          return;
        }

        renderAnnualTable(res.list, currentAnnualType);
      });
    }

    function renderAnnualTable(list, type) {
      if (!list || list.length === 0) {
        document.getElementById('annualModalBody').innerHTML =
          '<p style=\"color:#888\">此年度沒有資料</p>';
        return;
      }

      const detailTitle = type === 'judge' ? '站位分佈' : '角色分佈';

      const rows = list.map(u => {
        const detail =
          type === 'judge'
            ? Object.entries(u.positions || {}).map(([k,v]) => `${k}：${v}`).join(' ｜ ')
            : Object.entries(u.roles || {}).map(([k,v]) => `${k}：${v}`).join(' ｜ ');

        return `
          <tr>
            <td>${u.name}</td>
            <td class="num">${u.annual}</td>
            <td class="num">${u.career}</td>
            <td>${detail || '—'}</td>
          </tr>
        `;
      }).join('');

      document.getElementById('annualModalBody').innerHTML = `
        <table class="admin-table">
          <thead>
            <tr>
              <th>姓名</th>
              <th>年度</th>
              <th>生涯</th>
              <th>${detailTitle}</th>
            </tr>
          </thead>
          <tbody>${rows}</tbody>
        </table>
      `;
    }
  </script>
</body>
</html>
