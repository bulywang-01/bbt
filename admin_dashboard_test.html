<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>管理中心</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- ✅ 你原本就有的 JS（一定要） -->
  <script src="js/auth.js"></script>
  <script src="js/config.js"></script>

  <style>
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f5f6f8;
    }

    .main {
      max-width: 1100px;
      margin: 0 auto;
      padding: 20px;
    }

    h2 {
      margin-top: 0;
      font-size: 24px;
    }

    .section-title {
      margin: 28px 0 14px;
      font-size: 20px;
      font-weight: 900;
    }

    /* ===== Grid：桌機 3、手機 2 ===== */
    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 18px;
    }

    /* ===== 管理中心卡片區背景 ===== */
    .cards {
      background: linear-gradient(180deg, #f7f9fc 0%, #f1f4f9 100%);
      padding: 24px;
      border-radius: 20px;
    }
    
    /* ===== Modal ===== */
    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.45);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 999;
    }

    .modal.hidden {
      display: none;
    }

    .modal-content {
      background: #fff;
      width: 90%;
      max-width: 960px;
      max-height: 90vh;
      overflow-y: auto;
      border-radius: 10px;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 16px;
      border-bottom: 1px solid #eee;
      position: sticky;
      top: 0;
      background: #fff;
    }

    .modal-body {
      padding: 16px;
    }

    /* ===== 年度表 ===== */
    .admin-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
    }

    .admin-table th,
    .admin-table td {
      padding: 10px 12px;
      border-bottom: 1px solid #ddd;
    }

    .admin-table th {
      text-align: left;
      font-weight: 700;
    }

    .admin-table td.num {
      text-align: right;
      font-weight: 600;
    }

    /* =====================================================
       管理中心卡片：Header 同 FU + 三類顏色 + 縮小尺寸
       ===================================================== */
    
    /* Grid 不要撐太開 */
    .cards {
      gap: 14px;
    }
    
    /* 卡片本體：接近正方形 */
    .card {
      background: #f4f6fb;        /* 預設淡底 */
      border-radius: 18px;        /* header 同級圓角 */
      min-height: 84px;           /* ✅ 明顯縮小 */
      padding: 12px;
    
      color: #2b2b2b;
    
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    
      border: 1px solid #e3e7f0;
      box-shadow: none;           /* ✅ 扁平 */
      transition: background-color .15s ease, border-color .15s ease;
      
      font-size: 19px;        /* ✅ 桌機明顯放大 */
      font-weight: 800;
      letter-spacing: .5px;  /* ✅ header 感的小細節 */
    
      gap: 12px;  /* emoji / icon 與文字距離 */

    }
    
    /* hover：像 header 一樣微亮 */
    .card:hover {
      background: #eef2ff;
      border-color: #cfd8ff;
    }
    
    /* =====================================================
       三大類顏色分組（靠順序，不改 HTML）
       1-2：年度總表
       3-4：班表
       5-6：其它
       ===================================================== */
    
    /* 🟦 年度總表 */
    .card:nth-child(1),
    .card:nth-child(2) {
      background: #eef2ff;
    }
    .card:nth-child(1):hover,
    .card:nth-child(2):hover {
      background: #e3e9ff;
    }
    
    /* 🟩 班表 */
    .card:nth-child(3),
    .card:nth-child(4) {
      background: #eefaf4;
    }
    .card:nth-child(3):hover,
    .card:nth-child(4):hover {
      background: #e3f6ed;
    }
    
    /* 🟨 其它（帳號 / 賽事） */
    .card:nth-child(5),
    .card:nth-child(6) {
      background: #fff9e6;
    }
    .card:nth-child(5):hover,
    .card:nth-child(6):hover {
      background: #fff2cc;
    }
    
    /* =====================================================
       手機版再壓一點，像 header 那樣密
       ===================================================== */
    @media (max-width: 640px) {
      .card {
        min-height: 76px;
        font-size: 19px;
        padding: 10px;
        gap: 12px;  /* emoji / icon 與文字距離 */
      }
    }
  </style>
</head>

<body>
  <!-- header -->
  <div id="header-container"></div>

  <div class="main">
    <h2>管理中心</h2>
    <p style="color:#666;margin-top:-6px">請依身份選擇可用的管理功能</p>

    <div class="section-title">📊 班表與年度統計</div>

    <!-- ✅ 6 個功能框，固定存在 -->
    <div class="cards">
    
      <div class="card" onclick="openAnnualModal('judge')">
        📈 全員裁判年度總表
      </div>
    
      <div class="card" onclick="openAnnualModal('record')">
        📝 全員紀錄員年度總表
      </div>
    
      <a href="judge_dashboard_admin.html">
        <div class="card">
          ⚾ 裁判員班表安排
        </div>
      </a>
    
      <a href="record_dashboard_admin.html">
        <div class="card">
          📋 紀錄員班表安排
        </div>
      </a>
    
      <a href="admin_users.html">
        <div class="card">
          👤 帳號管理
        </div>
      </a>
    
      <a href="admin_games.html">
        <div class="card">
          🏟️ 賽事管理
        </div>
      </a>
    
    </div>

  <!-- ✅ Modal 永遠在最外層，而且預設 hidden -->
  <div id="annualModal" class="modal hidden">
    <div class="modal-content">
      <div class="modal-header">
        <h3 id="annualModalTitle"></h3>
        <div>
          <select id="annualYearSelect" onchange="reloadAnnualByYear()"></select>
          <button onclick="closeAnnualModal()">✕</button>
        </div>
      </div>
      <div class="modal-body" id="annualModalBody">載入中…</div>
    </div>
  </div>

  <script>
    /* ===== 初始化：只做 header，不碰 modal ===== */
    document.addEventListener('DOMContentLoaded', function () {
      guardAdminPage();

      fetch('header.html')
        .then(res => res.text())
        .then(html => {
          document.getElementById('header-container').innerHTML = html;
          initHeaderVisibility();
        });
    });

    /* ===== 年度總表 Modal ===== */
    let currentAnnualType = null;

    function openAnnualModal(type) {
      currentAnnualType = type;

      document.getElementById('annualModalTitle').textContent =
        type === 'judge' ? '全員裁判年度總表' : '全員紀錄員年度總表';

      document.getElementById('annualModalBody').textContent = '載入中…';
      document.getElementById('annualModal').classList.remove('hidden');

      loadAvailableYears();
    }

    function closeAnnualModal() {
      document.getElementById('annualModal').classList.add('hidden');
    }

    function loadAvailableYears() {
      callApi({ action: 'getAvailableGameYears' }, res => {
        if (res.result !== 'ok') {
          document.getElementById('annualModalBody').textContent = res.message;
          return;
        }

        const sel = document.getElementById('annualYearSelect');
        sel.innerHTML = '';

        res.years.forEach((y, i) => {
          const opt = document.createElement('option');
          opt.value = y;
          opt.textContent = y + ' 年';
          if (i === 0) opt.selected = true;
          sel.appendChild(opt);
        });

        reloadAnnualByYear();
      });
    }

    function reloadAnnualByYear() {
      const year = document.getElementById('annualYearSelect').value;

      callApi({
        action: currentAnnualType === 'judge'
          ? 'getJudgeAnnualSummary_'
          : 'getRecordAnnualSummary_',
        year
      }, res => {
        if (res.result !== 'ok') {
          document.getElementById('annualModalBody').textContent = res.message;
          return;
        }
        renderAnnualTable(res.list, currentAnnualType);
      });
    }

    function renderAnnualTable(list, type) {
      if (!list || list.length === 0) {
        document.getElementById('annualModalBody').innerHTML =
          '<p style="color:#888">此年度沒有資料</p>';
        return;
      }

      const detailTitle = type === 'judge' ? '站位分佈' : '角色分佈';

      const rows = list.map(u => {
        const detail =
          type === 'judge'
            ? Object.entries(u.positions || {}).map(([k,v]) => `${k}：${v}`).join(' ｜ ')
            : Object.entries(u.roles || {}).map(([k,v]) => `${k}：${v}`).join(' ｜ ');

        return `
          <tr>
            <td>${u.name}</td>
            <td class="num">${u.annual}</td>
            <td class="num">${u.career}</td>
            <td>${detail || '—'}</td>
          </tr>
        `;
      }).join('');

      document.getElementById('annualModalBody').innerHTML = `
        <table class="admin-table">
          <thead>
            <tr>
              <th>姓名</th>
              <th>年度</th>
              <th>生涯</th>
              <th>${detailTitle}</th>
            </tr>
          </thead>
          <tbody>${rows}</tbody>
        </table>
      `;
    }
  </script>
</body>
</html>
