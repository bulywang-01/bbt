<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>管理中心</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- ✅ 共用登入 / API / Header（順序不可變） -->
  <script src="js/auth.js"></script>
  <script src="js/config.js"></script>

  <style>
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f5f6f8;
    }
    .main {
      max-width: 1100px;
      margin: 0 auto;
      padding: 20px;
    }
    h2 { margin-top: 0; }
    .section-title {
      margin: 28px 0 10px;
      font-size: 18px;
      font-weight: 800;
    }
    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 16px;
    }
    .card {
      background: #fff;
      border-radius: 12px;
      padding: 16px;
      box-shadow: 0 2px 10px rgba(0,0,0,.08);
    }
    .card h4 { margin: 0 0 8px; }
    .card p { margin: 4px 0; font-size:14px; color:#555; }
    .card a {
      color: #0066cc;
      font-weight: 600;
      text-decoration: none;
      display: inline-block;
      margin-top: 6px;
    }
    .card a:hover { text-decoration: underline; }

    /* Modal */
    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.4);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 999;
    }
    .modal-content {
      background: #fff;
      width: 90%;
      max-width: 960px;
      max-height: 90vh;
      overflow-y: auto;
      border-radius: 10px;
    }
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 16px;
      border-bottom: 1px solid #eee;
      position: sticky;
      top: 0;
      background: #fff;
    }
    .modal-body { padding: 16px; }
    .hidden { display: none; }

    /* Table */
    .admin-table {
      width:100%;
      border-collapse:collapse;
      font-size:14px;
    }
    .admin-table th,
    .admin-table td {
      padding:10px 12px;
      border-bottom:1px solid #ddd;
    }
    .admin-table td.num { text-align:right; }

    .role-admin,
    .role-chief-judge,
    .role-record-chief { display:none; }

    /* ===== 專業後台表格升級 ===== */
    .admin-table {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0;
      font-size: 14px;
    }
    
    .admin-table thead {
      position: sticky;
      top: 0;
      z-index: 2;
    }
    
    .admin-table th {
      background: #f4f6f8;
      color: #333;
      font-weight: 700;
      text-align: left;
      padding: 10px 12px;
      border-bottom: 1px solid #dcdcdc;
      white-space: nowrap;
    }
    
    .admin-table td {
      padding: 10px 12px;
      border-bottom: 1px solid #eee;
      vertical-align: top;
    }
    
    .admin-table tbody tr:hover {
      background: #eef5ff;
    }
    
    .admin-table td.num {
      text-align: right;
      font-variant-numeric: tabular-nums;
      font-weight: 600;
    }
    
    /* 姓名欄位強調 */
    .admin-table td.name {
      font-weight: 700;
      color: #222;
    }
    
    /* 詳細欄位（站位／角色） */
    .admin-table td.detail {
      font-size: 13px;
      color: #555;
      line-height: 1.6;
    }
    
    /* Zebra */
    .admin-table tbody tr:nth-child(even) {
      background: #fafafa;
    }

    td.name.link {
      cursor: pointer;
      color: #0066cc;
    }
    td.name.link:hover {
      text-decoration: underline;
    }
  </style>
</head>

<body>
  <div id="header-container"></div>

  <div class="main">
    <h2>管理中心</h2>
    <p style="color:#666;margin-top:-6px">請依身份選擇可用的管理功能</p>

    <div class="section-title">📊 班表與年度統計</div>
    <div class="cards">

      <div class="card role-admin role-chief-judge">
        <h4>📈 裁判員年度統計</h4>
        <p>裁判員年度站場數與站位分佈。</p>
        <a href="judge_annual_dashboard.html">個別裁判員 →</a><br>
        <a href="#" onclick="openAnnualModal('judge')">裁判員年度總表 →</a>
      </div>

      <div class="card role-admin role-record-chief">
        <h4>📈 紀錄員年度統計</h4>
        <p>紀錄員年度出勤與角色分佈。</p>
        <a href="record_annual_dashboard.html">個別紀錄員 →</a><br>
        <a href="#" onclick="openAnnualModal('record')">紀錄員年度總表 →</a>
      </div>

      <div class="card role-admin role-chief-judge">
        <h4>📊 裁判員班表安排</h4>
        <p>由裁判長進行場次與站位指派。</p>
        <a href="judge_dashboard_admin.html">前往安排 →</a>
      </div>

      <div class="card role-admin role-record-chief">
        <h4>📊 紀錄員班表安排</h4>
        <p>由紀錄長指派紀錄相關人員。</p>
        <a href="record_dashboard_admin.html">前往安排 →</a>
      </div>

    </div>

    <div class="section-title">⚙️ 系統管理</div>
    <div class="cards">
      <div class="card role-admin">
        <h4>👤 帳號管理</h4>
        <p>管理使用者帳號、角色與狀態。</p>
        <a href="admin_users.html">前往管理 →</a>
      </div>

      <div class="card role-admin">
        <h4>⚾ 賽事管理</h4>
        <p>新增、編輯、刪除賽事與場次。</p>
        <a href="admin_games.html">前往管理 →</a>
      </div>
    </div>
  </div>
  <button onclick="exportAnnualTable()">匯出 Excel</button>
  <div id="personModal" class="modal hidden">
    <div class="modal-content" style="max-width:720px">
      <div class="modal-header">
        <h3 id="personModalTitle"></h3>
        <button onclick="closePersonModal()">✕</button>
      </div>
      <div class="modal-body" id="personModalBody">
        載入中…
      </div>
    </div>
  </div>
  
  <!-- 年度 Modal -->
  <div id="annualModal" class="modal hidden">
    <div class="modal-content">
      <div class="modal-header">
        <h3 id="annualModalTitle"></h3>
        <div>
          <select id="annualYearSelect" onchange="reloadAnnualByYear()"></select>
          <button onclick="closeAnnualModal()">✕</button>
        </div>
      </div>
      <div class="modal-body" id="annualModalBody">載入中…</div>
    </div>
  </div>
  
  <input
  type="text"
  id="annualSearchInput"
  placeholder="搜尋姓名…"
  oninput="filterAnnualTable()"
  style="padding:6px 8px;font-size:14px"
  />

  <script>
    let currentAnnualType = null;

    document.addEventListener('DOMContentLoaded', () => {
      guardAdminPage();
      const roles = getRoles(getSession());

      fetch('header.html')
        .then(r => r.text())
        .then(html => {
          document.getElementById('header-container').innerHTML = html;
          initHeaderVisibility();
        });

      if (roles.includes('admin'))
        document.querySelectorAll('.role-admin').forEach(e => e.style.display='block');
      if (roles.includes('chief_judge'))
        document.querySelectorAll('.role-chief-judge').forEach(e => e.style.display='block');
      if (roles.includes('record_chief'))
        document.querySelectorAll('.role-record-chief').forEach(e => e.style.display='block');
    });

    function openAnnualModal(type){
      currentAnnualType = type;
      document.getElementById('annualModalTitle').textContent =
        type === 'judge' ? '全員裁判年度總表' : '全員紀錄員年度總表';

      document.getElementById('annualModal').classList.remove('hidden');
      buildYearSelect();
    }

    function closeAnnualModal(){
      document.getElementById('annualModal').classList.add('hidden');
    }

    function buildYearSelect(){
      callApi({ action:'getAvailableGameYears' }, res => {
        if (res.result !== 'ok') return;
        const sel = document.getElementById('annualYearSelect');
        sel.innerHTML='';
        res.years.forEach((y,i)=>{
          const o=document.createElement('option');
          o.value=y; o.textContent=y+' 年';
          if(i===0) o.selected=true;
          sel.appendChild(o);
        });
        reloadAnnualByYear();
      });
    }

    function reloadAnnualByYear(){
      const year = document.getElementById('annualYearSelect').value;
      callApi({
        action: currentAnnualType === 'judge'
          ? 'getJudgeAnnualSummary_'
          : 'getRecordAnnualSummary_',
        year
      }, res => {
        if (res.result !== 'ok') {
          document.getElementById('annualModalBody').textContent = res.message;
          return;
        }
      
        renderAnnualTable(res.list, currentAnnualType);
      });
    }


    /**
     * ✅ admin 專用：年度總表 render
     * 不依賴任何其他檔案
     */
    function renderAnnualTable(list, type) {
      const box = document.getElementById('annualModalBody');
      if (!box) return;
    
      if (!list || list.length === 0) {
        box.innerHTML = '<p style="color:#888">此年度沒有資料</p>';
        return;
      }
    
      const detailTitle = type === 'judge' ? '站位分佈' : '角色分佈';
    
      const rows = list.map(u => {
        const detailText =
          type === 'judge'
            ? Object.entries(u.positions || {})
                .map(([k, v]) => `${k}：${v}`)
                .join(' ｜ ')
            : Object.entries(u.roles || {})
                .map(([k, v]) => `${k}：${v}`)
                .join(' ｜ ');
    
        return `
          <tr>
            <td class="name link" onclick="openPersonAnnual('${u.user_id}','${u.name}')">
              ${u.name}
            </td>
            <td class="num">${u.annual}</td>
            <td class="num">${u.career}</td>
            <td class="detail">${detailText || '—'}</td>
          </tr>
        `;
      }).join('');
    
      box.innerHTML = `
        <table class="admin-table">
          <thead>
            <tr>
              <th>姓名</th>
              <th onclick="sortAnnualTable('annual')" style="cursor:pointer">年度 ⬍</th>
              <th onclick="sortAnnualTable('career')" style="cursor:pointer">生涯 ⬍</th>
              <th>${detailTitle}</th>
            </tr>
          </thead>
          <tbody>${rows}</tbody>
        </table>
      `;
    }

    function filterAnnualTable() {
      const keyword = document.getElementById('annualSearchInput').value.trim();
      const rows = document.querySelectorAll('.admin-table tbody tr');
    
      rows.forEach(tr => {
        const nameCell = tr.querySelector('td.name');
        if (!nameCell) return;
    
        const match = nameCell.textContent.includes(keyword);
        tr.style.display = match ? '' : 'none';
      });
    }

    // 排序用
    let currentSortKey = null;
    let currentSortAsc = false;
    
    function sortAnnualTable(key) {
      const tbody = document.querySelector('.admin-table tbody');
      const rows = Array.from(tbody.querySelectorAll('tr'));
    
      if (currentSortKey === key) {
        currentSortAsc = !currentSortAsc;
      } else {
        currentSortKey = key;
        currentSortAsc = false;
      }
    
      rows.sort((a, b) => {
        const av = Number(a.querySelector(`td.num.${key}`)?.textContent || 0);
        const bv = Number(b.querySelector(`td.num.${key}`)?.textContent || 0);
        return currentSortAsc ? av - bv : bv - av;
      });
    
      rows.forEach(tr => tbody.appendChild(tr));
    }

    function openPersonAnnual(userId, name) {
      document.getElementById('personModalTitle').textContent = name + ' 年度明細';
      document.getElementById('personModalBody').textContent = '載入中…';
      document.getElementById('personModal').classList.remove('hidden');
    
      // ✅ 使用你現有的年度 API，或你原來「個別頁」用的 API
      callApi({
        action: 'getPersonAnnualDetail',
        user_id: userId,
        year: document.getElementById('annualYearSelect').value
      }, res => {
        document.getElementById('personModalBody').innerHTML =
          res.result === 'ok'
            ? renderPersonAnnualDetail(res)
            : res.message;
      });
    }
    
    function closePersonModal() {
      document.getElementById('personModal').classList.add('hidden');
    }

    // 匯出Excel
    function exportAnnualTable() {
      const table = document.querySelector('.admin-table');
      let csv = [];
    
      table.querySelectorAll('tr').forEach(tr => {
        const row = Array.from(tr.children)
          .map(td => `"${td.textContent.trim()}"`)
          .join(',');
        csv.push(row);
      });
    
      const blob = new Blob([csv.join('\n')], { type: 'text/csv' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = '年度總表.csv';
      a.click();
    }

  </script>
</body>
</html>
