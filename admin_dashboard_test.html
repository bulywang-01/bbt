<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>管理中心</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- ✅ 共用登入 / API / Header（順序不可變） -->
  <script src="js/auth.js"></script>
  <script src="js/config.js"></script>
  
  <style>
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f5f6f8;
    }
    .main {
      max-width: 1100px;
      margin: 0 auto;
      padding: 20px;
    }
    h2 { margin-top: 0; }
    .section-title {
      margin: 28px 0 10px;
      font-size: 18px;
      font-weight: 800;
    }

    /* ===== 卡片 ===== */
    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 16px;
    }
    .card {
      background: #fff;
      border-radius: 12px;
      padding: 16px;
      box-shadow: 0 2px 10px rgba(0,0,0,.08);
      cursor: pointer;
      transition: transform .15s, box-shadow .15s;
    }
    .card:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 14px rgba(0,0,0,.12);
    }
    .card h4 { margin: 0 0 8px; }
    .card p { margin: 4px 0; font-size:14px; color:#555; }
    .card .action { margin-top:10px; color:#0066cc; font-weight:700; }

    /* ===== Modal ===== */
    .modal {
      position:fixed;
      inset:0;
      background:rgba(0,0,0,.45);
      display:flex;
      justify-content:center;
      align-items:center;
      z-index:999;
    }
    .modal-content {
      background:#fff;
      width:90%;
      max-width:960px;
      max-height:90vh;
      overflow-y:auto;
      border-radius:10px;
    }
    .modal-header {
      display:flex;
      justify-content:space-between;
      align-items:center;
      padding:14px 16px;
      border-bottom:1px solid #eee;
      position:sticky;
      top:0;
      background:#fff;
      z-index:1;
    }
    .modal-header h3 { margin:0; }
    .modal-tools { display:flex; gap:8px; align-items:center; }
    .close-btn {
      border:none;
      background:none;
      font-size:18px;
      cursor:pointer;
    }
    .modal-body { padding:16px; }
    .hidden { display:none; }

    /* ===== 表格 ===== */
    .admin-table {
      width:100%;
      border-collapse:collapse;
      font-size:14px;
    }
    .admin-table thead {
      position:sticky;
      top:0;
      background:#f3f5f7;
    }
    .admin-table th,
    .admin-table td {
      padding:10px 12px;
      border-bottom:1px solid #ddd;
    }
    .admin-table th { text-align:left; }
    .admin-table td.num {
      text-align:right;
      font-variant-numeric: tabular-nums;
    }
    .admin-table tbody tr:nth-child(even) { background:#fafafa; }
    .admin-table tbody tr:hover { background:#eef5ff; }

    .detail-row td {
      background:#f9f9f9;
      font-size:13px;
      color:#444;
    }
    .detail-btn {
      padding:4px 10px;
      border:1px solid #aaa;
      background:#fff;
      border-radius:4px;
      cursor:pointer;
    }

    /* ===== 權限 ===== */
    .role-admin,
    .role-chief-judge,
    .role-record-chief { display:none; }
  </style>
</head>

<body>
  <div id="header-container"></div>

  <div class="main">
    <h2>管理中心</h2>
    <p style="color:#666;margin-top:-6px">請依身份選擇可用的管理功能</p>

    <div class="section-title">📊 班表與年度統計</div>
    <div class="cards">
      <div class="card role-admin role-chief-judge" onclick="openAnnualModal('judge')">
        <h4>📈 全員裁判年度總表</h4>
        <p>裁判年度站場數與站位分佈</p>
        <div class="action">查看年度總表 →</div>
      </div>

      <div class="card role-admin role-record-chief" onclick="openAnnualModal('record')">
        <h4>📈 全員紀錄員年度總表</h4>
        <p>紀錄員年度出勤與角色分佈</p>
        <div class="action">查看年度總表 →</div>
      </div>

      <div class="card role-admin role-chief-judge"
           onclick="location.href='ction">前往安排 →</div>
      </div>

      <div class="card role-admin role-record-chief"
           onclick="location.href/p>
        <div class="action">前往安排 →</div>
      </div>
    </div>

    <div class="section-title">⚙️ 系統管理</div>
    <div class="cards">
      <div class="card role-admin" onclick="location    <p>管理使用者帳號、角色與狀態</p>
        <div class="action">前往管理 →</div>
      </div>

      <div class="card role-admin" onclick="location.href='增、編輯、刪除賽事與場次</p>
        <div class="action">前往管理 →</div>
      </div>
    </div>
  </div>

  <!-- ===== Modal ===== -->
  <div id="annualModal" class="modal hidden">
    <div class="modal-content">
      <div class="modal-header">
        <h3 id="annualModalTitle"></h3>
        <div class="modal-tools">
          <select id="annualYearSelect" onchange="reloadAnnualByYear()"></select>
          <button class="close-btn" onclick="closeAnnualModal()">✕</button>
        </div>
      </div>
      <div class="modal-body" id="annualModalBody">載入中…</div>
    </div>
  </div>

  <script>
    let currentAnnualType = null;

    document.addEventListener('DOMContentLoaded', () => {
      guardAdminPage();

      const session = getSession();
      const roles = getRoles(session);

      fetch('header.html')
        .then(r => r.text())
        .then(html => {
          document.getElementById('header-container').innerHTML = html;
          initHeaderVisibility();
        });

      if (roles.includes('admin'))
        document.querySelectorAll('.role-admin').forEach(e => e.style.display='block');
      if (roles.includes('chief_judge'))
        document.querySelectorAll('.role-chief-judge').forEach(e => e.style.display='block');
      if (roles.includes('record_chief'))
        document.querySelectorAll('.role-record-chief').forEach(e => e.style.display='block');
    });

    function openAnnualModal(type){
      currentAnnualType = type;
      const titleMap = {
        judge:'全員裁判年度總表',
        record:'全員紀錄員年度總表'
      };
      document.getElementById('annualModalTitle').textContent = titleMap[type];
      document.getElementById('annualModalBody').textContent = '載入中…';
      document.getElementById('annualModal').classList.remove('hidden');

      const year = new Date().getFullYear();
      buildYearSelect(year);
      loadAnnualData(type, year);
    }

    function closeAnnualModal(){
      document.getElementById('annualModal').classList.add('hidden');
    }

    function buildYearSelect(selectedYear) {
      callApi({ action: 'getAvailableGameYears' }, res => {
        if (res.result !== 'ok') return;
    
        const sel = document.getElementById('annualYearSelect');
        sel.innerHTML = '';
    
        res.years.forEach(y => {
          const opt = document.createElement('option');
          opt.value = y;
          opt.textContent = y + ' 年';
          if (String(y) === String(selectedYear)) opt.selected = true;
          sel.appendChild(opt);
        });
      });
    }

    function reloadAnnualByYear(){
      loadAnnualData(
        currentAnnualType,
        document.getElementById('annualYearSelect').value
      );
    }

    function loadAnnualData(type, year){
      const actionMap = {
        judge:'getJudgeAnnualSummary_',
        record:'getRecordAnnualSummary_'
      };
      callApi({ action:actionMap[type], year }, res => {
        if(res.result!=='ok'){
          document.getElementById('annualModalBody').textContent = res.message;
          return;
        }
        renderAnnualTable(res.list, type);
      });
    }

    function renderAnnualTable(list, type){
      const rows = list.map(u => {
        // ✅ 先把明細文字算好（不要塞在模板裡）
        let detailText = '';
        if (type === 'judge') {
          detailText = Object.entries(u.positions || {})
            .map(([k,v]) => `${k}：${v}`)
            .join(' ｜ ');
        } else {
          detailText = Object.entries(u.roles || {})
            .map(([k,v]) => `${k}：${v}`)
            .join(' ｜ ');
        }
    
        return `
          <tr>
            <td>${u.name}</td>
            <td class="num">${u.annual}</td>
            <td class="num">${u.career}</td>
            <td>
              <button class="detail-btn"
                onclick="toggleDetail('${u.user_id}')">詳細</button>
            </td>
          </tr>
          <tr id="detail-${u.user_id}" class="detail-row hidden">
            <td colspan="4">${detailText}</td>
          </tr>
        `;
      }).join('');
    
      document.getElementById('annualModalBody').innerHTML = `
        <table class="admin-table">
          <thead>
            <tr>
              <th>姓名</th>
              <th>年度</th>
              <th>生涯</th>
              <th>明細</th>
            </tr>
          </thead>
          <tbody>${rows}</tbody>
        </table>
      `;
    }

    function toggleDetail(uid){
      document.getElementById('detail-'+uid).classList.toggle('hidden');
    }
  </script>
</body>
</html>
