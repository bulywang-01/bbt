<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>管理中心</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- ✅ 完整保留你原本的 JS 載入（這裡是關鍵） -->
  <script src="js/auth.js"></script>
  <script src="js/config.js"></script>

  <style>
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f5f6f8;
    }

    .main {
      max-width: 1100px;
      margin: 0 auto;
      padding: 20px;
    }

    h2 {
      margin-top: 0;
      font-size: 24px;
    }

    .section-title {
      margin: 32px 0 12px;
      font-size: 20px;
      font-weight: 900;
    }

    /* ===== Grid：2～3 格一列 ===== */
    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 18px;
    }

    /* ===== Tile（header 風格） ===== */
    .card {
      background: #ffffff;
      border-radius: 14px;
      min-height: 90px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      font-size: 18px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(0,0,0,.08);
      transition: transform .15s ease, box-shadow .15s ease;
    }

    .card:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 18px rgba(0,0,0,.14);
    }

    /* ✅ 權限顯示（完全沿用你原邏輯） */
    .role-admin,
    .role-chief-judge,
    .role-record-chief {
      display: none;
    }
  </style>
</head>

<body>
  <!-- ✅ header 由你原本 JS 載入 -->
  <div id="header-container"></div>

  <div class="main">
    <h2>管理中心</h2>
    <p style="color:#666;margin-top:-6px">請依身份選擇可用的管理功能</p>

    <!-- ===== 班表與年度統計 ===== -->
    <div class="section-title">📊 班表與年度統計</div>
    <div class="cards">

      <div class="card role-admin role-chief-judge"
           onclick="openAnnualModal('judge')">
        📈 全員裁判年度總表
      </div>

      <div class="card role-admin role-record-chief"
           onclick="openAnnualModal('record')">
        📝 全員紀錄員年度總表
      </div>

      <div class="card role-admin role-chief-judge"
           onclick="location.href='judge_dashboard_admin.html'location.href='record_dashboard_admin   <div class="section-title">⚙️ 系統管理</div>
    <div class="cards">

      <div class="card role-admin"
           onclick="location.href='"card role-admin"
           onclick
    </div>
  </div>

  <!-- ✅ 完整保留你原本的 JS 行為 -->
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      guardAdminPage();

      const session = getSession();
      const roles = getRoles(session);

      fetch('header.html')
        .then(res => res.text())
        .then(html => {
          document.getElementById('header-container').innerHTML = html;
          initHeaderVisibility();
        });

      if (roles.includes('admin')) {
        document.querySelectorAll('.role-admin')
          .forEach(el => el.style.display = 'flex');
      }
      if (roles.includes('chief_judge')) {
        document.querySelectorAll('.role-chief-judge')
          .forEach(el => el.style.display = 'flex');
      }
      if (roles.includes('record_chief')) {
        document.querySelectorAll('.role-record-chief')
          .forEach(el => el.style.display = 'flex');
      }
    });
  </script>
</body>
</html>
