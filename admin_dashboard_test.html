<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>管理中心</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- ✅ 一定要先載入 auth.js（給 header & 本頁使用） -->
  <script src="js/auth.js"></script>

  <style>
    body {
      margin: 0;
      font-family: system-ui, -apple-system;
      background: #f5f6f8;
    }

    .main {
      max-width: 1100px;
      margin: 0 auto;
      padding: 20px;
    }

    .section-title {
      margin: 24px 0 8px;
      font-size: 18px;
      font-weight: 800;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 16px;
    }

    .card {
      background: #ffffff;
      border-radius: 10px;
      padding: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,.08);
    }

    .card h4 {
      margin: 0 0 8px;
    }

    .card p {
      margin: 4px 0;
      color: #555;
      font-size: 14px;
    }

    .card a {
      color: #0066cc;
      font-weight: 600;
      text-decoration: none;
    }

    .card a:hover {
      text-decoration: underline;
    }

    /* ✅ 預設全部隱藏，由 JS 決定顯示 */
    .role-admin { display: none; }
    .role-chief-judge { display: none; }
    .role-record-chief { display: none; }

    .modal{
      position:fixed; inset:0;
      background:rgba(0,0,0,.4);
      display:flex; justify-content:center; align-items:center;
      z-index:999;
    }
    .modal-content{
      background:#fff;
      width:90%;
      max-width:960px;        /* ✅ 不超過視窗 */
      max-height:90vh;
      overflow-y:auto;        /* ✅ 可上下拉 */
      border-radius:8px;
    }
    .hidden{display:none;}
  </style>
</head>

<body>

  <!-- ✅ 共用 Header 容器 -->
  <div id="header-container"></div>

  <!-- ===== 主內容 ===== -->
  <div class="main">
    <h2>管理中心</h2>
    <p style="color:#666;margin-top:-6px">請依身份選擇可用的管理功能</p>

    <!-- ===== 班表與年度統計 ===== -->
    <div class="section-title">📊 班表與年度統計</div>
    <div class="cards">

      <div class="card role-admin role-chief-judge">
        <h4>📈 裁判員年度統計</h4>
        <p>裁判員年度站場數、站位分佈與月份趨勢。</p>
        <p><a href="#">個別裁判員 →</a></p>
        <a href="#" onclick="openAnnualModal('judge')">裁判員年度總表 →</a>
      </div>

      <div class="card role-admin role-record-chief">
        <h4>📈 紀錄員年度統計</h4>
        <p>紀錄員年度出席數與角色分佈。</p>
        <p><a href="record_annual_dashboard.html">個別紀錄員 →</a></p>
        <a href="#" onclick="openAnnualModal('record')">紀錄員年度總表 →</a>
      </div>

      <div class="card role-admin role-chief-judge">
        <h4>📊 裁判員班表安排</h4>
        <p>由裁判長進行場次與站位指派。</p>
        <p><a href="judge_dashboard_admin.html">前往安排 →</a></p>
      </div>

      <div class="card role-admin role-record-chief">
        <h4>📊 紀錄員班表安排</h4>
        <p>由紀錄長指派紀錄相關人員。</p>
        <p><a href="record_dashboard_admin.html">前往安排 →</a></p>
      </div>
    </div>

    <div id="annualModal" class="modal hidden">
      <div class="modal-content">
        <div class="modal-header">
          <h3 id="annualModalTitle"></h3>
          <button onclick="closeAnnualModal()">✕</button>
        </div>
        <div class="modal-body" id="annualModalBody">
          載入中…
        </div>
      </div>
    </div>

    <!-- ===== 系統管理 ===== -->
    <div class="section-title">⚙️ 系統管理</div>
    <div class="cards">

      <div class="card role-admin">
        <h4>👤 帳號管理</h4>
        <p>管理使用者帳號、角色與狀態。</p>
        <p><a href="admin_users.html">前往管理 →</a></p>
      </div>

      <div class="card role-admin">
        <h4>⚾ 賽事管理</h4>
        <p>新增、編輯、刪除賽事與場次。</p>
        <p><a href="admin_games.html">前往管理 →</a></p>
      </div>

    </div>
  </div>

  <!-- ===== Page Logic ===== -->
  <script>
    document.addEventListener('DOMContentLoaded', function () {

      /* ✅ 1. 頁面門禁（只有 admin / 裁判長 / 紀錄長能進） */
      guardAdminPage();

      const session = getSession();
      const roles = getRoles(session);

      /* ✅ 2. 載入共用 header（不在這裡操作 header 內部 DOM） */
      fetch('header.html')
        .then(function (res) {
          return res.text();
        })
        .then(function (html) {
          document.getElementById('header-container').innerHTML = html;

          /* ✅ 3. header 顯示初始化（關鍵） */
          initHeaderVisibility();
        });

      /* ✅ 4. 僅處理「管理頁卡片」顯示 */
      if (roles.includes('admin')) {
        document.querySelectorAll('.role-admin')
          .forEach(function (el) { el.style.display = 'block'; });
      }

      if (roles.includes('chief_judge')) {
        document.querySelectorAll('.role-chief-judge')
          .forEach(function (el) { el.style.display = 'block'; });
      }

      if (roles.includes('record_chief')) {
        document.querySelectorAll('.role-record-chief')
          .forEach(function (el) { el.style.display = 'block'; });
      }
    });

  // 開啟 / 關閉
  function openAnnualModal(type){
    const map={
      judge:{ title:'全員裁判年度總表', action:'getJudgeAnnualSummary_' },
      record:{ title:'全員紀錄員年度總表', action:'getRecordAnnualSummary_' }
    };
  
    document.getElementById('annualModalTitle').textContent = map[type].title;
    document.getElementById('annualModalBody').innerHTML='載入中…';
    document.getElementById('annualModal').classList.remove('hidden');
  
    callApi({
      action:map[type].action,
      year:new Date().getFullYear()
    }, res=>{
      if(res.result!=='ok'){
        document.getElementById('annualModalBody').textContent=res.message;
        return;
      }
      renderAnnualTable(res.list,type);
    });
  }
  
  function closeAnnualModal(){
    document.getElementById('annualModal').classList.add('hidden');
  }

  // 年度表 + ✅ 展開角色明細
  function renderAnnualTable(list,type){
    const rows=list.map(u=>`
      <tr>
        <td>${u.name}</td>
        <td>${u.annual}</td>
        <td>${u.career}</td>
        <td>
          <button onclick="toggleDetail('${u.user_id}')">明細</button>
        </td>
      </tr>
      <tr id="d-${u.user_id}" class="hidden detail-row">
        <td colspan="4">
          ${u.positions 
            ? Object.entries(u.positions).map(([k,v])=>`${k}:${v}`).join('｜')
            : Object.entries(u.roles).map(([k,v])=>`${k}:${v}`).join('｜')}
        </td>
      </tr>
    `).join('');
  
    document.getElementById('annualModalBody').innerHTML=`
      <table class="annual-table">
        <thead>
          <tr>
            <th>姓名</th>
            <th>年度</th>
            <th>生涯</th>
            <th>細節</th>
          </tr>
        </thead>
        <tbody>${rows}</tbody>
      </table>
    `;
  }
  
  function toggleDetail(uid){
    document.getElementById('d-'+uid).classList.toggle('hidden');
  }
  </script>

</body>
</html>
