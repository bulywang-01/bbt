<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />

  <title>裁判組與紀錄組名單 | BBT軟式棒球聯盟</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="js/config.js"></script>
  <style>
    :root {
      --navy-dark: #0f2342;
      --navy-mid: #162f56;
      --crimson: #d92638;
      --crimson-dark: #b51c2c;
    }
    body {
      background-color: #f3f6fa;
      color: #1e293b;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
    }
    .hero-bg {
      background: linear-gradient(135deg, var(--navy-dark) 0%, var(--navy-mid) 65%, #1d3e6e 100%);
    }
    .roster-card {
      transition: transform 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease;
    }
    .roster-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 24px -8px rgba(15, 35, 66, 0.14);
      border-color: #cbd5e1;
    }
    .photo-trigger:hover .photo-zoom-hint {
      opacity: 1;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col">

  <!-- 篩選與搜尋列 -->

          <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-4.35-4.35m0 0A7.5 7.5 0 104.5 4.5a7.5 7.5 0 0012.15 12.15z" />

      <div class="bg-white rounded-2xl border border-slate-200 p-4 h-28 animate-pulse"></div>
      <div class="bg-white rounded-2xl border border-slate-200 p-4 h-28 animate-pulse"></div>
      <div class="bg-white rounded-2xl border border-slate-200 p-4 h-28 animate-pulse"></div>
      <div class="bg-white rounded-2xl border border-slate-200 p-4 h-28 animate-pulse"></div>
      <div class="bg-white rounded-2xl border border-slate-200 p-4 h-28 animate-pulse"></div>
    </div>

    <!-- 錯誤 / 空資料狀態 -->
    <div id="messageState" class="hidden bg-white rounded-2xl border border-slate-200 p-8 text-center">
      <p id="messageTitle" class="text-base font-bold text-[#0f2342] mb-1.5"></p>

        type="button"

        重新載入

    <!-- 裁判組區塊 -->
    <section id="judgeSection" class="hidden">

          <h2 class="text-xl sm:text-2xl font-extrabold text-[#0f2342] tracking-tight">紀錄組</h2>
          <span id="recordBadgeCount" class="ml-1 px-2.5 py-0.5 rounded-full text-xs font-bold bg-[#162f56]/10 text-[#162f56]">0 人</span>

          <span id="guestBadgeCount" class="ml-1 px-2.5 py-0.5 rounded-full text-xs font-bold bg-[#d92638]/10 text-[#d92638]">0 人</span>

  <!-- 照片放大檢視燈箱 -->

          class="hidden w-full aspect-[3/4] max-h-[60vh] bg-gradient-to-br from-[#0f2342] to-[#1e3f73] text-white font-black text-6xl flex items-center justify-center"
        ></div>
      </div>

      <div class="p-4 sm:p-5 bg-white">
        <div class="flex items-center justify-between gap-2">
          <h3 id="lightboxName" class="text-lg sm:text-xl font-extrabold text-[#0f2342]"></h3>
          <span id="lightboxJersey" class="hidden px-2.5 py-1 rounded-md text-xs font-extrabold bg-[#0f2342] text-white"></span>
        </div>
        <div id="lightboxRoleTags" class="flex flex-wrap gap-1.5 mt-2"></div>
        <div id="lightboxBadges" class="flex flex-wrap gap-1.5 mt-2.5"></div>
      </div>
    </div>
  </div>

  <!-- 頁尾 -->
  <footer class="bg-[#0f2342] text-slate-300 border-t border-white/10 mt-10">
    <div class="max-w-6xl mx-auto px-4 sm:px-6 py-6 flex flex-col sm:flex-row items-center justify-between gap-4 text-xs sm:text-sm">
      <div>
        <span class="font-bold text-white">BBT軟式棒球聯盟</span> · 裁判組與紀錄組官方名冊
      </div>
      <a
        href="https://bbtls.com/"
        class="inline-flex items-center gap-1.5 px-4 py-2 rounded-lg font-semibold bg-[#d92638] hover:bg-[#b51c2c] text-white transition"
      >
        <span>回 BBT 首頁</span>
        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M13 7l5 5m0 0l-5 5m5-5H6" />
        </svg>
      </a>
    </div>
  </footer>

  <script>
    let allStaff = [];
    let activeTab = 'all';
    const cardRegistry = new Map();

    // 轉換 Google Drive 分享連結為縮圖直連網址
    function toDirectPhotoUrl(rawUrl, size = 600) {
      const url = String(rawUrl || '').trim();
      if (!url) return '';

      const dMatch = url.match(/\/d\/([a-zA-Z0-9_-]+)/);
      if (dMatch && dMatch[1]) {
        return `https://drive.google.com/thumbnail?id=${dMatch[1]}&sz=w${size}`;
      }

      const idMatch = url.match(/[?&]id=([a-zA-Z0-9_-]+)/);
      if (idMatch && idMatch[1]) {
        return `https://drive.google.com/thumbnail?id=${idMatch[1]}&sz=w${size}`;
      }

      return url;
    }

    // 判斷是否為特聘人員（名稱含 (聘) 或 （聘））
    function isGuestStaff(name) {
      return /[\(（]\s*聘\s*[\)）]/.test(String(name || ''));
    }

    // 顯示名稱：移除 (聘) / （聘）括弧，只留名字
    function getDisplayName(name) {
      return String(name || '')
        .replace(/[\(（]\s*聘\s*[\)）]/g, '')
        .trim();
    }

    // 判斷是否為應排除的帳號（bbt990 ～ bbt999）
    function isExcludedUsername(person) {
      const candidates = [
        person.username,
        person.account,
        person.user_name
      ];
      for (const raw of candidates) {
        const val = String(raw || '').trim().toLowerCase();
        const m = val.match(/^bbt(\d+)$/);
        if (m) {
          const num = parseInt(m[1], 10);
          if (num >= 990 && num <= 999) {
            return true;
          }
        }
      }
      return false;
    }

    // 解析 role 欄位
    function parseRoles(roleStr) {
      const tokens = String(roleStr || '')
        .toLowerCase()
        .split(/[,，\s]+/)
        .map(s => s.trim())
        .filter(Boolean);

      const isChiefJudge = tokens.includes('chief_judge');
      const isJudge = tokens.includes('judge') || isChiefJudge;
      const isRecordChief = tokens.includes('record_chief');
      const isRecord = tokens.includes('record') || isRecordChief;

      return { isJudge, isChiefJudge, isRecord, isRecordChief };
    }

    // 解析 level 欄位（格式預期為「裁判證,紀錄證」，例如 'C,N'、'A,B'、'N,N'）
    function parseLevels(levelStr) {
      const parts = String(levelStr || '')
        .split(/[,，]/)
        .map(s => s.trim().toUpperCase());

      const rawReferee = parts[0] || '';
      const rawScorer = parts[1] || '';

      const validGrades = ['A', 'B', 'C'];
      const refereeLevel = validGrades.includes(rawReferee) ? rawReferee : '';
      const scorerLevel = validGrades.includes(rawScorer) ? rawScorer : '';

      return { refereeLevel, scorerLevel };
    }

    // 證照徽章樣式
    function getLevelBadgeClass(grade) {
      switch (grade) {
        case 'A':
          return 'bg-rose-50 text-[#d92638] border-rose-200';
        case 'B':
          return 'bg-blue-50 text-[#0f2342] border-blue-200';
        case 'C':
          return 'bg-slate-100 text-slate-700 border-slate-200';
        default:
          return 'bg-slate-50 text-slate-600 border-slate-200';
      }
    }

    function escapeHtml(str) {
      return String(str ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function setActiveTab(tab) {
      activeTab = tab;
      document.querySelectorAll('.tab-btn').forEach(btn => {
        const isCurrent = btn.dataset.tab === tab;
        btn.className = isCurrent
          ? 'tab-btn px-3.5 py-2 rounded-lg text-xs sm:text-sm font-semibold transition cursor-pointer bg-[#0f2342] text-white shadow-xs'
          : 'tab-btn px-3.5 py-2 rounded-lg text-xs sm:text-sm font-semibold transition cursor-pointer text-slate-600 hover:text-[#0f2342]';
      });
      renderAll();
    }

    function updateSyncStatus(state, text, timeStr = '') {
      const statusEl = document.getElementById('syncStatusText');
      const timeEl = document.getElementById('lastSyncedTime');

      let dotClass = 'bg-emerald-500';
      if (state === 'loading') dotClass = 'bg-amber-400 animate-pulse';
      if (state === 'error') dotClass = 'bg-[#d92638]';

      statusEl.innerHTML = `<span class="inline-block w-2 h-2 rounded-full ${dotClass}"></span><span>${escapeHtml(text)}</span>`;
      if (timeStr) {
        timeEl.textContent = `更新時間：${timeStr}`;
      }
    }

    // 透過 config.js 的 callApi 從後端 Users 讀取公開名冊
    function fetchStaffFromBackend() {
      const loadingEl = document.getElementById('loadingState');
      const messageEl = document.getElementById('messageState');
      const judgeSec = document.getElementById('judgeSection');
      const recordSec = document.getElementById('recordSection');
      const guestSec = document.getElementById('guestSection');

      loadingEl.classList.remove('hidden');
      messageEl.classList.add('hidden');
      judgeSec.classList.add('hidden');
      recordSec.classList.add('hidden');
      guestSec.classList.add('hidden');

      updateSyncStatus('loading', '正在從後端 Users 讀取名單...');

      if (typeof callApi !== 'function') {
        loadingEl.classList.add('hidden');
        updateSyncStatus('error', '找不到 config.js 的 callApi 函式');
        showMessage('無法初始化 API 連線', '請確認 config.js 已正確載入且包含 callApi 函式。');
        return;
      }

      callApi({ action: 'getPublicStaffList' }, function (res) {
        loadingEl.classList.add('hidden');

        if (!res || res.result === 'error' || !Array.isArray(res.staff)) {
          const errMsg = (res && res.message) ? res.message : '後端未回傳有效名單或連線逾時';
          updateSyncStatus('error', `同步失敗：${errMsg}`);
          showMessage('無法讀取後端 Users 名單', `${errMsg}。請確認 GAS 已部署新版本並開放公開讀取。`);
          return;
        }

        allStaff = res.staff.filter(item => {
          const rawName = String(item.name || '').trim();
          const role = String(item.role || '').trim().toLowerCase();
          if (!rawName) return false;
          if (role === 'admin') return false;
          if (isExcludedUsername(item)) return false;
          const roles = parseRoles(role);
          return roles.isJudge || roles.isRecord;
        });

        const nowStr = new Date().toLocaleTimeString('zh-Hant', {
          hour: '2-digit',
          minute: '2-digit',
          second: '2-digit'
        });
        updateSyncStatus('ok', `已同步後端 Users（共 ${allStaff.length} 位人員）`, nowStr);

        renderAll();
      });
    }

    function showMessage(title, desc) {
      document.getElementById('messageTitle').textContent = title;
      document.getElementById('messageDesc').textContent = desc;
      document.getElementById('messageState').classList.remove('hidden');
    }

    // 第 2 行：職務標籤（特聘裁判名單不顯示額外職務標籤，維持固定空行對齊）
    function getRoleTags(person, groupType) {
      if (groupType === 'guest') return [];
      const roles = parseRoles(person.role);
      const tags = [];
      if (groupType === 'judge') {
        if (roles.isChiefJudge) tags.push('裁判長');
        if (roles.isRecord) tags.push('兼紀錄組');
      } else if (groupType === 'record') {
        if (roles.isRecordChief) tags.push('紀錄組長');
        if (roles.isJudge) tags.push('兼裁判組');
      }
      return tags;
    }

    // 第 3 行：證照標籤（無證照或為 N 則不回傳，保留固定空行對齊）
    function getCertificateItems(person) {
      const levels = parseLevels(person.level);
      const items = [];
      if (levels.refereeLevel) {
        items.push({ label: `裁判 ${levels.refereeLevel} 級`, grade: levels.refereeLevel });
      }
      if (levels.scorerLevel) {
        items.push({ label: `紀錄 ${levels.scorerLevel} 級`, grade: levels.scorerLevel });
      }
      return items;
    }

    // 渲染每行固定對齊的橫向卡片（groupType: 'judge' | 'record' | 'guest'）
    function buildPersonCard(person, groupType, index) {
      const cardKey = `${groupType}_${index}_${String(person.user_id || person.name)}`;
      cardRegistry.set(cardKey, { person, groupType });

      const displayName = getDisplayName(person.name);
      const jerseyNo = String(person.note ?? '').trim();
      const thumbUrl = toDirectPhotoUrl(person.photo_url, 600);
      const initialChar = escapeHtml(displayName.charAt(0) || '?');
      const roleTags = getRoleTags(person, groupType);
      const certItems = getCertificateItems(person);

      const roleRowHtml = roleTags.length > 0
        ? roleTags.map(tag =>
            `<span class="inline-flex items-center px-2 py-0.5 rounded-md text-[11px] font-semibold bg-[#0f2342]/8 text-[#0f2342] leading-4">${escapeHtml(tag)}</span>`
          ).join('')
        : `<span class="inline-block h-5"></span>`;

      const certRowHtml = certItems.length > 0
        ? certItems.map(item =>
            `<span class="inline-flex items-center px-2 py-0.5 rounded-md text-xs font-bold border leading-4 ${getLevelBadgeClass(item.grade)}">${escapeHtml(item.label)}</span>`
          ).join('')
        : `<span class="inline-block h-5"></span>`;

      const jerseyHtml = jerseyNo
        ? `<span class="inline-flex items-center px-2 py-0.5 rounded-md text-xs font-extrabold tracking-wide bg-[#0f2342] text-white shrink-0">#${escapeHtml(jerseyNo)}</span>`
        : '';

      const avatarHtml = thumbUrl
        ? `<img
             src="${escapeHtml(thumbUrl)}"
             alt="${escapeHtml(displayName)}"
             loading="lazy"
             onerror="this.classList.add('hidden'); this.nextElementSibling.classList.remove('hidden');"
             class="w-16 h-20 rounded-xl object-cover object-top border border-slate-200 bg-slate-100"
           />
           <div class="hidden w-16 h-20 rounded-xl bg-[#0f2342] text-white font-extrabold text-xl flex items-center justify-center select-none">
             ${initialChar}
           </div>`
        : `<div class="w-16 h-20 rounded-xl bg-[#0f2342] text-white font-extrabold text-xl flex items-center justify-center select-none">
             ${initialChar}
           </div>`;

      return `
        <article class="roster-card group bg-white rounded-2xl border border-slate-200/90 p-4 flex items-center gap-4">
          <button
            type="button"
            onclick="openPhotoLightbox('${escapeHtml(cardKey)}')"
            class="photo-trigger relative w-16 h-20 rounded-xl overflow-hidden shrink-0 cursor-pointer focus:outline-none focus:ring-2 focus:ring-[#0f2342]"
            title="點擊放大檢視 ${escapeHtml(displayName)}"
          >
            ${avatarHtml}
            <div class="photo-zoom-hint opacity-0 transition-opacity duration-150 absolute inset-x-0 bottom-0 bg-slate-950/75 text-white text-[10px] font-medium text-center py-0.5">
              放大
            </div>
          </button>

          <div class="min-w-0 flex-1 flex flex-col justify-between gap-1.5">
            <!-- 第 1 行：姓名 + 背號 -->
            <div class="flex items-center justify-between gap-2 min-h-[24px]">
              <h3 class="font-bold text-base text-[#0f2342] truncate leading-6">${escapeHtml(displayName)}</h3>
              ${jerseyHtml}
            </div>

            <!-- 第 2 行：職務標籤（無則空行對齊） -->
            <div class="flex flex-wrap items-center gap-1.5 min-h-[20px]">
              ${roleRowHtml}
            </div>

            <!-- 第 3 行：證照等級（無則空行對齊） -->
            <div class="flex flex-wrap items-center gap-1.5 min-h-[20px]">
              ${certRowHtml}
            </div>
          </div>
        </article>
      `;
    }

    // 開啟燈箱放大檢視
    function openPhotoLightbox(cardKey) {
      const entry = cardRegistry.get(cardKey);
      if (!entry) return;

      const { person, groupType } = entry;
      const lightbox = document.getElementById('photoLightbox');
      const imgEl = document.getElementById('lightboxImg');
      const fallbackEl = document.getElementById('lightboxFallback');
      const nameEl = document.getElementById('lightboxName');
      const jerseyEl = document.getElementById('lightboxJersey');
      const roleTagsEl = document.getElementById('lightboxRoleTags');
      const badgesEl = document.getElementById('lightboxBadges');

      const displayName = getDisplayName(person.name);
      const hiResUrl = toDirectPhotoUrl(person.photo_url, 1200);
      const initialChar = displayName.charAt(0) || '?';
      const jerseyNo = String(person.note ?? '').trim();
      const roleTags = getRoleTags(person, groupType);
      const certItems = getCertificateItems(person);

      nameEl.textContent = displayName;

      if (jerseyNo) {
        jerseyEl.textContent = `#${jerseyNo}`;
        jerseyEl.classList.remove('hidden');
      } else {
        jerseyEl.textContent = '';
        jerseyEl.classList.add('hidden');
      }

      roleTagsEl.innerHTML = roleTags.map(tag =>
        `<span class="inline-flex items-center px-2.5 py-0.5 rounded-md text-xs font-semibold bg-[#0f2342]/10 text-[#0f2342]">${escapeHtml(tag)}</span>`
      ).join('');

      badgesEl.innerHTML = certItems.map(item =>
        `<span class="inline-flex items-center px-2.5 py-0.5 rounded-md text-xs font-bold border ${getLevelBadgeClass(item.grade)}">${escapeHtml(item.label)}</span>`
      ).join('');

      fallbackEl.textContent = initialChar;

      if (hiResUrl) {
        imgEl.onload = function () {
          imgEl.classList.remove('hidden');
          fallbackEl.classList.add('hidden');
        };
        imgEl.onerror = function () {
          imgEl.classList.add('hidden');
          fallbackEl.classList.remove('hidden');
        };
        imgEl.src = hiResUrl;
        imgEl.alt = displayName;
        imgEl.classList.remove('hidden');
        fallbackEl.classList.add('hidden');
      } else {
        imgEl.removeAttribute('src');
        imgEl.classList.add('hidden');
        fallbackEl.classList.remove('hidden');
      }

      lightbox.classList.remove('hidden');
      document.body.classList.add('overflow-hidden');
    }

    function closePhotoLightbox() {
      const lightbox = document.getElementById('photoLightbox');
      lightbox.classList.add('hidden');
      document.body.classList.remove('overflow-hidden');
    }

    function handleLightboxBackdropClick(event) {
      if (event.target && event.target.id === 'photoLightbox') {
        closePhotoLightbox();
      }
    }

    document.addEventListener('keydown', function (event) {
      if (event.key === 'Escape') {
        closePhotoLightbox();
      }
    });

    function renderAll() {
      cardRegistry.clear();

      const keyword = String(document.getElementById('searchInput').value || '').trim().toLowerCase();

      // 拆出特聘人員（名稱含 (聘) 或 （聘））與一般組別名單
      const guestAll = allStaff.filter(p => isGuestStaff(p.name));
      const regularAll = allStaff.filter(p => !isGuestStaff(p.name));

      const totalJudges = regularAll.filter(p => parseRoles(p.role).isJudge).length;
      const totalRecords = regularAll.filter(p => parseRoles(p.role).isRecord).length;
      const totalGuests = guestAll.length;

      document.getElementById('statJudgeCount').textContent = `${totalJudges} 人`;
      document.getElementById('statRecordCount').textContent = `${totalRecords} 人`;
      document.getElementById('statGuestCount').textContent = `${totalGuests} 人`;

      const matchFilter = p => {
        if (!keyword) return true;
        const displayName = getDisplayName(p.name).toLowerCase();
        const rawName = String(p.name || '').toLowerCase();
        const note = String(p.note ?? '').toLowerCase();
        return displayName.includes(keyword) || rawName.includes(keyword) || note.includes(keyword);
      };

      const filteredJudges = regularAll.filter(p => parseRoles(p.role).isJudge && matchFilter(p));
      const filteredRecords = regularAll.filter(p => parseRoles(p.role).isRecord && matchFilter(p));
      const filteredGuests = guestAll.filter(matchFilter);

      document.getElementById('judgeBadgeCount').textContent = `${filteredJudges.length} 人`;
      document.getElementById('recordBadgeCount').textContent = `${filteredRecords.length} 人`;
      document.getElementById('guestBadgeCount').textContent = `${filteredGuests.length} 人`;

      const judgeSection = document.getElementById('judgeSection');
      const recordSection = document.getElementById('recordSection');
      const guestSection = document.getElementById('guestSection');
      const messageEl = document.getElementById('messageState');

      const showJudge = activeTab === 'all' || activeTab === 'judge';
      const showRecord = activeTab === 'all' || activeTab === 'record';
      const showGuest = activeTab === 'all' || activeTab === 'guest';

      document.getElementById('judgeGrid').innerHTML = filteredJudges.map((p, idx) => buildPersonCard(p, 'judge', idx)).join('');
      document.getElementById('recordGrid').innerHTML = filteredRecords.map((p, idx) => buildPersonCard(p, 'record', idx)).join('');
      document.getElementById('guestGrid').innerHTML = filteredGuests.map((p, idx) => buildPersonCard(p, 'guest', idx)).join('');

      judgeSection.classList.toggle('hidden', !showJudge || filteredJudges.length === 0);
      recordSection.classList.toggle('hidden', !showRecord || filteredRecords.length === 0);
      guestSection.classList.toggle('hidden', !showGuest || filteredGuests.length === 0);

      const hasAnyVisible =
        (showJudge && filteredJudges.length > 0) ||
        (showRecord && filteredRecords.length > 0) ||
        (showGuest && filteredGuests.length > 0);

      if (!hasAnyVisible && allStaff.length > 0) {
        showMessage('找不到符合條件的人員', '請嘗試清除搜尋關鍵字或切換分組頁籤。');
      } else if (allStaff.length === 0) {
        showMessage('目前後端 Users 沒有可顯示的名單', '請確認 Users 工作表中 role 欄位包含 judge 或 record 且 active 為啟用狀態。');
      } else {
        messageEl.classList.add('hidden');
      }
    }

    document.addEventListener('DOMContentLoaded', fetchStaffFromBackend);
  </script>
</body>
</html>
