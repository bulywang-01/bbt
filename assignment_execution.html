<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BBT 聯盟 - 出勤確認中心</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <link rel="stylesheet" href="common.css">

  <script src="js/auth.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap');
    body { background: #eef2f7; font-family: 'Noto Sans TC', sans-serif; }
    .main { padding: 20px; max-width: 1400px; margin: auto; }

    .panel {
      background: #fff;
      padding: 18px;
      border-radius: 16px;
      box-shadow: 0 4px 12px rgba(15, 23, 42, .08);
      margin-bottom: 18px;
      border: 1px solid #e2e8f0;
    }

    /* 賽事卡片 */
    .game-card {
      background: #fff;
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 14px;
      border: 1px solid #e2e8f0;
      box-shadow: 0 2px 8px rgba(0, 0, 0, .04);
      transition: .2s;
    }
    .game-card:hover { box-shadow: 0 4px 14px rgba(0, 0, 0, .08); }
    .game-card.resumed {
      border: 2px solid #3b82f6;
      box-shadow: 0 4px 12px rgba(59, 130, 246, 0.15);
      background: #eff6ff;
    }

    .game-title {
      font-weight: 800;
      font-size: 15px;
      color: #0f172a;
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 12px;
      padding-bottom: 10px;
      border-bottom: 1px solid #f1f5f9;
    }

    .btn-complete-all {
      background: #16a34a;
      color: #fff;
      border: none;
      padding: 4px 10px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 700;
      font-size: 12px;
    }
    .btn-complete-all:hover { background: #15803d; }

    /* 人員執勤列 */
    .person-group {
      margin-bottom: 10px;
      padding: 12px;
      background: #f8fafc;
      border-radius: 12px;
      border: 1px solid #e2e8f0;
    }
    .person-group.highlight { border: 2px solid #3b82f6; background: #eff6ff; }

    .role-title { font-weight: 700; margin-bottom: 8px; color: #334155; font-size: 13px; }
    .candidate-row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
    .candidate {
      display: flex;
      align-items: center;
      gap: 4px;
      background: #fff;
      padding: 6px 10px;
      border-radius: 8px;
      border: 1px solid #cbd5e1;
    }
    .name.line-through { text-decoration: line-through; color: #94a3b8; }
    .name.replace-highlight { background: #eef2ff; border-radius: 6px; padding: 2px 6px; color: #3b82f6; font-weight: 700; }

    .actions-box { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
    .select-user {
      padding: 4px 8px;
      border-radius: 8px;
      border: 1px solid #cbd5e1;
      font-size: 13px;
      background: #fff;
      height: 30px;
    }

    .btn {
      padding: 4px 12px;
      border: none;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      color: #fff;
      cursor: pointer;
      box-shadow: 0 1px 2px rgba(0, 0, 0, .1);
      transition: .15s;
      height: 28px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .btn:hover { transform: translateY(-1px); }
    .btn-ok { background: #16a34a; }
    .btn-no { background: #dc2626; }
    .btn-late { background: #f59e0b; }
    .btn-assign { background: #3b82f6; }
    .btn-replace { background: #4f46e5; }

    .tag {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 10px;
      font-size: 12px;
      margin-left: 4px;
      font-weight: 700;
    }
    .tag-ok { background: #16a34a; color: #fff; }
    .tag-late { background: #f59e0b; color: #fff; }
    .tag-no { background: #dc2626; color: #fff; }
    .tag-replace { background: #4f46e5; color: #fff; }
    .status-mini { font-weight: 700; margin-left: 4px; }

    /* 分類頁籤 */
    .tabs { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
    .tab {
      padding: 8px 16px;
      border-radius: 12px;
      background: #e2e8f0;
      cursor: pointer;
      font-weight: 700;
      font-size: 13px;
      color: #475569;
      transition: .2s;
    }
    .tab:hover { background: #cbd5e1; }
    .tab.active { background: #2563eb; color: #fff; box-shadow: 0 4px 12px rgba(37, 99, 235, 0.25); }

    .empty { text-align: center; color: #94a3b8; padding: 40px; font-weight: 600; }

    /* 彈窗樣式 */
    .modal {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.5);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
    }
    .modal.hidden { display: none; }
    .modal-box {
      width: 90%;
      max-width: 900px;
      background: #ffffff;
      border-radius: 16px;
      padding: 20px;
      max-height: 85vh;
      overflow: auto;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
    }
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: 800;
      margin-bottom: 14px;
      font-size: 18px;
      color: #0f172a;
    }

    /* 年度統計表格 */
    .year-table { width: 100%; border-collapse: collapse; font-size: 14px; }
    .year-table th {
      text-align: left;
      padding: 10px;
      border-bottom: 2px solid #e2e8f0;
      background: #f8fafc;
      color: #334155;
      font-weight: 700;
    }
    .year-table td { padding: 10px; border-bottom: 1px solid #f1f5f9; }

    /* 個人分析卡片 */
    .stat-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 16px; }
    @media (max-width: 600px) { .stat-grid { grid-template-columns: repeat(2, 1fr); } }
    .stat-card {
      background: #fff;
      border-radius: 12px;
      padding: 14px;
      text-align: center;
      border: 1px solid #e2e8f0;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.02);
    }
    .stat-card:nth-child(1) { border-left: 4px solid #2563eb; }
    .stat-card:nth-child(2) { border-left: 4px solid #16a34a; }
    .stat-card:nth-child(3) { border-left: 4px solid #f59e0b; }
    .stat-card:nth-child(4) { border-left: 4px solid #9333ea; }
    .stat-title { font-size: 12px; color: #64748b; margin-bottom: 4px; font-weight: 700; }
    .stat-value { font-size: 22px; font-weight: 900; color: #0f172a; }
  </style>
</head>

<script>
  // 全域狀態快取
  let userList = [];
  let currentTab = 'pending';

  // 初始化頁面
  document.addEventListener('DOMContentLoaded', () => {
    if (typeof lucide !== 'undefined') lucide.createIcons();
    loadUserInfo();
    loadUsers();
  });

  // 載入側邊欄登入者資訊
  function loadUserInfo() {
    const session = (typeof getSession === 'function')
      ? getSession()
      : JSON.parse(localStorage.getItem('session_user') || '{}');

    if (session && session.name) {
      document.getElementById('sidebarUserName').textContent = session.name;
      document.getElementById('sidebarUserRole').textContent = session.role || '管理員';
      document.getElementById('sidebarAvatar').textContent = session.name.charAt(0);
    }
  }

  // 切換手機版側邊欄
  function toggleSidebar() {
    const sidebar = document.getElementById('sidebar');
    const overlay = document.getElementById('sidebar-overlay');
    sidebar.classList.toggle('-translate-x-full');
    overlay.classList.toggle('hidden');
  }

  // 安全解析日期字串為本地零點 Date
  function parseLocalDate_(dateStr) {
    if (!dateStr) return null;
    const normalized = String(dateStr).trim().replace(/-/g, '/').split('T')[0];
    const parts = normalized.split('/');
    if (parts.length === 3) {
      const y = Number(parts[0]);
      const m = Number(parts[1]) - 1;
      const d = Number(parts[2]);
      const dt = new Date(y, m, d);
      if (!isNaN(dt.getTime())) return dt;
    }
    const fallback = new Date(normalized);
    return isNaN(fallback.getTime()) ? null : new Date(fallback.getFullYear(), fallback.getMonth(), fallback.getDate());
  }

  // 讀取所有人員清單後載入出勤賽事
  function loadUsers() {
    callApi({ action: 'getUsers' }, res => {
      if (!res || res.result !== 'ok') {
        toast('讀取使用者失敗', 'error');
        return;
      }
      userList = res.users || [];
      load();
    });
  }

  // 判斷賽事是否已達可點名／可檢視狀態（今天以前且狀態為正常0、延賽1、完賽4）
  function isGameReady(g) {
    if (!g) return false;
    const gameDate = parseLocalDate_(g.date);
    if (!gameDate) return false;

    const now = new Date();
    const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    const status = Number(g.status);

    return gameDate <= today && (status === 0 || status === 1 || status === 4);
  }

  // 判斷整場人員是否皆已結案（完成或遲到）
  function isGameLocked(g) {
    return (g.list || []).length > 0 && g.list.every(p => p.status === 'completed' || p.status === 'late');
  }

  // 載入出勤指派資料
  function load() {
    const el = document.getElementById('list');
    el.innerHTML = `<div class="empty">⏳ 資料載入中...</div>`;

    callApi({ action: 'getAssignments' }, res => {
      if (!res || !res.data) {
        el.innerHTML = `<div class="empty">❌ 讀取失敗</div>`;
        return;
      }

      window._lastData = res.data;
      const readyGames = res.data.filter(isGameReady);
      render(readyGames);
    });
  }

  // 渲染分頁與對應賽事卡片
  function render(list) {
    const el = document.getElementById('list');

    const pending = list.filter(g => Number(g.status) === 0);
    const done = list.filter(g => Number(g.status) === 4);
    const hold = list.filter(g => Number(g.status) === 1);
    const resumed = list.filter(g => Number(g.from_hold) === 1);

    const tabMap = { pending, done, hold, resumed };
    const data = tabMap[currentTab] || pending;

    el.innerHTML = `
      <div class="tabs">
        <div class="tab ${currentTab === 'pending' ? 'active' : ''}" onclick="switchTab('pending')">🔴 未完成 (${pending.length})</div>
        <div class="tab ${currentTab === 'done' ? 'active' : ''}" onclick="switchTab('done')">✅ 已完成 (${done.length})</div>
        <div class="tab ${currentTab === 'hold' ? 'active' : ''}" onclick="switchTab('hold')">⚠️ 延賽 (${hold.length})</div>
        <div class="tab ${currentTab === 'resumed' ? 'active' : ''}" onclick="switchTab('resumed')">🔄 補賽 (${resumed.length})</div>
      </div>
      ${data.length ? data.map(renderGame).join('') : '<div class="empty">目前沒有此分類的出勤資料</div>'}
    `;
  }

  // 切換出勤狀態分頁
  function switchTab(t) {
    currentTab = t;
    load();
  }

  // 渲染單場賽事卡片
  function renderGame(g) {
    const statusNum = Number(g.status || 0);
    const isResumed = Number(g.from_hold || 0) === 1;
    const info = getTournamentInfo(g.tournament_type || 'default');

    let statusHTML = '';
    if (statusNum === 1) {
      statusHTML = `
        <span style="margin-left:10px;color:#f59e0b;font-weight:700;">⚠️ 延賽</span>
        <button class="btn" style="margin-left:8px;background:#2563eb;" onclick="reopenGame('${g.game_id}')">🔄 補賽</button>
      `;
    } else if (statusNum === 2) {
      statusHTML = `<span style="margin-left:10px;color:#6b7280;font-weight:700;">⛔ 停賽</span>`;
    } else if (statusNum === 4) {
      statusHTML = isResumed
        ? `<span style="margin-left:10px;color:#2563eb;font-weight:700;">🔄 補賽完成</span>`
        : `<span style="margin-left:10px;color:#16a34a;font-weight:700;">✅ 已完成</span>`;
    } else {
      if (isResumed) {
        statusHTML += `<span style="margin-left:10px;color:#2563eb;font-weight:700;">🔄 補賽中</span>`;
      }
      if (!isGameLocked(g)) {
        statusHTML += `
          <button class="btn-complete-all" onclick="completeGame('${g.game_id}')">✅ 整場完成</button>
          <button class="btn" style="margin-left:8px;background:#f59e0b;" onclick="setGameHold('${g.game_id}')">⚠️ 延賽</button>
        `;
      } else {
        statusHTML += `<span style="margin-left:10px;color:#16a34a;font-weight:700;">✅ 已完成</span>`;
      }
    }

    const cardClass = isResumed ? 'game-card resumed' : 'game-card';

    return `
      <div class="${cardClass}" data-game-id="${g.game_id}">
        <div class="game-title">
          <span>📅 ${g.date} ｜ ${g.game_code || ''} ｜ ${g.field || ''}</span>
          <span>｜ <span style="color:${info.color || '#2563eb'};font-weight:700;">${info.text || '聯盟賽事'}</span></span>
          ${statusHTML}
        </div>
        ${renderGroup(g)}
      </div>
    `;
  }

  // 將單場出勤名單依角色分組渲染
  function renderGroup(g) {
    const list = g.list || [];
    const roleMap = {};

    list.forEach(p => {
      if (!p.role || p.role === 'undefined') return;
      if (!roleMap[p.role]) roleMap[p.role] = [];
      roleMap[p.role].push(p);
    });

    return Object.keys(roleMap)
      .map(role => renderRoleRow(role, roleMap[role], g))
      .join('');
  }

  // 渲染單一執勤角色列（含狀態標籤、支援人員、改派／支援／點名按鈕）
  function renderRoleRow(role, rows, g) {
    rows.sort((a, b) => new Date(a.create_at || 0) - new Date(b.create_at || 0));

    const hasNoShow = rows.some(x => x.status === 'no_show');
    const firstAssign = rows.find(x => x.assignment_id);
    const original = rows.find(x => Number(x.is_replacement) !== 1);
    const replacement = rows.find(x => Number(x.is_replacement) === 1);

    function renderTag(p) {
      if (!p) return '';
      const statusTag = p.status === 'completed' ? '<span class="tag tag-ok">完</span>'
        : p.status === 'late' ? '<span class="tag tag-late">遲</span>'
        : p.status === 'no_show' ? '<span class="tag tag-no">缺</span>'
        : (p.status === 'scheduled' && p.name) ? '<span class="status-mini" style="color:#888;">待</span>' : '';

      const replaceTag = Number(p.is_replacement) === 1 ? '<span class="tag tag-replace">支</span>' : '';
      const extraClass = `${p.status === 'no_show' ? 'line-through' : ''} ${Number(p.is_replacement) === 1 ? 'replace-highlight' : ''}`;

      return `<span class="name ${extraClass}">${p.name || '（未確認）'} ${statusTag}${replaceTag}</span>`;
    }

    const candidateHTML = replacement
      ? `<div class="candidate">${renderTag(original)}<span style="margin:0 6px;">／</span>${renderTag(replacement)}</div>`
      : rows.map(p => `<div class="candidate">${renderTag(p)}</div>`).join('');

    const selectableUsers = userList.filter(u => {
      const roles = String(u.role || '');
      if (roles.includes('admin')) return false;
      if (role.startsWith('REC')) return roles.includes('record') || roles.includes('record_chief');
      return roles.includes('judge') || roles.includes('chief_judge');
    });

    return `
      <div class="person-group ${role === 'PU' ? 'highlight' : ''}">
        <div class="role-title">${getRoleText(role)}</div>
        <div class="candidate-row">${candidateHTML}</div>
        <div class="actions-box">
          <button class="btn btn-ok" onclick="handleAutoDecision('${g.game_id}','${role}','completed')">完成</button>
          <button class="btn btn-late" onclick="handleAutoDecision('${g.game_id}','${role}','late')">遲到</button>
          <button class="btn btn-no" onclick="handleAutoDecision('${g.game_id}','${role}','no_show')">缺席</button>
          ${(!hasNoShow && firstAssign) ? `<button class="btn btn-assign" onclick="quickAssign('${firstAssign.assignment_id}', this)">改派</button>` : ''}
          ${hasNoShow ? `<button class="btn btn-replace" onclick="quickReplace('${g.game_id}','${role}', this)">+ 支援</button>` : ''}
          <select class="select-user">
            <option value="">選擇人員</option>
            ${selectableUsers.map(u => `<option value="${u.user_id}">${u.name || u.username}</option>`).join('')}
          </select>
        </div>
      </div>
    `;
  }

  // 自動鎖定目前主要執勤人員（若有支援人員優先操作支援人員）更新狀態
  function handleAutoDecision(gameId, role, status) {
    const g = (window._lastData || []).find(x => String(x.game_id) === String(gameId));
    if (!g) {
      toast('找不到賽事', 'error');
      return;
    }

    const list = (g.list || []).filter(x => x.role === role);
    const replacement = list.find(x => Number(x.is_replacement) === 1);
    const target = replacement || list.find(x => Number(x.is_replacement) !== 1 && x.assignment_id);

    if (!target || !target.assignment_id) {
      toast('找不到可操作人員', 'error');
      return;
    }
    updateStatus(target.assignment_id, status);
  }

  // 更新單筆出勤紀錄狀態
  function updateStatus(id, status) {
    const textMap = { completed: '完成', no_show: '缺席', late: '遲到', scheduled: '重置' };
    toast('更新狀態中...', 'loading');

    callApi({
      action: 'updateAssignment',
      assignment_id: id,
      status: status
    }, res => {
      if (res && res.result === 'ok') {
        toast(`✅ 已標記：${textMap[status] || status}`);
        load();
      } else {
        toast(res?.message || '更新失敗', 'error');
      }
    });
  }

  // 快速改派該角色人員
  function quickAssign(id, btn) {
    const group = btn.closest('.person-group');
    const uid = group?.querySelector('.select-user')?.value;
    if (!uid) {
      toast('請先選人', 'warn');
      return;
    }

    const gameId = btn.closest('.game-card')?.dataset.gameId;
    const g = (window._lastData || []).find(x => String(x.game_id) === String(gameId));
    const p = (g?.list || []).find(x => String(x.assignment_id) === String(id));
    if (!p) {
      toast('找不到人員資料', 'error');
      return;
    }

    const params = !String(p.role).startsWith('REC')
      ? { action: 'assignJudgeToPosition_admin', game_id: gameId, role: p.role, judge_id: uid }
      : { action: 'assignRecord_admin', game_id: gameId, record_role: p.role, user_id: uid };

    callApi(params, res => {
      if (!res || res.result !== 'ok') {
        toast(res?.message || '❌ 改派失敗', 'error');
        return;
      }
      toast('✅ 已改派');
      load();
    });
  }

  // 缺席後新增支援人員
  function quickReplace(gameId, role, btn) {
    const group = btn.closest('.person-group');
    const uid = group?.querySelector('.select-user')?.value;
    if (!uid) {
      toast('請先選支援人員', 'warn');
      return;
    }

    toast('新增支援中...', 'loading');
    callApi({
      action: 'addReplacement',
      game_id: gameId,
      role: role,
      user_id: uid
    }, res => {
      if (!res || res.result !== 'ok') {
        toast(res?.message || '新增失敗', 'error');
        return;
      }
      toast('✅ 支援成功');
      load();
    });
  }

  // 整場標記完成
  function completeGame(gameId) {
    if (!confirm('確定整場完成？')) return;
    callApi({ action: 'completeGame', game_id: gameId }, res => {
      if (res && (res.result === 'ok' || res.success === true)) {
        toast('✅ 整場完成');
        load();
      } else {
        toast('❌ 完成失敗', 'error');
      }
    });
  }

  // 重新開放延賽場次進行補賽
  function reopenGame(gameId) {
    if (!confirm('確定要重新開放此場比賽（補賽）？')) return;
    toast('補賽開啟中...', 'loading');
    callApi({ action: 'reopenGame', game_id: gameId }, res => {
      if (res && res.result === 'ok') {
        toast('✅ 已開放補賽');
        load();
      } else {
        toast(res?.message || '❌ 補賽失敗', 'error');
      }
    });
  }

  // 將賽事設為延賽
  function setGameHold(gameId) {
    if (!confirm('確定要將本場設為延賽？')) return;
    toast('更新中...', 'loading');
    callApi({ action: 'setGameStatus', game_id: gameId, status: 1 }, res => {
      if (res && res.result === 'ok') {
        toast('✅ 已延賽');
        load();
      } else {
        toast('❌ 失敗', 'error');
      }
    });
  }

  // 自動建立尚未產生的出勤資料
  function runAutoAssign() {
    if (!confirm('建立尚未產生的出勤資料？')) return;
    toast('建立中...', 'loading');
    callApi({ action: 'autoCreateAssignment' }, res => {
      if (res && res.result === 'ok') {
        toast(`✅ 已建立 ${res.created || 0} 筆`);
        load();
      } else {
        toast(res?.message || '建立失敗', 'error');
      }
    });
  }

  // 重算全體分數並重新載入
  function recalcScore() {
    if (!confirm('確定重新計算所有分數？')) return;
    toast('分數計算中...', 'loading');
    callApi({ action: 'recalcAllScores' }, res => {
      if (!res || res.result !== 'ok') {
        toast(res?.message || '❌ 計算失敗', 'error');
        return;
      }
      toast('✅ 分數已更新');
      load();
    });
  }

  /*********************************************************
   * 年度統計總表（正確對應後端 res.data、去重與角色分流）
   *********************************************************/

  // 依執勤角色（優先）或帳號設定判斷人員屬於裁判／紀錄
  function classifyYearlyUser_(u) {
    const roles = (u.role_count && typeof u.role_count === 'object') ? u.role_count : {};
    let hasJudge = false;
    let hasRecord = false;

    Object.entries(roles).forEach(([roleCode, count]) => {
      if (Number(count || 0) <= 0) return;
      if (String(roleCode).toUpperCase().startsWith('REC_')) {
        hasRecord = true;
      } else {
        hasJudge = true;
      }
    });

    // 若目前尚無執勤場次紀錄，改以證照等級（格式：裁判等級,紀錄等級）判斷
    if (!hasJudge && !hasRecord) {
      const lvParts = String(u.level || '').split(/[\/／,，]/).map(s => s.trim().toUpperCase());
      if (lvParts[0] && lvParts[0] !== 'N' && lvParts[0] !== 'NONE' && lvParts[0] !== '無') {
        hasJudge = true;
      }
      if (lvParts[1] && lvParts[1] !== 'N' && lvParts[1] !== 'NONE' && lvParts[1] !== '無') {
        hasRecord = true;
      }
    }

    // 最後退回帳號角色欄位
    if (!hasJudge && !hasRecord) {
      const matchedUser = userList.find(x => String(x.user_id) === String(u.user_id));
      const roleStr = String(matchedUser?.role || '').toLowerCase();
      if (roleStr.includes('judge') || roleStr.includes('chief_judge')) hasJudge = true;
      if (roleStr.includes('record') || roleStr.includes('record_chief')) hasRecord = true;
    }

    return { hasJudge, hasRecord };
  }

  // 依 user_id 去除重複項目（保留第一筆完整資料，不重複累加）
  function deduplicateUsers_(list) {
    const seen = new Map();
    (list || []).forEach(item => {
      const key = String(item.user_id || item.name || '').trim();
      if (!key || seen.has(key)) return;
      seen.set(key, { ...item });
    });
    return Array.from(seen.values());
  }

  // 載入年度統計資料並開啟彈窗
  function loadYearly() {
    const year = new Date().getFullYear();
    document.getElementById('yearModal').classList.remove('hidden');
    document.getElementById('yearContent').innerHTML = '載入中...';

    callApi({ action: 'getYearlyExperience', year }, res => {
      if (!res || res.result !== 'ok') {
        document.getElementById('yearContent').innerHTML = '<div class="empty">❌ 讀取失敗</div>';
        return;
      }

      const rawList = Array.isArray(res.data)
        ? res.data
        : [...(res.judge || []), ...(res.record || [])];

      const allUsers = deduplicateUsers_(rawList);
      const judgeList = allUsers.filter(u => classifyYearlyUser_(u).hasJudge);
      const recordList = allUsers.filter(u => classifyYearlyUser_(u).hasRecord);

      window._yearRaw = {
        all: allUsers,
        judge: judgeList,
        record: recordList
      };
      window._yearData = allUsers;
      window._yearType = 'all';

      renderYearTable('all');
    });
  }

  // 渲染指定分類（全部／裁判／紀錄）的年度統計表
  function renderYearTable(type) {
    window._yearType = type;
    const raw = window._yearRaw || { all: [], judge: [], record: [] };
    const list = type === 'judge' ? raw.judge : type === 'record' ? raw.record : raw.all;

    if (!list || !list.length) {
      document.getElementById('yearContent').innerHTML = `${renderYearTabs()}<div class="empty">此分類沒有資料</div>`;
      return;
    }

    const sortedList = deduplicateUsers_(list).sort((a, b) => {
      if ((b.final_score ?? 0) !== (a.final_score ?? 0)) {
        return (b.final_score ?? 0) - (a.final_score ?? 0);
      }
      if ((b.completed ?? 0) !== (a.completed ?? 0)) {
        return (b.completed ?? 0) - (a.completed ?? 0);
      }
      return (a.no_show ?? 0) - (b.no_show ?? 0);
    });

    sortedList.forEach((u, idx) => { u.rank = idx + 1; });

    const rowsHtml = sortedList.map(p => {
      const total = Number(p.attendance ?? 0);
      const completed = Number(p.completed ?? 0);
      const late = Number(p.late ?? 0);
      const noShow = Number(p.no_show ?? 0);
      const career = Number(p.career_completed ?? p.career_attendance ?? total);
      const rate = total > 0 ? Math.round((completed / total) * 100) : 0;
      const stable = (noShow === 0 && completed >= 10) ? '🔥' : '';

      return `
        <tr>
          <td>${rankIcon(p.rank)}</td>
          <td style="font-weight:700;">
            <span style="cursor:pointer;color:#2563eb;" onclick="openUserDetail('${p.user_id}')">
              ${p.name || '-'} ${stable}
            </span>
            <div style="font-size:11px;color:#6b7280;">生涯 ${career} 場</div>
          </td>
          <td>${renderLevel(p.league_level)}</td>
          <td>${total}</td>
          <td style="color:#16a34a">
            ${completed}
            <div style="font-size:11px;color:#999;">${rate}%</div>
          </td>
          <td style="color:#f59e0b">${late}</td>
          <td style="color:#dc2626">${noShow}</td>
          <td>${fmt(p.score_total)}</td>
          <td>${total}</td>
          <td>${fmt(p.quality)}</td>
          <td style="font-weight:800;">${fmt(p.final_score)}</td>
        </tr>
      `;
    }).join('');

    document.getElementById('yearContent').innerHTML = `
      <div style="margin-bottom:10px;">${renderYearTabs()}</div>
      <table class="year-table">
        <thead>
          <tr>
            <th>排名</th>
            <th>姓名</th>
            <th>等級</th>
            <th>出勤</th>
            <th>完成</th>
            <th>遲到</th>
            <th>缺席</th>
            <th>經驗值</th>
            <th>參與度</th>
            <th>出勤品質</th>
            <th>排位分數</th>
          </tr>
        </thead>
        <tbody>${rowsHtml}</tbody>
      </table>
    `;
  }

  // 渲染年度統計分類按鈕
  function renderYearTabs() {
    const raw = window._yearRaw || { all: [], judge: [], record: [] };
    const tabs = [
      { key: 'all', label: `全部 (${raw.all.length})` },
      { key: 'judge', label: `裁判 (${raw.judge.length})` },
      { key: 'record', label: `紀錄 (${raw.record.length})` }
    ];

    return `
      <div style="display:flex; gap:6px; margin-bottom:12px;">
        ${tabs.map(t => {
          const active = window._yearType === t.key;
          const style = active ? 'background:#2563eb;color:#fff;' : 'background:#cbd5e1;color:#333;';
          return `<button class="btn" style="height:32px; ${style}" onclick="switchYearType('${t.key}')">${t.label}</button>`;
        }).join('')}
      </div>
    `;
  }

  // 切換年度統計分類
  function switchYearType(type) {
    renderYearTable(type);
  }

  // 檢視單一成員個人數據彈窗
  function openUserDetail(userId) {
    const p = (window._yearData || []).find(x => String(x.user_id) === String(userId));
    if (!p) return;

    document.getElementById('userModal').classList.remove('hidden');
    document.getElementById('userContent').innerHTML = `
      <h3 style="font-size:16px; font-weight:800; margin-bottom:6px;">${p.name}</h3>
      <div style="color:#64748b; margin-bottom:14px; font-size:13px;">聯盟等級：${renderLevel(p.league_level)}</div>
      <div class="stat-grid">
        ${card('經驗值', fmt(p.score_total))}
        ${card('年度出勤', p.attendance ?? 0)}
        ${card('完成場次', p.completed ?? 0)}
        ${card('排位分數', fmt(p.final_score))}
      </div>
    `;
  }

  function closeYearModal() { document.getElementById('yearModal').classList.add('hidden'); }
  function closeUserModal() { document.getElementById('userModal').classList.add('hidden'); }

  /*********************************************************
   * 格式化與共用顯示輔助
   *********************************************************/
  function fmt(n) {
    const num = Number(n ?? 0);
    return Number.isInteger(num) ? num : num.toFixed(2);
  }

  function rankIcon(r) {
    if (r === 1) return '🥇';
    if (r === 2) return '🥈';
    if (r === 3) return '🥉';
    return r;
  }

  function renderLevel(lv) {
    const map = {
      S: { c: '#9333ea', t: 'S' },
      A: { c: '#2563eb', t: 'A' },
      B: { c: '#16a34a', t: 'B' },
      C: { c: '#d97706', t: 'C' },
      N: { c: '#6b7280', t: 'N' }
    };
    const m = map[lv] || map.N;
    return `<span style="color:${m.c};font-weight:700">${m.t}</span>`;
  }

  function card(label, value) {
    return `<div class="stat-card"><div class="stat-title">${label}</div><div class="stat-value">${value}</div></div>`;
  }

  function getRoleText(role) {
    const map = {
      PU: '主審',
      U1: '一壘審',
      U2: '二壘審',
      U3: '三壘審',
      REC_MAIN: '紀錄員',
      REC_TRAINEE: '實習紀錄員',
      REC_VIDEO: '影像紀錄員'
    };
    return map[role] || role;
  }

  function getTournamentInfo(type) {
    const map = {
      default: { text: '聯盟賽事', color: '#2563eb' },
      cup: { text: '盃賽', color: '#16a34a' },
      league: { text: '聯賽', color: '#7c3aed' }
    };
    return map[type] || map.default;
  }

  // 提示訊息元件
  let currentToast = null;
  function toast(msg, type = 'ok') {
    if (currentToast) {
      currentToast.remove();
      currentToast = null;
    }
    const div = document.createElement('div');
    const colorMap = { ok: '#16a34a', error: '#dc2626', warn: '#f59e0b', loading: '#374151' };
    div.innerHTML = msg;
    div.style = `position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:${colorMap[type] || '#374151'}; color:#fff; padding:10px 16px; border-radius:8px; z-index:9999; font-size:14px; font-weight:600; box-shadow:0 4px 12px rgba(0,0,0,.2);`;
    document.body.appendChild(div);
    currentToast = div;
    if (type !== 'loading') {
      setTimeout(() => {
        if (div === currentToast) {
          div.remove();
          currentToast = null;
        }
      }, 2000);
    }
  }

  // 登出並導回登入頁
  function logout() {
    localStorage.removeItem('session_user');
    window.location.href = 'login.html';
  }
</script>
