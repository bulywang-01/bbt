<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BBT 聯盟 - 出勤確認中心</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- 共用 CSS -->
  <link rel="stylesheet" href="common.css">

  <script src="js/auth.js"></script>
  <script src="js/config.js"></script>
  <script src="js/utils.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap');
    body{ background:#eef2f7; font-family: 'Noto Sans TC', sans-serif; }
    .main{ padding:20px; max-width:1400px; margin:auto; }

    .panel{
      background:#fff;
      padding:18px;
      border-radius:16px;
      box-shadow: 0 4px 12px rgba(15,23,42,.08);
      margin-bottom:18px;
      border:1px solid #e2e8f0;
    }

    /* 遊戲卡片 */
    .game-card{
      background:#fff;
      border-radius:16px;
      padding:16px;
      margin-bottom:14px;
      border:1px solid #e2e8f0;
      box-shadow: 0 2px 8px rgba(0,0,0,.04);
      transition:.2s;
    }
    .game-card:hover{ box-shadow: 0 4px 14px rgba(0,0,0,.08); }
    .game-card.resumed{
      border:2px solid #3b82f6;
      box-shadow:0 4px 12px rgba(59,130,246,0.15);
      background:#eff6ff;
    }

    .game-title{
      font-weight:800;
      font-size:15px;
      color:#0f172a;
      display:flex;
      align-items:center;
      flex-wrap:wrap;
      gap:8px;
      margin-bottom:12px;
      padding-bottom:10px;
      border-bottom:1px solid #f1f5f9;
    }

    .btn-complete-all{
      background:#16a34a;
      color:#fff;
      border:none;
      padding:4px 10px;
      border-radius:8px;
      cursor:pointer;
      font-weight:700;
      font-size:12px;
    }
    .btn-complete-all:hover{ background:#15803d; }

    /* 人員卡 */
    .person{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:10px;
      flex-wrap:wrap;
      padding:10px 12px;
      margin-bottom:6px;
      border-radius:10px;
      background:#fafafa;
      border:1px solid #f1f5f9;
      transition:all .2s ease;
    }
    .person:hover{ background:#f8fafc; }
    .person.completed{ background:#ecfdf5; border-color:#bbf7d0; }
    .person.no_show{ background:#fef2f2; border-color:#fecaca; }
    .person.late{ background:#fffbeb; border-color:#fde68a; }
    .person.hold{ background:#fff7ed; border-color:#ffedd5; }
    .person.cancelled{ background:#e5e7eb; opacity:0.6; }
    .person.replacement{ border-left:4px solid #6366f1; }

    .info{ min-width:160px; }
    .info-line{ font-size:14px; font-weight:500; color:#334155; }

    .actions-box{ display:flex; gap:6px; align-items:center; flex-wrap:wrap; }
    .select-user{ padding:4px 8px; border-radius:8px; border:1px solid #cbd5e1; font-size:13px; background:#fff; height:30px; }

    .btn{
      padding:4px 12px;
      border:none;
      border-radius:999px;
      font-size:12px;
      font-weight:700;
      color:#fff;
      cursor:pointer;
      box-shadow:0 1px 2px rgba(0,0,0,.1);
      transition:.15s;
      height:28px;
      display:inline-flex;
      align-items:center;
      justify-content:center;
    }
    .btn:hover{ transform:translateY(-1px); }
    .btn-ok{ background:#16a34a; }
    .btn-no{ background:#dc2626; }
    .btn-late{ background:#f59e0b; }
    .btn-assign{ background:#3b82f6; }
    .btn-replace{ background:#4f46e5; }

    .tag{
      display:inline-block;
      padding:2px 8px;
      border-radius:10px;
      font-size:12px;
      margin-left:4px;
      font-weight:700;
    }
    .tag-ok{ background:#16a34a; color:#fff; }
    .tag-late{ background:#f59e0b; color:#fff; }
    .tag-no{ background:#dc2626; color:#fff; }
    .tag-replace{ background:#4f46e5; color:#fff; }
    .status-mini{ font-weight:700; margin-left:4px; }

    /* Tabs */
    .tabs{ display:flex; gap:8px; margin-bottom:16px; flex-wrap:wrap; }
    .tab{
      padding:8px 16px;
      border-radius:12px;
      background:#e2e8f0;
      cursor:pointer;
      font-weight:700;
      font-size:13px;
      color:#475569;
      transition:.2s;
    }
    .tab:hover{ background:#cbd5e1; }
    .tab.active{ background:#2563eb; color:#fff; box-shadow:0 4px 12px rgba(37,99,235,0.25); }

    .empty{ text-align:center; color:#94a3b8; padding:40px; font-weight:600; }

    /* Modal */
    .modal{
      position:fixed;
      inset:0;
      background:rgba(15,23,42,0.5);
      backdrop-filter:blur(4px);
      display:flex;
      align-items:center;
      justify-content:center;
      z-index:9999;
    }
    .modal.hidden{ display:none; }
    .modal-box{
      width:90%;
      max-width:900px;
      background:#ffffff;
      border-radius:16px;
      padding:20px;
      max-height:85vh;
      overflow:auto;
      box-shadow:0 20px 25px -5px rgba(0, 0, 0, 0.1);
    }
    .modal-header{ display:flex; justify-content:space-between; align-items:center; font-weight:800; margin-bottom:14px; font-size:18px; color:#0f172a; }

    .year-table{ width:100%; border-collapse:collapse; font-size:14px; }
    .year-table th{ text-align:left; padding:10px; border-bottom:2px solid #e2e8f0; background:#f8fafc; color:#334155; font-weight:700; }
    .year-table td{ padding:10px; border-bottom:1px solid #f1f5f9; }

    .stat-grid{ display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom:16px; }
    @media(max-width:600px){ .stat-grid{ grid-template-columns:repeat(2,1fr); } }
    .stat-card{ background:#fff; border-radius:12px; padding:14px; text-align:center; border:1px solid #e2e8f0; box-shadow:0 2px 6px rgba(0,0,0,0.02); }
    .stat-card:nth-child(1){ border-left:4px solid #2563eb; }
    .stat-card:nth-child(2){ border-left:4px solid #16a34a; }
    .stat-card:nth-child(3){ border-left:4px solid #f59e0b; }
    .stat-card:nth-child(4){ border-left:4px solid #9333ea; }
    .stat-title{ font-size:12px; color:#64748b; margin-bottom:4px; font-weight:700; }
    .stat-value{ font-size:22px; font-weight:900; color:#0f172a; }

    .mini-table{ width:100%; border-collapse:collapse; text-align:center; font-size:14px; }
    .mini-table th, .mini-table td{ padding:8px; border-bottom:1px solid #e2e8f0; }
    .mini-table th{ color:#334155; font-weight:700; background:#f8fafc; }

    .person-group{
      margin-bottom:10px;
      padding:12px;
      background:#f8fafc;
      border-radius:12px;
      border:1px solid #e2e8f0;
    }
    .role-title{ font-weight:700; margin-bottom:8px; color:#334155; font-size:13px; }
    .candidate-row{ display:flex; gap:8px; flex-wrap:wrap; margin-bottom:8px; }
    .candidate{ display:flex; align-items:center; gap:4px; background:#fff; padding:6px 10px; border-radius:8px; border:1px solid #cbd5e1; }
    .name.line-through{ text-decoration:line-through; color:#94a3b8; }
    .name.replace-highlight{ background:#eef2ff; border-radius:6px; padding:2px 6px; color:#3b82f6; font-weight:700; }
    .person-group.highlight{ border:2px solid #3b82f6; background:#eff6ff; }
  </style>
</head>

<script>
  let userList = [];
  let currentTab = 'pending';

  document.addEventListener('DOMContentLoaded', () => {
    if (typeof lucide !== 'undefined') lucide.createIcons();
    loadUserInfo();
    loadUsers();
  });

  function loadUserInfo() {
    const session = (typeof getSession === 'function') ? getSession() : JSON.parse(localStorage.getItem('session_user') || '{}');
    if (session && session.name) {
      document.getElementById('sidebarUserName').textContent = session.name;
      document.getElementById('sidebarUserRole').textContent = session.role || '管理員';
      document.getElementById('sidebarAvatar').textContent = session.name.charAt(0);
    }
  }

  function toggleSidebar() {
    const sidebar = document.getElementById('sidebar');
    const overlay = document.getElementById('sidebar-overlay');
    sidebar.classList.toggle('-translate-x-full');
    overlay.classList.toggle('hidden');
  }

  function loadUsers(){
    callApi({action:'getUsers'}, res=>{
      if(!res || res.result !== 'ok'){
        toast('讀取使用者失敗','error');
        return;
      }
      userList = res.users || [];
      load();
    });
  }

  function isGameReady(g){
    if (!g) return false;
    const gameDate = new Date(g.date);
    if (isNaN(gameDate)) return false;

    const today = new Date();
    today.setHours(0,0,0,0);
    gameDate.setHours(0,0,0,0);

    const isPast = gameDate <= today;
    const status = Number(g.status);

    return isPast && (status === 0 || status === 1 || status === 4);
  }

  function isGameLocked(g){
    return (g.list || []).length > 0 && g.list.every(p => p.status === 'completed' || p.status === 'late');
  }

  function load(){
    const el = document.getElementById('list');
    el.innerHTML = `<div class="empty">⏳ 資料載入中...</div>`;

    callApi({action:'getAssignments'}, res=>{
      if(!res || !res.data){
        el.innerHTML = `<div class="empty">❌ 讀取失敗</div>`;
        return;
      }

      const games = res.data;
      window._lastData = games;
      const data = games.filter(g => isGameReady(g));
      render(data);
    });
  }

  function render(list){
    const el = document.getElementById('list');

    const pending = list.filter(g => Number(g.status) === 0);
    const done = list.filter(g => Number(g.status) === 4);
    const hold = list.filter(g => Number(g.status) === 1);
    const resumed = list.filter(g => Number(g.from_hold) === 1);

    let data = [];
    if (currentTab === 'pending') data = pending;
    if (currentTab === 'done') data = done;
    if (currentTab === 'hold') data = hold;
    if (currentTab === 'resumed') data = resumed;

    el.innerHTML = `
      <div class="tabs">
        <div class="tab ${currentTab==='pending'?'active':''}" onclick="switchTab('pending')">🔴 未完成 (${pending.length})</div>
        <div class="tab ${currentTab==='done'?'active':''}" onclick="switchTab('done')">✅ 已完成 (${done.length})</div>
        <div class="tab ${currentTab==='hold'?'active':''}" onclick="switchTab('hold')">⚠️ 延賽 (${hold.length})</div>
        <div class="tab ${currentTab==='resumed'?'active':''}" onclick="switchTab('resumed')">🔄 補賽 (${resumed.length})</div>
      </div>
      ${data.length ? data.map(renderGame).join('') : '<div class="empty">目前沒有此分類的出勤資料</div>'}
    `;
  }

  function switchTab(t){
    currentTab = t;
    load();
  }

  function renderGame(g){
    const statusNum = Number(g.status || 0);
    const isResumed = Number(g.from_hold || 0) === 1;
    const info = getTournamentInfo(g.tournament_type || 'default');

    let statusHTML = '';
    if (statusNum === 1){
      statusHTML = `
        <span style="margin-left:10px;color:#f59e0b;font-weight:700;">⚠️ 延賽</span>
        <button class="btn" style="margin-left:8px;background:#2563eb;" onclick="reopenGame('${g.game_id}')">🔄 補賽</button>
      `;
    } else if (statusNum === 2){
      statusHTML = `<span style="margin-left:10px;color:#6b7280;font-weight:700;">⛔ 停賽</span>`;
    } else if (statusNum === 4){
      statusHTML = isResumed 
        ? `<span style="margin-left:10px;color:#2563eb;font-weight:700;">🔄 補賽完成</span>` 
        : `<span style="margin-left:10px;color:#16a34a;font-weight:700;">✅ 已完成</span>`;
    } else {
      if (isResumed){
        statusHTML += `<span style="margin-left:10px;color:#2563eb;font-weight:700;">🔄 補賽中</span>`;
      }
      if (!isGameLocked(g)){
        statusHTML += `
          <button class="btn-complete-all" onclick="completeGame('${g.game_id}')">✅ 整場完成</button>
          <button class="btn" style="margin-left:8px;background:#f59e0b;" onclick="setGameHold('${g.game_id}')">⚠️ 延賽</button>
        `;
      } else {
        statusHTML += `<span style="margin-left:10px;color:#16a34a;font-weight:700;">✅ 已完成</span>`;
      }
    }

    const cardClass = isResumed ? 'game-card resumed' : 'game-card';

    return `
      <div class="${cardClass}" data-game-id="${g.game_id}">
        <div class="game-title">
          <span>📅 ${g.date} ｜ ${g.game_code || ''} ｜ ${g.field || ''}</span>
          <span>｜ <span style="color:${info.color || '#2563eb'};font-weight:700;">${info.text || '聯盟賽事'}</span></span>
          ${statusHTML}
        </div>
        ${renderGroup(g)}
      </div>
    `;
  }

  function renderGroup(g){
    const list = g.list || [];
    const roleMap = {};
    list.forEach(p=>{
      if (!roleMap[p.role]) roleMap[p.role] = [];
      roleMap[p.role].push(p);
    });

    let html = '';
    Object.keys(roleMap).forEach(role=>{
      if (!role || role === 'undefined') return;
      html += renderRoleRow(role, roleMap[role], g);
    });
    return html;
  }

  function renderRoleRow(role, rows, g){
    rows.sort((a,b)=> new Date(a.create_at || 0) - new Date(b.create_at || 0));

    const hasNoShow = rows.some(x => x.status === 'no_show');
    const firstAssign = rows.find(x => x.assignment_id);
    const original = rows.find(x => Number(x.is_replacement) !== 1);
    const replacement = rows.find(x => Number(x.is_replacement) === 1);

    function renderTag(p){
      if (!p) return '';
      const statusTag = p.status === 'completed' ? '<span class="tag tag-ok">完</span>'
        : p.status === 'late' ? '<span class="tag tag-late">遲</span>'
        : p.status === 'no_show' ? '<span class="tag tag-no">缺</span>'
        : (p.status === 'scheduled' && p.name) ? '<span class="status-mini" style="color:#888;">待</span>' : '';

      const replaceTag = Number(p.is_replacement) === 1 ? '<span class="tag tag-replace">支</span>' : '';
      const extraClass = `${p.status === 'no_show' ? 'line-through' : ''} ${Number(p.is_replacement) === 1 ? 'replace-highlight' : ''}`;

      return `<span class="name ${extraClass}">${p.name || '（未確認）'} ${statusTag}${replaceTag}</span>`;
    }

    let candidateHTML = '';
    if (replacement){
      candidateHTML = `
        <div class="candidate">${renderTag(original)}<span style="margin:0 6px;">／</span>${renderTag(replacement)}</div>
      `;
    } else {
      candidateHTML = rows.map(p => `<div class="candidate">${renderTag(p)}</div>`).join('');
    }

    const highlightClass = role === 'PU' ? 'highlight' : '';

    return `
      <div class="person-group ${highlightClass}">
        <div class="role-title">${getRoleText(role)}</div>
        <div class="candidate-row">${candidateHTML}</div>
        <div class="actions-box">
          <button class="btn btn-ok" onclick="handleAutoDecision('${g.game_id}','${role}','completed')">完成</button>
          <button class="btn btn-late" onclick="handleAutoDecision('${g.game_id}','${role}','late')">遲到</button>
          <button class="btn btn-no" onclick="handleAutoDecision('${g.game_id}','${role}','no_show')">缺席</button>
          ${(!hasNoShow && firstAssign) ? `<button class="btn btn-assign" onclick="quickAssign('${firstAssign.assignment_id}', this)">改派</button>` : ''}
          ${hasNoShow ? `<button class="btn btn-replace" onclick="quickReplace('${g.game_id}','${role}', this)">+ 支援</button>` : ''}
          <select class="select-user">
            <option value="">選擇人員</option>
            ${userList.filter(u => {
              if (u.role.includes('admin')) return false;
              if (role.startsWith('REC')) return u.role.includes('record') || u.role.includes('record_chief');
              return u.role.includes('judge') || u.role.includes('chief_judge');
            }).map(u => `<option value="${u.user_id}">${u.name || u.username}</option>`).join('')}
          </select>
        </div>
      </div>
    `;
  }

  function handleAutoDecision(gameId, role, status){
    const g = window._lastData?.find(x => x.game_id == gameId);
    if (!g){ toast('找不到賽事','error'); return; }

    const list = g.list.filter(x => x.role === role);
    const replacement = list.find(x => Number(x.is_replacement) === 1);
    let targetId = replacement ? replacement.assignment_id : (list.find(x => Number(x.is_replacement) !== 1 && x.assignment_id)?.assignment_id || '');

    if (!targetId){
      toast('找不到可操作人員','error');
      return;
    }
    updateStatus(targetId, status);
  }

  function updateStatus(id, status){
    const textMap = { completed:'完成', no_show:'缺席', late:'遲到', scheduled:'重置' };
    toast(`更新狀態中...`,'loading');

    callApi({
      action:'updateAssignment',
      assignment_id:id,
      status:status
    }, res=>{
      if (res && res.result === 'ok'){
        toast(`✅ 已標記：${textMap[status] || status}`);
        load();
      } else {
        toast(res?.message || '更新失敗','error');
      }
    });
  }

  function quickAssign(id, btn){
    const group = btn.closest('.person-group');
    const select = group?.querySelector('.select-user');
    const uid = select?.value;

    if (!uid){ toast('請先選人','warn'); return; }

    const gameId = btn.closest('.game-card')?.dataset.gameId;
    const g = window._lastData?.find(x => x.game_id == gameId);
    const p = (g?.list || []).find(x => x.assignment_id == id);

    if (!p){ toast('找不到人員資料','error'); return; }
    const role = p.role;

    let params = !role.startsWith('REC') ? {
      action: 'assignJudgeToPosition_admin',
      game_id: gameId,
      role: role,
      judge_id: uid
    } : {
      action: 'assignRecord_admin',
      game_id: gameId,
      record_role: role,
      user_id: uid
    };

    callApi(params, (res)=>{
      if (!res || res.result !== 'ok'){
        toast(res?.message || '❌ 改派失敗','error');
        return;
      }
      toast('✅ 已改派');
      load();
    });
  }

  function quickReplace(gameId, role, btn){
    const group = btn.closest('.person-group');
    const select = group?.querySelector('.select-user');
    const uid = select?.value;

    if (!uid){ toast('請先選支援人員','warn'); return; }
    toast('新增支援中...','loading');

    callApi({
      action:'addReplacement',
      game_id:gameId,
      role:role,
      user_id:uid
    }, (res)=>{
      if(!res || res.result !== 'ok'){
        toast(res?.message || '新增失敗','error');
        return;
      }
      toast('✅ 支援成功');
      load();
    });
  }

  function completeGame(gameId){
    if(!confirm('確定整場完成？')) return;
    callApi({ action:'completeGame', game_id:gameId }, res=>{
      if (res && (res.result === 'ok' || res.success === true)){
        toast('✅ 整場完成');
        load();
      } else {
        toast('❌ 完成失敗','error');
      }
    });
  }

  function reopenGame(gameId){
    if (!confirm('確定要重新開放此場比賽（補賽）？')) return;
    toast('補賽開啟中...','loading');
    callApi({ action:'reopenGame', game_id:gameId }, res=>{
      if (res && res.result === 'ok'){
        toast('✅ 已開放補賽');
        load();
      } else {
        toast(res?.message || '❌ 補賽失敗','error');
      }
    });
  }

  function setGameHold(gameId){
    if (!confirm('確定要將本場設為延賽？')) return;
    toast('更新中...','loading');
    callApi({ action:'setGameStatus', game_id:gameId, status:1 }, res=>{
      if (res && res.result === 'ok'){
        toast('✅ 已延賽');
        load();
      } else {
        toast('❌ 失敗','error');
      }
    });
  }

  function runAutoAssign(){
    if(!confirm('建立尚未產生的出勤資料？')) return;
    toast('建立中...','loading');
    callApi({ action:'autoCreateAssignment' }, res=>{
      if (res && res.result === 'ok'){
        toast(`✅ 已建立 ${res.created || 0} 筆`);
        load();
      } else {
        toast(res?.message || '建立失敗','error');
      }
    });
  }

  function recalcScore(){
    if(!confirm('確定重新計算所有分數？')) return;
    toast('分數計算中...','loading');
    callApi({ action:'recalcAllScores' }, res=>{
      if (!res || res.result !== 'ok'){
        toast(res?.message || '❌ 計算失敗','error');
        return;
      }
      toast(`✅ 分數已更新`);
    });
  }

  function loadYearly(){
    const year = new Date().getFullYear();
    document.getElementById('yearModal').classList.remove('hidden');
    document.getElementById('yearContent').innerHTML = '載入中...';

    callApi({ action:'getYearlyExperience', year:year }, res=>{
      if (!res || res.result !== 'ok'){
        document.getElementById('yearContent').innerHTML = '<div class="empty">❌ 讀取失敗</div>';
        return;
      }
      const judge = res.judge || [];
      const record = res.record || [];
      window._yearRaw = { judge, record, allAssignments: [] };
      window._yearData = [...judge, ...record];
      window._yearType = 'all';

      callApi({action:'getAssignments'}, res2=>{
        window._yearRaw.allAssignments = res2?.data || [];
        renderYearTable('all');
      });
    });
  }

  function renderYearTable(type){
    window._yearType = type;
    let list = type === 'judge' ? window._yearRaw.judge : type === 'record' ? window._yearRaw.record : window._yearData;
    if (!list.length){
      document.getElementById('yearContent').innerHTML = '<div class="empty">此分類沒有資料</div>';
      return;
    }
    drawTable(list);
  }

  function renderYearTabs(){
    return `
      <div style="display:flex; gap:6px; margin-bottom:12px;">
        <button class="btn" style="height:32px; ${window._yearType==='all'?'background:#2563eb;':'background:#cbd5e1;color:#333;'}" onclick="switchYearType('all')">全部 (${window._yearData.length})</button>
        <button class="btn" style="height:32px; ${window._yearType==='judge'?'background:#2563eb;':'background:#cbd5e1;color:#333;'}" onclick="switchYearType('judge')">裁判 (${window._yearRaw.judge.length})</button>
        <button class="btn" style="height:32px; ${window._yearType==='record'?'background:#2563eb;':'background:#cbd5e1;color:#333;'}" onclick="switchYearType('record')">紀錄 (${window._yearRaw.record.length})</button>
      </div>
    `;
  }

  function switchYearType(type){
    renderYearTable(type);
  }

  function fmt(n){
    const num = Number(n ?? 0);
    return Number.isInteger(num) ? num : num.toFixed(2);
  }

  function rankIcon(r){
    if (r === 1) return '🥇';
    if (r === 2) return '🥈';
    if (r === 3) return '🥉';
    return r;
  }

// 表格（最終UI + 去重處理）
function drawTable(list){

  // ✅ 透過 Map 以 user_id 進行去重，避免重複的使用者被列出多次
  const uniqueMap = new Map();
  list.forEach(item => {
    const uid = String(item.user_id || item.name); // 優先用 user_id，若無則用 name
    if (!uniqueMap.has(uid)) {
      // 深拷貝一份避免汙染原始資料
      uniqueMap.set(uid, { ...item });
    } else {
      // 若重複出現，可將數據進行累加或合併（視需求而定，這裡示範數值累加）
      const existing = uniqueMap.get(uid);
      existing.attendance = (Number(existing.attendance) || 0) + (Number(item.attendance) || 0);
      existing.completed = (Number(existing.completed) || 0) + (Number(item.completed) || 0);
      existing.late = (Number(existing.late) || 0) + (Number(item.late) || 0);
      existing.no_show = (Number(existing.no_show) || 0) + (Number(item.no_show) || 0);
      existing.score_total = (Number(existing.score_total) || 0) + (Number(item.score_total) || 0);
      // 分數或權重可取較高者或平均
      existing.final_score = Math.max(Number(existing.final_score) || 0, Number(item.final_score) || 0);
    }
  });

  // 轉回陣列
  const dedupedList = Array.from(uniqueMap.values());

  dedupedList.sort((a,b)=>{
    if ((b.final_score ?? 0) !== (a.final_score ?? 0)){
      return (b.final_score ?? 0) - (a.final_score ?? 0);
    }
    if ((b.completed ?? 0) !== (a.completed ?? 0)){
      return (b.completed ?? 0) - (a.completed ?? 0);
    }
    return (a.no_show ?? 0) - (b.no_show ?? 0);
  });

  dedupedList.forEach((u,i)=> u.rank = i+1);

  let html = '';

  html += '<div style="margin-bottom:10px;">';
  html += renderYearTabs();
  html += '</div>';

  html += '<table class="year-table">';
  html += '<thead><tr>';

  html += '<th>排名</th>';
  html += '<th>姓名</th>';
  html += '<th>等級</th>';
  html += '<th>出勤</th>';
  html += '<th>完成</th>';
  html += '<th>遲到</th>';
  html += '<th>缺席</th>';
  html += '<th>經驗值</th>';
  html += '<th>參與度</th>';
  html += '<th>出勤品質</th>';
  html += '<th>排位分數</th>';

  html += '</tr></thead><tbody>';

  dedupedList.forEach(p=>{

    const total = p.attendance ?? 0;
    const career = p.career_attendance ?? total;

    const rate = total > 0
      ? Math.round((p.completed / total) * 100)
      : 0;

    const stable =
      (p.no_show === 0 && p.completed >= 10) ? '🔥' : '';

    html += '<tr>';

    html += '<td>'+rankIcon(p.rank)+'</td>';

    html += '<td style="font-weight:700;">';
    html += '<span style="cursor:pointer;color:#2563eb;" onclick="openUserDetail(\''+p.user_id+'\')">';
    html += (p.name || '-') + ' ' + stable;
    html += '</span>';

    html += '<div style="font-size:11px;color:#6b7280;">';
    html += '生涯 ' + career + ' 場';
    html += '</div>';
    html += '</td>';

    html += '<td>'+renderLevel(p.league_level)+'</td>';

    html += '<td>'+total+'</td>';

    html += '<td style="color:#16a34a">';
    html += p.completed;
    html += '<div style="font-size:11px;color:#999;">'+rate+'%</div>';
    html += '</td>';

    html += '<td style="color:#f59e0b">'+p.late+'</td>';
    html += '<td style="color:#dc2626">'+p.no_show+'</td>';

    html += '<td>'+fmt(p.score_total)+'</td>';
    html += '<td>'+total+'</td>';
    html += '<td>'+fmt(p.quality)+'</td>';
    html += '<td style="font-weight:800;">'+fmt(p.final_score)+'</td>';

    html += '</tr>';

  });

  html += '</tbody></table>';

  document.getElementById('yearContent').innerHTML = html;
}

  function renderLevel(lv){
    const map = { S:{c:'#9333ea',t:'S'}, A:{c:'#2563eb',t:'A'}, B:{c:'#16a34a',t:'B'}, C:{c:'#d97706',t:'C'}, N:{c:'#6b7280',t:'N'} };
    const m = map[lv] || map.N;
    return `<span style="color:${m.c};font-weight:700">${m.t}</span>`;
  }

  function closeYearModal(){ document.getElementById('yearModal').classList.add('hidden'); }
  function closeUserModal(){ document.getElementById('userModal').classList.add('hidden'); }

  function openUserDetail(userId){
    if (!window._yearRaw?.allAssignments?.length){ alert('資料尚未載入完成'); return; }
    const p = (window._yearData || []).find(x => String(x.user_id) === String(userId));
    if (!p) return;

    document.getElementById('userModal').classList.remove('hidden');
    document.getElementById('userContent').innerHTML = `
      <h3 style="font-size:16px; font-weight:800; margin-bottom:6px;">${p.name}</h3>
      <div style="color:#64748b; margin-bottom:14px; font-size:13px;">聯盟等級：${renderLevel(p.league_level)}</div>
      <div class="stat-grid">
        ${card('經驗值', fmt(p.score_total))}
        ${card('年度出勤', p.attendance ?? 0)}
        ${card('完成場次', p.completed ?? 0)}
        ${card('排位分數', fmt(p.final_score))}
      </div>
    `;
  }

  function card(label, value){
    return `<div class="stat-card"><div class="stat-title">${label}</div><div class="stat-value">${value}</div></div>`;
  }

  function getRoleText(role){
    const map = { PU:'主審', U1:'一壘審', U2:'二壘審', U3:'三壘審', REC_MAIN:'紀錄員', REC_TRAINEE:'實習紀錄員', REC_VIDEO:'影像紀錄員' };
    return map[role] || role;
  }

  function getTournamentInfo(type){
    const map = {
      default: { text: '聯盟賽事', color: '#2563eb' },
      cup: { text: '盃賽', color: '#16a34a' },
      league: { text: '聯賽', color: '#7c3aed' }
    };
    return map[type] || map.default;
  }

  let currentToast = null;
  function toast(msg, type='ok'){
    if (currentToast){ currentToast.remove(); currentToast = null; }
    const div = document.createElement('div');
    const colorMap = { ok:'#16a34a', error:'#dc2626', warn:'#f59e0b', loading:'#374151' };
    div.innerHTML = msg;
    div.style = `position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:${colorMap[type] || '#374151'}; color:#fff; padding:10px 16px; border-radius:8px; z-index:9999; font-size:14px; font-weight:600; box-shadow:0 4px 12px rgba(0,0,0,.2);`;
    document.body.appendChild(div);
    currentToast = div;
    if (type !== 'loading'){
      setTimeout(()=>{ if (div === currentToast){ div.remove(); currentToast = null; } }, 2000);
    }
  }

  function logout() {
    localStorage.removeItem('session_user');
    window.location.href = 'login.html';
  }
</script>
</body>
</html>
